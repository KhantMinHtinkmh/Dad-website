            "Triggers": {
                title: "Triggers",
                author: "Marshall Goldsmith",
                description: "ဤစာအုပ်သည် ကမ္ဘာကျော် စီမံခန့်ခွဲမှုပညာရှင် Marshall Goldsmith ရေးသားထားသော 'Triggers' ဖြစ်ပြီး လူသားတို့၏ အမူအကျင့် ပြောင်းလဲခြင်း ဆိုင်ရာ အခက်အခဲများကို ဆွေးနွေးတင်ပြထားပါသည်။ ကျွန်ုပ်တို့၏ အတွေးနှင့် လုပ်ရပ်များကို ပုံဖော်ပေးနေသော ပတ်ဝန်းကျင်မှ လှုံ့ဆော်မှုများ (Triggers) ကို မည်သို့သိရှိနားလည်ပြီး ထိန်းချုပ်ရမည်ကို ရှင်းလင်းထားသည်။ စာရေးသူက လူတို့သည် မိမိဖြစ်ချင်သော ပုံစံသို့ ပြောင်းလဲရန် ကြိုးစားရာတွင် နောင်တ နှင့် အဟန့်အတားများ ကို မည်သို့ကျော်လွှားရမည်ကို လက်တွေ့ကျသော နည်းလမ်းများဖြင့် လမ်းညွှန်ပေးထားပါသည်။ အောင်မြင်သော ခေါင်းဆောင်များ၏ အတွေ့အကြုံများကို အခြေခံ၍ မိမိကိုယ်ကိုယ် ဆန်းစစ်ခြင်း နှင့် စနစ်တကျ ပြောင်းလဲခြင်း တို့၏ အရေးပါမှုကို ဖော်ပြထားပါသည်။ နောက်ဆုံးတွင် ဤစာအုပ်သည် လူတစ်ဦးချင်းစီအား မိမိအမှန်တကယ် ဖြစ်ချင်သောသူ ဖြစ်လာစေရန်နှင့် ဘဝတွင် နောင်တကင်းစွာ နေထိုင်နိုင်ရန် ကူညီပေးသည့် လမ်းညွှန်ချက်တစ်ခု ဖြစ်ပါသည်။",
                cover: "/bookcovers/Triggers.jpg",
                audio: "audio/the-coaching-habit.mp3",
                summaryHeading: "<h2>ကိုယ်ဖြစ်ချင်တဲ့သူ အမှန်တကယ်ဖြစ်လာစေဖို့ ပတ်ဝန်းကျင်ရဲ့ လွှမ်းမိုးမှုတွေကို ကျော်လွှားခြင်း</h2>",
                summaryParagraphs: [
  '<h3>Marshall Goldsmith ၏ Triggers စာအုပ်မိတ်ဆက်</h3><p>ဒီပြဿနာကို ကမ္ဘာကျော် ခေါင်းဆောင်မှုဆိုင်ရာ နည်းပြ (Executive Coach) တစ်ဦးဖြစ်တဲ့ Marshall Goldsmith က သူ့ရဲ့ "Triggers: Creating Behavior That Lasts--Becoming the Person You Want to Be" ဆိုတဲ့ စာအုပ်မှာ အလွန်တရာ စိတ်ဝင်စားဖွယ်ကောင်းအောင် တင်ပြထားပါတယ်။ Marshall Goldsmith ဟာ ကမ္ဘာ့ထိပ်တန်း ကုမ္ပဏီကြီးတွေက စီအီးအို (CEO) တွေကို ပြောင်းလဲတိုးတက်အောင် နည်းပြပေးခဲ့တဲ့ အတွေ့အကြုံတွေကနေတဆင့် ဒီစာအုပ်ကို ရေးသားခဲ့တာ ဖြစ်ပါတယ်။ သူ့ရဲ့ အဓိက အဆိုပြုချက်ကတော့ ကျွန်တော်တို့ရဲ့ ပတ်ဝန်းကျင်ဟာ ကျွန်တော်တို့ကို အမြဲတမ်း စမ်းသပ်နေတဲ့၊ အမြဲတမ်း လွှမ်းမိုးနေတဲ့ အင်အားစုကြီး တစ်ခုဖြစ်တယ်ဆိုတာပါပဲ။ ကိုယ်က ဘယ်လောက်ပဲ စိတ်ရှည်မယ်လို့ ဆုံးဖြတ်ထားပါစေ၊ ရုံးရောက်တဲ့အခါ အလုပ်တွေ အရမ်းများလာတာ၊ လုပ်ဖော်ကိုင်ဖက်တွေက အဆင်မပြေတာတွေ လုပ်လာတဲ့အခါ အလိုလို ဒေါသထွက်သွားတတ်ပါတယ်။ ဒီလိုမျိုး ကိုယ့်ရဲ့ မူလရည်မှန်းချက်ကို သွေဖည်သွားစေတဲ့ တွန်းအားပေးမှုတွေ၊ လှုံ့ဆော်မှုတွေကို စာရေးသူက <b>Triggers</b> လို့ ခေါ်ဝေါ်သုံးနှုန်းထားပါတယ်။ ဒီစာအုပ်ဟာ အဲဒီ Triggers တွေကို ဘယ်လို သတိပြုမိအောင် လုပ်မလဲ၊ ဘယ်လို ထိန်းချုပ်မလဲဆိုတာကို နက်နက်ရှိုင်းရှိုင်း ဆွေးနွေးထားတဲ့အတွက် လုပ်ငန်းခွင်မှာရော၊ ပုဂ္ဂိုလ်ရေးဘဝမှာပါ အောင်မြင်ချင်သူတိုင်း မဖြစ်မနေ လေ့လာသင့်တဲ့ အတွေးအခေါ်တွေကို ပေးစွမ်းနိုင်မှာ ဖြစ်ပါတယ်။</p>',
  '<h3>စာအုပ်၏ အနှစ်သာရနှင့် အတွေးအခေါ်များ</h3><p>ဒီစာအုပ်ရဲ့ အဓိက အနှစ်သာရတွေကို လေ့လာကြည့်တဲ့အခါ ပထမဆုံး အနေနဲ့ <b>ပတ်ဝန်းကျင်၏ လွှမ်းမိုးမှု (The Power of Environment)</b> ကို နားလည်ဖို့ အလွန်အရေးကြီးပါတယ်။ ကျွန်တော်တို့ အများစုဟာ ကိုယ့်ရဲ့ ဆုံးဖြတ်ချက်နဲ့ ကိုယ့်ရဲ့ စိတ်ဆန္ဒအပေါ်မှာပဲ အလွန်အကျွံ ယုံကြည်မှု လွန်ကဲနေတတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ့် လက်တွေ့မှာတော့ ပတ်ဝန်းကျင်ဆိုတာ ကျွန်တော်တို့ကို အချိန်တိုင်း လွှမ်းမိုးနေတဲ့၊ ကျွန်တော်တို့ရဲ့ အပြုအမူတွေကို အလိုအလျောက် ပြောင်းလဲသွားစေနိုင်တဲ့ အစွမ်းထက် စက်ယန္တရားကြီး တစ်ခု ဖြစ်ပါတယ်။ ဥပမာအားဖြင့် အိမ်မှာ မိသားစုနဲ့ အေးအေးချမ်းချမ်း နေတတ်တဲ့သူ တစ်ယောက်ဟာ ကားလမ်းပိတ်ဆို့နေတဲ့ အချိန်မှာ တခြားကားက ဝင်တိုးတာကို ခံရတဲ့အခါ ချက်ချင်းဆိုသလို ကြမ်းတမ်းတဲ့ စကားတွေ ပြောထွက်သွားတတ်ပါတယ်။ အဲဒီအခါမှာ သူ့ရဲ့ မူလစရိုက်လက္ခဏာ ပျောက်ဆုံးသွားပြီး ပတ်ဝန်းကျင်က ဖန်တီးလိုက်တဲ့ အခြေအနေအရ တုံ့ပြန်လိုက်မိတာ ဖြစ်ပါတယ်။ စာရေးသူက ဒီလိုမျိုး အခြေအနေတွေကို ဥပမာပေးပြီး ပတ်ဝန်းကျင်ရဲ့ စိန်ခေါ်မှုတွေကို ကျွန်တော်တို့ အနေနဲ့ လျှော့မတွက်ဖို့ အလေးအနက် သတိပေးထားပါတယ်။ ကျွန်တော်တို့ဟာ ကိုယ်ဖြစ်ချင်တဲ့သူ ဖြစ်လာဖို့အတွက်ဆိုရင် ကိုယ့်ကို လမ်းချော်သွားစေနိုင်တဲ့ Triggers တွေကို ကြိုတင် ခန့်မှန်းပြီး ပြင်ဆင်ထားဖို့ လိုအပ်တယ်ဆိုတာကို နားလည်သဘောပေါက်ရမှာ ဖြစ်ပါတယ်။</p><p>ဒုတိယမြောက် အရေးပါတဲ့ သဘောတရားကတော့ <b>ပြောင်းလဲခြင်း စက်ဝိုင်း (The Wheel of Change)</b> ပဲ ဖြစ်ပါတယ်။ လူတွေက ပြောင်းလဲမှုလို့ ပြောလိုက်တာနဲ့ အကျင့်သစ်တွေ ဖန်တီးတာ၊ ဒါမှမဟုတ် အကျင့်ဆိုးတွေ ဖျောက်တာကိုပဲ ပြေးမြင်တတ်ကြပါတယ်။ ဒါပေမဲ့ Marshall Goldsmith က ပြောင်းလဲခြင်းကို အပိုင်းလေးပိုင်းနဲ့ သေချာ ခွဲခြမ်းစိတ်ဖြာ ပြထားပါတယ်။ ပထမတစ်ခုကတော့ ဖန်တီးခြင်း (Creating) ဖြစ်ပြီး ကိုယ့်မှာ မရှိသေးတဲ့ အပြုအမူကောင်းတွေကို အသစ်တဖန် မွေးမြူတာ ဖြစ်ပါတယ်။ ဒုတိယတစ်ခုကတော့ ထိန်းသိမ်းခြင်း (Preserving) ပါ။ ဒါက အရမ်းကို အရေးကြီးပါတယ်။ ကိုယ့်ဆီမှာ ရှိပြီးသား ကောင်းမွန်တဲ့ အရည်အချင်းတွေကို ပတ်ဝန်းကျင် အခြေအနေတွေ ဘယ်လိုပဲ ပြောင်းလဲသွားပါစေ ဆက်လက် ထိန်းသိမ်းထားနိုင်ဖို့ ကြိုးစားရတာ ဖြစ်ပါတယ်။ တတိယတစ်ခုကတော့ ဖယ်ရှားခြင်း (Eliminating) ဖြစ်ပြီး ကိုယ့်ရဲ့ တိုးတက်မှုကို အဟန့်အတား ဖြစ်စေတဲ့ အကျင့်ဆိုးတွေကို ရဲရဲဝံ့ဝံ့ စွန့်လွှတ်တာပါ။ နောက်ဆုံး စတုတ္ထတစ်ခုကတော့ လက်ခံခြင်း (Accepting) ဖြစ်ပါတယ်။ ကျွန်တော်တို့ ဘဝမှာ ကိုယ်တိုင် ပြောင်းလဲလို့မရတဲ့ အရာတွေ၊ ဥပမာ- ကုမ္ပဏီရဲ့ မူဝါဒတွေ၊ ဒါမှမဟုတ် အထက်လူကြီးရဲ့ ပြောင်းလဲလို့ မရတဲ့ စရိုက်လက္ခဏာတွေကို အလကားနေရင်း ဒေါသထွက်ပြီး အချိန်ဖြုန်းနေမယ့် အစား အရှိကို အရှိအတိုင်း လက်ခံပြီး ရှေ့ဆက်နိုင်ဖို့ လိုအပ်တယ်ဆိုတာကို ဒီပြောင်းလဲခြင်း စက်ဝိုင်းကနေတဆင့် သွန်သင်ပေးထားပါတယ်။</p><p>တတိယမြောက် အထင်ရှားဆုံးနဲ့ ဒီစာအုပ်ရဲ့ အသက်သွေးကြောလို့ ခေါ်ဆိုနိုင်တဲ့ အချက်ကတော့ <b>တက်ကြွသော မေးခွန်းများ (Active Questions)</b> ရဲ့ အသုံးဝင်မှုပဲ ဖြစ်ပါတယ်။ ပုံမှန်အားဖြင့် ကျွန်တော်တို့ဟာ ကိုယ့်ကိုယ်ကိုယ် ဆန်းစစ်တဲ့အခါ "ငါ ဒီနေ့ ရည်မှန်းချက်တွေ ပြည့်မီခဲ့ရဲ့လား" ဆိုတဲ့ Passive မေးခွန်းမျိုးကိုသာ မေးလေ့ရှိပါတယ်။ အဲဒီလို မေးတဲ့အခါ အဖြေက မပြည့်မီဘူးဆိုရင် ကျွန်တော်တို့ ဦးနှောက်က အလိုအလျောက် ဆင်ခြေတွေ ရှာပါတော့တယ်။ "ဒီနေ့ ရာသီဥတု မကောင်းလို့၊ အလုပ်မှာ Boss က အလုပ်တွေ ပုံပေးလိုက်လို့" စသဖြင့် ပတ်ဝန်းကျင်ကို အပြစ်တင်တတ်ကြပါတယ်။ ဒီနေရာမှာ စာရေးသူက အဲဒီမေးခွန်းတွေကို Active Questions တွေအဖြစ် ပြောင်းလဲပစ်ဖို့ အကြံပြုထားပါတယ်။ ဆိုလိုတာက "ငါ ဒီနေ့ ရည်မှန်းချက်တွေ ပြည့်မီဖို့အတွက် <b>ငါ့ဘက်က အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား</b> (Did I do my best to...)" ဆိုပြီး ပြောင်းမေးရမှာ ဖြစ်ပါတယ်။ ဒီလို ပြောင်းမေးလိုက်တဲ့အတွက် ကြောင့်မို့လို့ အပြစ်တင်စရာ ဆင်ခြေပေးစရာ လမ်းကြောင်း ပိတ်သွားပြီး မိမိရဲ့ တာဝန်ယူမှု၊ တာဝန်ခံမှု အပြည့်အဝ ရှိလာစေပါတယ်။ ကိုယ် အကောင်းဆုံး မကြိုးစားခဲ့ဘူးဆိုရင် ကိုယ့်အမှားပဲ ဖြစ်တဲ့အတွက် နောက်နေ့တွေမှာ ပိုပြီး သတိထား ကြိုးစားလာအောင် တွန်းအားပေးရာ ရောက်ပါတယ်။ ဒီအတွေးအခေါ်ဟာ သိပ်ကို ရိုးရှင်းပေမဲ့ အလွန်တရာ အစွမ်းထက်တဲ့ ပြောင်းလဲမှု တစ်ခု ဖြစ်တယ်ဆိုတာကို ကျွန်တော်တို့ လက်ခံရမှာ ဖြစ်ပါတယ်။</p><p>နောက်ဆုံး စတုတ္ထမြောက် အရေးကြီးတဲ့ အယူအဆတစ်ခုကတော့ အချိန်တိုင်းမှာ ကိုယ့်ကိုယ်ကိုယ် ပြန်မေးရမယ့် <b>AIWATT မေးခွန်း</b> ပဲ ဖြစ်ပါတယ်။ AIWATT ဆိုတာကတော့ "Am I willing, at this time, to make the investment required to make a positive difference on this topic?" (ဒီကိစ္စနဲ့ ပတ်သက်ပြီး အကောင်းမြင်နိုင်တဲ့ အပြောင်းအလဲတစ်ခု ဖြစ်လာဖို့အတွက် အခုအချိန်မှာ ငါ့ဘက်က လိုအပ်တဲ့ အချိန်နဲ့ခွန်အားတွေကို ရင်းနှီးမြှုပ်နှံဖို့ ဆန္ဒရှိရဲ့လား) ဆိုတာပဲ ဖြစ်ပါတယ်။ အထူးသဖြင့် အလုပ်ခွင်မှာ လုပ်ဖော်ကိုင်ဖက် တစ်ယောက်ယောက်က ကိုယ့်ကို စိတ်အနှောင့်အယှက် ဖြစ်အောင် ပြောလာတဲ့အခါ ချက်ချင်း ဒေါသတကြီး တုံ့ပြန်တော့မယ့် အစား ဒီမေးခွန်းလေးကို ကိုယ့်ကိုယ်ကိုယ် အရင်မေးကြည့်ဖို့ လိုပါတယ်။ ငါ အခု ငြင်းခုံလိုက်လို့ ဘာအကျိုးအမြတ် ရလာမှာလဲ၊ ပြဿနာ ပိုကြီးသွားမလား၊ ငါ့ရဲ့ တန်ဖိုးရှိတဲ့ အချိန်တွေ၊ စွမ်းအင်တွေ ဆုံးရှုံးခံပြီး ဒီပြဿနာကို ဖြေရှင်းဖို့ တကယ်ပဲ တန်ရဲ့လား ဆိုတာကို စဉ်းစားလိုက်တာနဲ့ မလိုအပ်တဲ့ ပဋိပက္ခ အများစုကို ရှောင်လွှဲနိုင်သွားမှာ ဖြစ်ပါတယ်။ ဒါဟာ မိမိကိုယ်ကိုယ် ထိန်းချုပ်ခြင်း (Self-control) ကို အမြင့်ဆုံး အဆင့်အထိ တည်ဆောက်ပေးနိုင်တဲ့ လေ့ကျင့်ခန်း တစ်ခုပဲ ဖြစ်ပါတယ်။</p>',
  '<h3>မိမိကိုယ်ကို အကောင်းဆုံးပုံဖော်နိုင်ရန် Triggers စာအုပ်မှ မဖြစ်မနေ သိထားသင့်သော အဓိက အတွေးအခေါ်ငါးရပ်</h3><p>ပထမဆုံးနဲ့ အရေးအကြီးဆုံး မှတ်သားထားရမယ့် အချက်ကတော့ ပတ်ဝန်းကျင်၏ လွှမ်းမိုးမှုကို လျှော့မတွက်ခြင်း ပဲ ဖြစ်ပါတယ်။ ကျွန်တော်တို့ အများစုဟာ ကိုယ့်ရဲ့ ဆုံးဖြတ်ချက်ကသာ အရေးအကြီးဆုံးလို့ ထင်မှတ်ထားတတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ့် လက်တွေ့မှာတော့ ပတ်ဝန်းကျင်ဆိုတာ ကျွန်တော်တို့ရဲ့ အပြုအမူတွေကို အလိုအလျောက် ပြောင်းလဲသွားစေနိုင်တဲ့၊ အချိန်တိုင်း လွှမ်းမိုးနေတဲ့ အစွမ်းထက် ယန္တရားကြီးတစ်ခု ဖြစ်ပါတယ်။ စာရေးသူက ပတ်ဝန်းကျင်ကို အမြဲတမ်း ကျွန်တော်တို့ကို အကဲစမ်းနေတဲ့ ရန်သူတော်ကြီး တစ်ခုလို တင်စားထားပါတယ်။ ကိုယ်က ဘယ်လောက်ပဲ စိတ်ရှည်မယ်လို့ ဆုံးဖြတ်ထားပါစေ၊ ရုံးရောက်တဲ့အခါ အလုပ်တွေ အရမ်းများလာတာ၊ ဒါမှမဟုတ် လုပ်ဖော်ကိုင်ဖက်က အဆင်မပြေတာတွေ လုပ်လာတဲ့အခါ အလိုလို ဒေါသထွက်သွားတတ်ပါတယ်။</p><p>ဒီအချက်ကို ပိုပြီး ရှင်းလင်းသွားအောင် စာအုပ်ထဲက ဥပမာတစ်ခုနဲ့ ပြောပြချင်ပါတယ်။ အလွန်ကို ယဉ်ကျေးသိမ်မွေ့ပြီး စိတ်ရှည်တဲ့ ခေါင်းဆောင်တစ်ယောက်ဟာ လေဆိပ်မှာ လေယာဉ်ကြန့်ကြာနေတဲ့ အချိန်မျိုး၊ ခရီးသည်တွေ ပြည့်ကျပ်ပြီး ပူလောင်နေတဲ့ အချိန်မျိုးမှာ ဝန်ဆောင်မှုပေးတဲ့ ဝန်ထမ်းကို ဒေါသတကြီး အော်ဟစ်မိသွားတာမျိုး ဖြစ်တတ်ပါတယ်။ ဒါဟာ သူ့ရဲ့ မူလစရိုက်လက္ခဏာ မဟုတ်ဘဲ၊ လေဆိပ်ဆိုတဲ့ ပတ်ဝန်းကျင် အခြေအနေက ဖန်တီးလိုက်တဲ့ လှုံ့ဆော်မှု (Trigger) ကြောင့် အလိုအလျောက် တုံ့ပြန်မိသွားတာ ဖြစ်ပါတယ်။ ဒါကြောင့်မို့လို့ ကျွန်တော်တို့ဟာ ကိုယ်ရောက်နေတဲ့ ပတ်ဝန်းကျင်က ကိုယ့်ကို ဘယ်လိုမျိုး အကျိုးသက်ရောက်မှုတွေ ပေးနိုင်လဲဆိုတာကို အမြဲတမ်း သတိကပ်ပြီး စောင့်ကြည့်နေဖို့ လိုအပ်ပါတယ်။ ပတ်ဝန်းကျင်ရဲ့ ဖိအားကို ကြိုတင်သိရှိထားမှသာ မှန်ကန်တဲ့ တုံ့ပြန်မှုကို ရွေးချယ်နိုင်မှာ ဖြစ်ပါတယ်။</p><p>ဒုတိယမြောက် အဓိက အချက်ကတော့ စီစဉ်သူနှင့် အကောင်အထည်ဖော်သူ ကြားက ကွာဟချက်ကို နားလည်ခြင်း ဖြစ်ပါတယ်။ ကျွန်တော်တို့ လူသားတွေရဲ့ ဦးနှောက်ထဲမှာ အစိတ်အပိုင်း နှစ်ခုရှိတယ်လို့ စာရေးသူက ဆိုပါတယ်။ ပထမတစ်ခုကတော့ မနက်နိုးလာတာနဲ့ "ဒီနေ့တော့ အလုပ်တွေကို ပြီးပြတ်အောင် လုပ်မယ်၊ လေ့ကျင့်ခန်း လုပ်မယ်၊ အစားအသောက် ဆင်ခြင်မယ်" ဆိုပြီး အစီအစဉ်တွေ အတိအကျ ဆွဲတတ်တဲ့ (Planner) ဖြစ်ပါတယ်။ ဒုတိယ တစ်ခုကတော့ အဲဒီ အစီအစဉ်တွေကို တကယ်တမ်း လက်တွေ့ လုပ်ဆောင်ရမယ့် (Doer) ပဲ ဖြစ်ပါတယ်။ ပြဿနာက အဲဒီ နှစ်ခုကြားမှာ အမြဲတမ်း ပဋိပက္ခ ဖြစ်နေတာပါပဲ။</p><p>ကျွန်တော်တို့ အနေနဲ့ မနက်ပိုင်းမှာ အစီအစဉ်တွေ ဆွဲတဲ့အခါ ကိုယ့်ကိုယ်ကိုယ် စူပါမင်းလိုမျိုး ခွန်အားတွေ အပြည့်ရှိနေမယ်လို့ ထင်မှတ်ပြီး အများကြီး စီစဉ်တတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ်တမ်း နေ့လယ်ပိုင်း ရောက်လာတဲ့အခါ၊ အလုပ်တွေ ပင်ပန်းလာတဲ့အခါမှာတော့ အကောင်အထည်ဖော်ရမယ့်သူ (Doer) ဟာ စွမ်းအင်တွေ ကုန်ခမ်းပြီး အလွယ်လမ်းကိုပဲ လိုက်ချင်သွားပါတော့တယ်။ ရုံးကပြန်လာတဲ့အခါ လေ့ကျင့်ခန်း လုပ်မယ့်အစား ဆိုဖာပေါ်လှဲပြီး တီဗွီပဲ ကြည့်ချင်သွားပါတယ်။ ဒီကွာဟချက်ကို နားလည်ထားမှသာ ကျွန်တော်တို့ဟာ အစီအစဉ်တွေ ဆွဲတဲ့အခါ ကိုယ့်ရဲ့ တကယ့် လက်တွေ့ လုပ်နိုင်စွမ်းကို ထည့်သွင်းစဉ်းစားပြီး၊ လက်တွေ့ကျတဲ့ အစီအစဉ်တွေကို ဖန်တီးနိုင်မှာ ဖြစ်ပါတယ်။ ကိုယ့်ကိုယ်ကိုယ် အလွန်အကျွံ ယုံကြည်လွန်းတာကို လျှော့ချပြီး၊ တကယ် လုပ်နိုင်မယ့် အရာတွေကိုပဲ တဖြည်းဖြည်းချင်း အကောင်အထည်ဖော်သွားဖို့ အရေးကြီးပါတယ်။</p><p>တတိယမြောက် သိထားသင့်တဲ့ အချက်ကတော့ တက်ကြွသော မေးခွန်းများ (Active Questions) ၏ စွမ်းအား ကို အသုံးပြုခြင်းပဲ ဖြစ်ပါတယ်။ ပုံမှန်အားဖြင့် ကျွန်တော်တို့ဟာ ကိုယ့်ကိုယ်ကိုယ် ပြန်လည် ဆန်းစစ်တဲ့အခါ "ငါ ဒီနေ့ ပျော်ရွှင်ရဲ့လား"၊ "ငါ့ရဲ့ အလုပ်တွေ အဆင်ပြေရဲ့လား" ဆိုတဲ့ Passive မေးခွန်းမျိုးတွေကိုသာ မေးလေ့ရှိပါတယ်။ ဒီလို မေးတဲ့အခါမှာ အဖြေက မကောင်းဘူးဆိုရင်၊ ကျွန်တော်တို့ရဲ့ ဦးနှောက်က အလိုအလျောက် ပတ်ဝန်းကျင်ကို အပြစ်တင်ဖို့ ဆင်ခြေတွေ ရှာပါတော့တယ်။ "ရာသီဥတု မကောင်းလို့၊ အထက်လူကြီးက ဆူလို့" စသဖြင့် အကြောင်းပြချက်တွေ ပေးတတ်ကြပါတယ်။</p><p>ဒါကို ပြောင်းလဲဖို့အတွက် စာရေးသူက မေးခွန်းပုံစံကို ပြောင်းပစ်ဖို့ အကြံပြုထားပါတယ်။ "ငါ ဒီနေ့ ပျော်ရွှင်အောင်နေဖို့ ငါ့ဘက်က အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား (Did I do my best to be happy?)" ဆိုပြီး Active Question ပုံစံ ပြောင်းမေးရမှာ ဖြစ်ပါတယ်။ ဒီလို ပြောင်းမေးလိုက်တာနဲ့ တစ်ပြိုင်နက် ကျွန်တော်တို့ဟာ ပတ်ဝန်းကျင်ကို အပြစ်တင်လို့ မရတော့ဘဲ၊ ကိုယ့်ရဲ့ လုပ်ဆောင်ချက် အပေါ်မှာသာ တာဝန်ယူမှု၊ တာဝန်ခံမှု အပြည့်အဝ ရှိသွားစေပါတယ်။ ကိုယ် အကောင်းဆုံး မကြိုးစားခဲ့ဘူးဆိုတာကို လက်ခံရမယ့် အခြေအနေ ဖြစ်သွားတဲ့အတွက်၊ နောက်နေ့တွေမှာ ပိုပြီး အာရုံစိုက် ကြိုးစားလာအောင် ကိုယ့်ကိုယ်ကိုယ် တွန်းအားပေးရာ ရောက်သွားစေပါတယ်။ ဒီနည်းလမ်းဟာ ကိုယ်ကျင့်တရားနဲ့ စည်းကမ်းပိုင်းကို မြှင့်တင်ရာမှာ အလွန်ကို ထိရောက်တဲ့ နည်းလမ်းတစ်ခု ဖြစ်ပါတယ်။</p><p>စတုတ္ထမြောက် အရေးပါတဲ့ အတွေးအခေါ်ကတော့ ပြောင်းလဲခြင်း စက်ဝိုင်း (The Wheel of Change) ကို နားလည် အသုံးချခြင်း ဖြစ်ပါတယ်။ ပြောင်းလဲမှုဆိုတာနဲ့ လူအများစုက အသစ်လုပ်တာ တစ်ခုတည်းကိုပဲ ပြေးမြင်တတ်ကြပါတယ်။ ဒါပေမဲ့ Marshall Goldsmith က ပြောင်းလဲခြင်းကို လုပ်ငန်းစဉ် လေးရပ်အနေနဲ့ ခွဲခြားပြထားပါတယ်။ ပထမဦးစွာ ကိုယ့်မှာ မရှိသေးတဲ့ အရည်အချင်းသစ်တွေကို "ဖန်တီးခြင်း (Creating)" လုပ်ရပါမယ်။ ဒုတိယအနေနဲ့ ကိုယ့်ဆီမှာ ရှိပြီးသား ကောင်းမွန်တဲ့ အကျင့်တွေကို ပျောက်မသွားအောင် "ထိန်းသိမ်းခြင်း (Preserving)" လုပ်ရပါမယ်။ တတိယအနေနဲ့ ကိုယ့်ရဲ့ တိုးတက်မှုကို နောက်ဆွဲနေတဲ့ အကျင့်ဆိုးတွေကို ရဲရဲဝံ့ဝံ့ "ဖယ်ရှားခြင်း (Eliminating)" လုပ်ရပါမယ်။ နောက်ဆုံးနဲ့ အရေးအကြီးဆုံးကတော့ ကိုယ်တိုင် ပြောင်းလဲလို့မရတဲ့ အခြေအနေတွေကို အလကားနေရင်း ဒေါသထွက်နေမယ့်အစား၊ အရှိကို အရှိအတိုင်း "လက်ခံခြင်း (Accepting)" လုပ်ရပါမယ်။</p><p>ဒီစက်ဝိုင်းကို နားလည်ထားခြင်းအားဖြင့် ကျွန်တော်တို့ဟာ ဘဝမှာ ကြုံတွေ့ရတဲ့ ပြဿနာတွေကို စနစ်တကျ ချဉ်းကပ်နိုင်မှာ ဖြစ်ပါတယ်။ ဥပမာအားဖြင့် ကုမ္ပဏီမှာ မူဝါဒ အသစ်တစ်ခု ထွက်လာတဲ့အခါ အဲဒီမူဝါဒကို ကိုယ်က ပြောင်းလဲလို့ မရဘူးဆိုရင် လက်ခံလိုက်တာက အကောင်းဆုံးပါပဲ။ အဲဒီအစား ကိုယ်ပြောင်းလဲလို့ရတဲ့ ကိုယ့်ရဲ့ အလုပ်လုပ်ပုံကို ပိုကောင်းအောင် ဖန်တီးတာက ပိုပြီး အကျိုးရှိစေမှာ ဖြစ်ပါတယ်။ ဒီပြောင်းလဲခြင်း စက်ဝိုင်းဟာ ကျွန်တော်တို့ရဲ့ စွမ်းအင်တွေကို အလဟဿ မကုန်ခမ်းစေဘဲ မှန်ကန်တဲ့ နေရာတွေမှာ အသုံးချနိုင်အောင် လမ်းညွှန်ပေးတဲ့ တွေးခေါ်မှု ပုံစံတစ်ခု ဖြစ်ပါတယ်။</p><p>ပဉ္စမမြောက်နဲ့ နောက်ဆုံး အချက်ကတော့ ကျွန်တော်တို့ နေ့စဉ် ကြုံတွေ့ရတဲ့ စိတ်အနှောင့်အယှက် ဖြစ်စရာတွေကို ဖြေရှင်းဖို့အတွက် AIWATT မေးခွန်း ကို အသုံးပြုခြင်းပဲ ဖြစ်ပါတယ်။ AIWATT ဆိုတာကတော့ "Am I willing, at this time, to make the investment required to make a positive difference on this topic?" (ဒီကိစ္စနဲ့ ပတ်သက်ပြီး အကောင်းမြင်နိုင်တဲ့ အပြောင်းအလဲတစ်ခု ဖြစ်လာဖို့အတွက် အခုအချိန်မှာ ငါ့ဘက်က လိုအပ်တဲ့ အချိန်နဲ့ ခွန်အားတွေကို ရင်းနှီးမြှုပ်နှံဖို့ ဆန္ဒရှိရဲ့လား) ဆိုတဲ့ အဓိပ္ပာယ် ဖြစ်ပါတယ်။ ဒါဟာ ကျွန်တော်တို့ရဲ့ စိတ်လိုက်မာန်ပါ တုံ့ပြန်တတ်တဲ့ အကျင့်ကို ရပ်တန့်ပေးနိုင်တဲ့ အစွမ်းထက်ဆုံး ဘရိတ်တစ်ခု ဖြစ်ပါတယ်။</p><p>အလုပ်ခွင်မှာ လုပ်ဖော်ကိုင်ဖက် တစ်ယောက်ယောက်က ကိုယ့်ကို အထင်လွဲပြီး လာပြောတဲ့အခါဖြစ်စေ၊ အစည်းအဝေးမှာ ငြင်းခုံစရာတွေ ပေါ်လာတဲ့အခါဖြစ်စေ ချက်ချင်း ဒေါသတကြီး ပြန်လည် တုံ့ပြန်တော့မယ့် အစား ဒီမေးခွန်းလေးကို စိတ်ထဲကနေ အရင်ဆုံး မေးကြည့်လိုက်ပါ။ "ငါ အခု ပြန်ငြင်းလိုက်လို့ အခြေအနေက ပိုကောင်းသွားမှာလား၊ ငါ့ရဲ့ တန်ဖိုးရှိတဲ့ အချိန်တွေနဲ့ စိတ်အေးချမ်းမှုကို စတေးပြီး ဒီကိစ္စကို အနိုင်ယူဖို့ တကယ်ပဲ တန်ရဲ့လား" လို့ စဉ်းစားလိုက်ပါ။ အကြိမ်အများစုမှာတော့ မတန်ဘူးဆိုတာကို တွေ့ရမှာ ဖြစ်ပြီး မလိုအပ်တဲ့ ပြဿနာတွေကို ရှောင်လွှဲနိုင်သွားပါလိမ့်မယ်။ ဒါဟာ ရင့်ကျက်တဲ့ ခေါင်းဆောင်မှုနဲ့ မြင့်မားတဲ့ စိတ်ခံစားမှုဆိုင်ရာ ဉာဏ်ရည် (Emotional Intelligence) ကို ပြသတဲ့ အကောင်းဆုံး အလေ့အကျင့် တစ်ခု ဖြစ်ပါတယ်။</p>',
  '<h3>လက်တွေ့ဘဝနှင့် လုပ်ငန်းခွင်တွင် အသုံးချခြင်း</h3><p>ဒီစာအုပ်ထဲက အတွေးအခေါ်တွေကို ကျွန်တော်တို့ရဲ့ လက်တွေ့ဘဝနဲ့ နေ့စဉ် လုပ်ငန်းခွင်မှာ ဘယ်လို အသုံးချမလဲ ဆိုတာက အရမ်းကို အရေးကြီးတဲ့ အပိုင်း ဖြစ်ပါတယ်။ မိတ်ဆွေတို့အနေနဲ့ အလုပ်ခွင်မှာ ခေါင်းဆောင် တစ်ယောက် ဖြစ်နေမယ်၊ ဒါမှမဟုတ် လုပ်ငန်းခွင် ဖိအားတွေကြားမှာ ရုန်းကန်နေရတဲ့ လူငယ် ပရော်ဖက်ရှင်နယ် တစ်ယောက် ဖြစ်နေမယ်ဆိုရင် ဒီနည်းလမ်းတွေကို မနက်ဖြန်ကစပြီး ချက်ချင်း အသုံးချကြည့်ဖို့ တိုက်တွန်းချင်ပါတယ်။ ပထမဆုံး အနေနဲ့ <b>နေ့စဉ် မေးခွန်းများ (Daily Questions)</b> ကို Excel Spreadsheet တစ်ခု ဖန်တီးပြီးဖြစ်စေ၊ ဒါမှမဟုတ် သီးသန့် မှတ်စုစာအုပ် တစ်အုပ်ထားပြီးဖြစ်စေ မှတ်တမ်းတင်တဲ့ အလေ့အကျင့်ကို စတင်လိုက်ပါ။ ညစဉ် အိပ်ရာမဝင်ခင်တိုင်းမှာ စာရေးသူ အကြံပြုထားတဲ့ အခြေခံ မေးခွန်း (၆) ခုဖြစ်တဲ့ "ဒီနေ့ ငါ့ရဲ့ ရည်မှန်းချက်တွေ ရှင်းလင်းဖို့၊ ရည်မှန်းချက်တွေ ပြည့်မီဖို့၊ အလုပ်မှာ အဓိပ္ပာယ်ရှိရှိ ဖြတ်သန်းဖို့၊ ပျော်ရွှင်ဖို့၊ ကောင်းမွန်တဲ့ ဆက်ဆံရေးတွေ တည်ဆောက်ဖို့နဲ့ လုပ်နေတဲ့ အလုပ်အပေါ်မှာ အပြည့်အဝ အာရုံစိုက်ဖို့အတွက် ငါ့ဘက်က အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား" ဆိုတာကို ကိုယ့်ကိုယ်ကိုယ် ရိုးရိုးသားသား အမှတ်ပေးကြည့်ပါ။ တစ်မှတ်ကနေ ဆယ်မှတ်အတွင်း ကိုယ့်ကိုယ်ကိုယ် အကဲဖြတ်ပါ။ ဒီလို လုပ်ခြင်းအားဖြင့် ကိုယ့်ရဲ့ နေ့စဉ် တိုးတက်မှု သို့မဟုတ် ဆုတ်ယုတ်မှုတွေကို ကိန်းဂဏန်းတွေနဲ့ အတိအကျ မြင်တွေ့လာရပြီး နောက်နေ့တွေမှာ ပိုကောင်းအောင် နေထိုင်ချင်စိတ်တွေ အလိုလို ဖြစ်ပေါ်လာမှာပါ။</p><p>ဒါ့အပြင် အစည်းအဝေးတွေမှာ ဒါမှမဟုတ် လုပ်ဖော်ကိုင်ဖက်တွေနဲ့ စကားပြောဆိုတဲ့ အခါတိုင်းမှာ AIWATT ဆိုတဲ့ မေးခွန်းကို စိတ်ထဲမှာ အမြဲတမ်း ဆောင်ထားပါ။ အလုပ်မှာ တစ်စုံတစ်ယောက်က ကိုယ့်ရဲ့ အကြံဉာဏ်ကို ပယ်ချလိုက်တဲ့အခါ ချက်ချင်း ခုခံကာကွယ်ပြောဆိုမယ့်အစား၊ "ငါ အခု အချိန်ပေးပြီး ရှင်းပြနေရင် သူ လက်ခံမှာလား၊ ဒါမှမဟုတ် ပြဿနာပဲ ပိုကြီးသွားမလား" ဆိုတာကို ခဏလေး အချိန်ယူ စဉ်းစားလိုက်ပါ။ ဒါဟာ သင့်ရဲ့ Emotional Intelligence (စိတ်ခံစားမှုဆိုင်ရာ ဉာဏ်ရည်ဉာဏ်သွေး) ကို သိသိသာသာ မြင့်တက်လာစေမှာ ဖြစ်ပါတယ်။ ခေါင်းဆောင်တွေ အနေနဲ့ ဆိုရင်လည်း ကိုယ့်ရဲ့ အဖွဲ့သားတွေကို အပြစ်တင်မယ့် အစား သူတို့ အကောင်းဆုံး ကြိုးစားနိုင်မယ့် ပတ်ဝန်းကျင်ကောင်း တစ်ခုကို ဘယ်လို ဖန်တီးပေးရမလဲ ဆိုတာကို ပိုပြီး အာရုံစိုက်လာနိုင်ပါတယ်။ ကိုယ့်အဖွဲ့သားတွေ အမှားလုပ်မိတဲ့အခါ "မင်း ဒါကို ဘာလို့ သေချာ မလုပ်တာလဲ" လို့ မေးမယ့်အစား "ဒီအလုပ်ကို အကောင်းဆုံး ပြီးမြောက်ဖို့ မင်းဘက်က အစွမ်းကုန် ကြိုးစားခဲ့ရဲ့လား၊ ဘာတွေက မင်းကို အဟန့်အတား ဖြစ်စေခဲ့လဲ" ဆိုပြီး Active Questions တွေကို သုံးပြီး ချဉ်းကပ်လာနိုင်မှာ ဖြစ်ပါတယ်။ ဒါတွေဟာ ချက်ချင်း လက်တွေ့ အသုံးချနိုင်ပြီး သိသာထင်ရှားတဲ့ ရလဒ်တွေကို ပေးစွမ်းနိုင်တဲ့ နည်းလမ်းကောင်းတွေပဲ ဖြစ်ပါတယ်။</p>',
  '<h3>နိဂုံးနှင့် ရှေ့ဆက်ရန် အကြံပြုချက်</h3><p>အချုပ်အားဖြင့် ဆိုရမယ်ဆိုရင် Marshall Goldsmith ရဲ့ Triggers စာအုပ်ဟာ ကျွန်တော်တို့ လူသားတွေရဲ့ အားနည်းချက်တွေ၊ ပတ်ဝန်းကျင်ရဲ့ ဖိအားတွေကြားထဲမှာ ကိုယ်ဖြစ်ချင်တဲ့သူ အမှန်တကယ် ဖြစ်လာဖို့အတွက် လမ်းပြမြေပုံ တစ်ခုကို ရေးဆွဲပေးထားတာပဲ ဖြစ်ပါတယ်။ ပြောင်းလဲမှုဆိုတာ တစ်ညတွင်းချင်း ဖြစ်ပေါ်လာတဲ့ အရာ မဟုတ်သလို၊ တစ်ခါတလေ ကြိုးစားလိုက်ရုံနဲ့လည်း အောင်မြင်သွားမယ့် ကိစ္စမျိုး မဟုတ်ပါဘူး။ အမြဲတမ်း ပြောင်းလဲနေတဲ့ ပတ်ဝန်းကျင်ရဲ့ စမ်းသပ်မှုတွေကို နေ့စဉ်နဲ့အမျှ ရင်ဆိုင်ဖြတ်သန်းနေရတဲ့ ခရီးရှည်ကြီး တစ်ခု ဖြစ်ပါတယ်။ ကျွန်တော်တို့ အနေနဲ့ ကိုယ့်ကိုယ်ကိုယ် အပြစ်တင်နေမယ့် အစား၊ ဒါမှမဟုတ် ပတ်ဝန်းကျင်ကို အပြစ်ပုံချနေမယ့် အစား မိမိကိုယ်တိုင်ရဲ့ လုပ်ဆောင်ချက်တိုင်းကို တာဝန်ယူ တာဝန်ခံတတ်တဲ့ အလေ့အကျင့်ကို မွေးမြူသွားဖို့ အလွန် အရေးကြီးပါတယ်။</p><p>မိတ်ဆွေတို့ အနေနဲ့ ဒီနေ့ကစပြီး ကိုယ့်ရဲ့ ပတ်ဝန်းကျင်မှာ ကိုယ့်ကို အနှောင့်အယှက် ပေးနေတဲ့ Triggers တွေက ဘာတွေလဲဆိုတာကို သတိထား စောင့်ကြည့်ပါ။ ပြီးရင် နေ့စဉ် ကိုယ့်ကိုယ်ကိုယ် Active Questions တွေ မေးပြီး ကိုယ့်ရဲ့ ကြိုးစားအားထုတ်မှုတွေကို ဆန်းစစ်ပါ။ ကျွန်တော်တို့ဟာ ပတ်ဝန်းကျင်ရဲ့ သားကောင်တွေ အဖြစ် အမြဲတမ်း နေထိုင်သွားစရာ မလိုပါဘူး။ ကျွန်တော်တို့မှာ ရွေးချယ်ခွင့် ရှိပါတယ်။ အခြေအနေတိုင်းမှာ မှန်ကန်တဲ့ တုံ့ပြန်မှုကို ရွေးချယ်နိုင်စွမ်းဟာ ကျွန်တော်တို့ တစ်ဦးချင်းစီရဲ့ လက်ထဲမှာပဲ ရှိတယ်ဆိုတာကို အမြဲတမ်း နှလုံးသွင်းထားစေချင်ပါတယ်။ ကိုယ်ဖြစ်ချင်တဲ့ ပန်းတိုင်ဆီကို ရောက်ဖို့အတွက် နေ့စဉ် ဇွဲလုံ့လနဲ့ ပုံမှန် လျှောက်လှမ်းသွားနိုင်ကြပါစေလို့ ဆန္ဒပြုတိုက်တွန်းရင်း နိဂုံးချုပ်အပ်ပါတယ်။</p>'

                summaryHeading: "<h2>အောင်မြင်မှုလမ်းကြောင်းပေါ်က အဟန့်အတားများကို ဖယ်ရှားခြင်း</h2>",
                summaryParagraphs: [
  '<h3>မိတ်ဆက်နှင့် အဓိကပြဿနာ</h3><p>မိတ်ဆွေတို့အနေနဲ့ ကိုယ့်ရဲ့ လုပ်ငန်းခွင်မှာ အောင်မြင်မှု တစ်ခုရလာတဲ့အခါ၊ အဲဒီအောင်မြင်မှုကို ရရှိစေခဲ့တဲ့ ကိုယ့်ရဲ့ လုပ်ရပ်တွေ၊ အကျင့်စရိုက်တွေကို အမြဲတမ်း မှန်ကန်တယ်လို့ ထင်မှတ်မိတတ်ကြပါတယ်။ ကျွန်တော်တို့ဟာ ကြိုးစားပမ်းစား အလုပ်လုပ်ခဲ့လို့၊ အရည်အချင်းရှိလို့၊ အကြံဉာဏ်ကောင်းတွေ ပေးနိုင်လို့ ဒီနေရာကို ရောက်လာတာပဲဆိုတဲ့ အတွေးမျိုး ဝင်လာတတ်ပါတယ်။ ဒါပေမဲ့ တကယ့်တကယ်မှာတော့ အဲဒီလို အောင်မြင်မှုတွေဆီကို ခေါ်ဆောင်လာပေးတဲ့ အကျင့်စရိုက်တချို့ဟာ ရှေ့ဆက်ပြီး ပိုမိုကြီးမားတဲ့ အောင်မြင်မှုတွေဆီကို သွားမယ့် လမ်းခရီးမှာ အကြီးမားဆုံး အဟန့်အတားတွေ ဖြစ်လာတတ်တယ်ဆိုတာကို သတိထားမိကြပါသလား။ နာမည်ကျော် စီမံခန့်ခွဲမှု ပညာရှင်နှင့် အကြံပေးပုဂ္ဂိုလ်ကြီး Marshall Goldsmith ရေးသားထားတဲ့ "What Got You Here Won\'t Get You There" ဆိုတဲ့ စာအုပ်ဟာ ဒီလိုမျိုး မမြင်နိုင်တဲ့ ပြဿနာတွေကို မီးမောင်းထိုးပြထားတဲ့ စာအုပ်ကောင်းတစ်အုပ်ပဲ ဖြစ်ပါတယ်။ စာရေးသူဟာ ထိပ်တန်း အမှုဆောင်အရာရှိကြီးတွေ၊ စီအီးအိုတွေနဲ့ နှစ်ပေါင်းများစွာ အလုပ်လုပ်ခဲ့တဲ့ အတွေ့အကြုံတွေအပေါ် အခြေခံပြီး လူတွေရဲ့ စိတ်ပိုင်းဆိုင်ရာနဲ့ အပြုအမူပိုင်းဆိုင်ရာ အားနည်းချက်တွေကို သေချာသုံးသပ်ပြထားပါတယ်။</p><p>လူတော်တော်များများဟာ ကိုယ်လုပ်တဲ့အရာတွေ အကုန်မှန်နေတယ်လို့ ထင်တဲ့ အောင်မြင်မှုဆိုင်ရာ ထင်ယောင်ထင်မှားဖြစ်မှု ပြဿနာကြီးကို ခံစားနေရတတ်ပါတယ်။ ဒီလိုဖြစ်လာတဲ့အခါ တခြားသူတွေရဲ့ ဝေဖန်အကြံပြုချက်တွေကို လက်မခံနိုင်တော့ဘဲ ကိုယ်လုပ်ချင်တာကိုသာ ဇွတ်လုပ်တတ်တဲ့ အကျင့်ဆိုးတွေ ဝင်လာပါတယ်။ လူဆိုတာက အောင်မြင်လေလေ ကိုယ့်ကိုယ်ကိုယ် ယုံကြည်မှုလွန်ကဲလေလေ ဖြစ်လာတတ်ပြီး၊ ဒီယုံကြည်မှုကပဲ ကိုယ့်ရဲ့ အားနည်းချက်တွေကို မမြင်နိုင်အောင် ဖုံးကွယ်ထားတတ်ပါတယ်။ ဒါကြောင့် ဒီစာအုပ်က ကိုယ့်ကို အခုဒီနေရာအထိ ရောက်လာအောင် ကူညီပေးခဲ့တဲ့ အကျင့်တွေဟာ နောက်ထပ် ပိုမြင့်မားတဲ့ နေရာတစ်ခုဆီကို သွားဖို့အတွက်တော့ အသုံးမဝင်တော့ဘူး ဆိုတာကို အလေးအနက် သတိပေးထားတာ ဖြစ်ပါတယ်။ အထူးသဖြင့် ထိပ်ပိုင်းခေါင်းဆောင်တွေ၊ အောင်မြင်နေတဲ့ လုပ်ငန်းရှင်တွေအနေနဲ့ သူတို့ရဲ့ နည်းပညာပိုင်းဆိုင်ရာ အရည်အချင်းတွေထက် လူမှုဆက်ဆံရေးနဲ့ အပြုအမူပိုင်းဆိုင်ရာ အားနည်းချက်တွေကသာ သူတို့ရဲ့ တိုးတက်မှုကို အဓိက ဟန့်တားနေတာကို တွေ့ရမှာပါ။ ခေါင်းဆောင်တစ်ယောက်ရဲ့ ပြဿနာဟာ အလုပ်ကို ဘယ်လိုလုပ်ရမယ်ဆိုတာ မသိတာမဟုတ်ဘဲ၊ တခြားသူတွေနဲ့ ဘယ်လို သဟဇာတဖြစ်အောင် ဆက်ဆံရမယ်ဆိုတဲ့ အနုပညာကို မေ့လျော့နေခြင်းပဲ ဖြစ်ပါတယ်။</p><p>ကျွန်တော်တို့ဟာ ဒီပြဿနာတွေကို ဖြေရှင်းဖို့အတွက် ကိုယ်ဘာတွေ အသစ်ထပ်လုပ်သင့်တယ်ဆိုတာကို စဉ်းစားမယ့်အစား ကိုယ်ဘာတွေကိုတော့ဖြင့် မလုပ်ဘဲ ရပ်တန့်ပစ်သင့်တယ် ဆိုတာကို ပိုပြီး အာရုံစိုက်ဖို့ လိုအပ်ပါတယ်။ တခါတရံမှာ အကျင့်ဆိုးတစ်ခုကို ရပ်တန့်လိုက်ခြင်းဟာ အကျင့်ကောင်း အသစ်ဆယ်ခုကို သင်ယူခြင်းထက် ပိုပြီး ထိရောက်မှုရှိတယ်ဆိုတာကို ဒီစာအုပ်ကနေတဆင့် လေ့လာသိရှိရမှာ ဖြစ်ပါတယ်။ အောင်မြင်မှုဆိုတာ ခရီးစဉ်တစ်ခုဖြစ်ပြီး၊ ဒီခရီးစဉ်မှာ ဆက်လက်လျှောက်လှမ်းနိုင်ဖို့အတွက် အလေးအပင်ဖြစ်နေတဲ့ ကိုယ့်ရဲ့ အတ္တတွေ၊ အကျင့်ဆိုးတွေကို ချန်ထားခဲ့ဖို့ လိုအပ်ကြောင်းကို စာရေးသူက အလွန်ပီပြင်စွာ ပုံဖော်ထားပါတယ်။ ဒီစာအုပ်ဟာ ကိုယ့်ရဲ့ လုပ်ငန်းခွင်မှာသာမကဘဲ မိသားစုဘဝ၊ လူမှုရေးဘဝတွေမှာပါ ကိုယ့်ကိုယ်ကိုယ် ပြန်လည်သုံးသပ်ပြီး အကောင်းဆုံးသော ပြောင်းလဲမှုတွေကို ဖန်တီးယူနိုင်ဖို့ လက်တွေ့ကျကျ လမ်းညွှန်ပေးမယ့် လမ်းပြမြေပုံတစ်ခုပဲ ဖြစ်ပါတယ်။</p>',
  '<h3>စာအုပ်၏ အနှစ်သာရနှင့် အတွေးအခေါ်များ</h3><p><b>ပထမအချက်အနေဖြင့် "အောင်မြင်မှုကြောင့် ဖြစ်ပေါ်လာသော ထင်ယောင်ထင်မှားဖြစ်မှုများ"</b> အကြောင်းကို ဆွေးနွေးချင်ပါတယ်။ အောင်မြင်တဲ့ လူတွေမှာ အခြေခံအားဖြင့် ယုံကြည်မှုလေးခု ရှိတတ်ပါတယ်။ အဲဒါတွေကတော့ ငါအောင်မြင်ခဲ့တယ်၊ ငါအောင်မြင်နိုင်တယ်၊ ငါအောင်မြင်ရမယ်၊ ပြီးတော့ ငါက အောင်မြင်ဖို့ ရွေးချယ်ထားတာဖြစ်တယ် ဆိုတဲ့ အတွေးတွေပဲ ဖြစ်ပါတယ်။ ဒီယုံကြည်မှုတွေက လူတစ်ယောက်ကို ရှေ့ဆက်ဖို့ ခွန်အားပေးပေမယ့်၊ တဖက်မှာလည်း အမှားတွေကို လက်မခံချင်တဲ့ စိတ်ကြိုက် အတ္တတွေကို မွေးဖွားပေးပါတယ်။ ငါလုပ်တဲ့ပုံစံက မှန်နေလို့သာ ငါဒီလောက်အောင်မြင်နေတာပေါ့ဆိုတဲ့ အယူသီးမှုမျိုး ဖြစ်လာတတ်ပါတယ်။ ဒါကြောင့် ကိုယ်လုပ်နေတဲ့ အကျင့်ဆိုးတချို့က အမှန်တကယ်တော့ အောင်မြင်မှုကို အထောက်အကူပြုနေတာ မဟုတ်ဘဲ၊ အဲဒီအကျင့်ဆိုးတွေ ရှိနေတဲ့ကြားကပဲ ကံကောင်းထောက်မစွာနဲ့ အောင်မြင်နေတာ ဖြစ်နိုင်တယ်ဆိုတာကို သူတို့ မမြင်နိုင်ကြတော့ပါဘူး။</p><p>ဒီအချက်ကို ပိုပြီး ရှင်းလင်းသွားအောင် စာအုပ်ထဲက ဥပမာတစ်ခုကို ပြောပြချင်ပါတယ်။ ဟယ်ရီဆိုတဲ့ အမှုဆောင်အရာရှိ တစ်ယောက်ဟာ အလုပ်မှာ အလွန်တော်ပြီး ကုမ္ပဏီအတွက် အကျိုးအမြတ်တွေ အများကြီး ရှာပေးနိုင်သူ ဖြစ်ပါတယ်။ ဒါပေမဲ့ သူဟာ တခြားသူတွေပြောတာကို လုံးဝ နားမထောင်တတ်တဲ့ အကျင့်ဆိုး ရှိနေပါတယ်။ လူတွေက သူ့ကို နားထောင်တတ်တဲ့ အကျင့်လေး လုပ်ဖို့ အကြံပေးတဲ့အခါ ဟယ်ရီက အပြင်းအထန် ငြင်းဆန်ပါတယ်။ သူက သူများတွေရဲ့ အသုံးမကျတဲ့ အကြံဉာဏ်တွေကို နားထောင်နေရရင် သူ့ရဲ့ တီထွင်ဖန်တီးနိုင်စွမ်းတွေ ပျောက်ဆုံးသွားလိမ့်မယ်လို့ ထင်ယောင်ထင်မှား ဖြစ်နေတာပါ။ တကယ်တမ်းကျတော့ ဟယ်ရီဟာ သူများစကားကို နားမထောင်လို့ အောင်မြင်နေတာ မဟုတ်ဘဲ၊ သူ့ရဲ့ တခြားသော ကြိုးစားအားထုတ်မှုတွေကြောင့်သာ အောင်မြင်နေတာ ဖြစ်ပါတယ်။ ဒီလိုမျိုး ကိုယ့်ရဲ့ အကျင့်ဆိုးတစ်ခုကို အောင်မြင်မှုရဲ့ အကြောင်းရင်းလို့ ထင်မှတ်မှားနေခြင်းဟာ ပြောင်းလဲဖို့အတွက် အကြီးမားဆုံး အဟန့်အတားတစ်ခု ဖြစ်လာစေပါတယ်။</p><p><b>ဒုတိယအချက်အနေဖြင့် "အမြဲတမ်း နိုင်ချင်လွန်းသည့် စိတ်ဓာတ်နှင့် ဝင်ရောက်စွက်ဖက်တတ်သော အကျင့်"</b> ကို လေ့လာကြည့်ရအောင်ပါ။ အောင်မြင်တဲ့သူတွေဟာ ပြိုင်ဆိုင်မှု ပြင်းထန်ကြပြီး နေရာတိုင်းမှာ အနိုင်ရချင်ကြပါတယ်။ အရေးကြီးတဲ့ ကိစ္စတွေမှာ သာမကဘဲ အရေးမပါတဲ့ ကိစ္စလေးတွေမှာတောင် သူတို့ရဲ့ အမြင်ကို အတင်းအကျပ် လက်ခံခိုင်းတတ်ကြပါတယ်။ ထို့အတူပဲ သူများတွေ အကြံဉာဏ်ပေးလာတဲ့အခါတိုင်း ကိုယ့်ဘက်ကနေ တစ်ခုခု ဖြည့်စွက်ပြောဆိုမှ ကျေနပ်တတ်တဲ့ အကျင့်ရှိပါတယ်။ ဒီလို အမြဲတမ်း ဝင်ရောက်စွက်ဖက်ပြီး ကိုယ့်အကြံဉာဏ်ကို ထည့်သွင်းခြင်းအားဖြင့် တခြားသူတွေရဲ့ စိတ်အားထက်သန်မှုကို ၅၀ ရာခိုင်နှုန်းလောက်အထိ ကျဆင်းသွားစေနိုင်တယ်ဆိုတာကို သတိမထားမိတတ်ကြပါဘူး။ ဒါဟာ ခေါင်းဆောင်ကောင်းတစ်ယောက်ရဲ့ အရည်အသွေးကို များစွာ ထိခိုက်စေပါတယ်။ ဒီအချက်နဲ့ ပတ်သက်ပြီး စာရေးသူက ကားလို့စ် ဆိုတဲ့ စီအီးအို တစ်ယောက်ရဲ့ ဇာတ်လမ်းကို တင်ပြထားပါတယ်။ ကားလို့စ်ဟာ သူ့ရဲ့ ဒီဇိုင်းအဖွဲ့က တင်ပြလာတဲ့ ထုပ်ပိုးမှုဒီဇိုင်းအသစ်ကို သဘောကျပေမယ့်၊ ပိုပြီး ကောင်းသွားအောင်ဆိုပြီး အရောင်ကို အပြာရောင် ပြောင်းလိုက်ဖို့ အကြံပေးလိုက်ပါတယ်။ ဒီဇိုင်းအဖွဲ့ကလည်း သူတို့ရဲ့ စီအီးအို ပြောတဲ့အတိုင်း အပြာရောင်နဲ့ အသစ်ပြန်လုပ်ပြီး တင်ပြတဲ့အခါ ကားလို့စ်က "အင်း... အနီရောင်ဆိုရင် ပိုကောင်းမလား မသိဘူး" ဆိုပြီး ထပ်ပြောပြန်ပါတယ်။ ဒီအခါမှာ ဒီဇိုင်းအဖွဲ့သားတွေဟာ လုံးဝ စိတ်ဓာတ်ကျသွားကြပါတယ်။ ကားလို့စ်အနေနဲ့ကတော့ သူ့ရဲ့ အတွေ့အကြုံအရ အကြံဉာဏ်လေး ဝင်ပေးတယ်လို့ ထင်ပေမယ့်၊ ဝန်ထမ်းတွေရဲ့ မျက်လုံးထဲမှာတော့ သူတို့ရဲ့ ကြိုးစားအားထုတ်မှုကို အသိအမှတ်မပြုဘဲ အရာရာကို ဝင်ရောက်ခြယ်လှယ်နေတဲ့ အာဏာရှင်တစ်ယောက်လို့ မြင်သွားကြပါတယ်။ ဒါကြောင့် ခေါင်းဆောင်တစ်ယောက်အနေနဲ့ ကိုယ်က အကြံဉာဏ်လေး ပေးလိုက်ရုံနဲ့ အလုပ်ပိုကောင်းသွားမယ်လို့ ထင်ရပေမယ့်၊ တကယ်တမ်းမှာတော့ ဝန်ထမ်းတွေရဲ့ ကိုယ်ပိုင်ဖန်တီးချင်စိတ်ကို ဖျက်ဆီးပစ်လိုက်သလို ဖြစ်သွားတတ်ပါတယ်။</p><p><b>တတိယအချက်ကတော့ "အခြားသူများအပေါ် အကဲဖြတ်လွန်းခြင်းနှင့် အဆိုးမြင်စကားများ ပြောဆိုခြင်း"</b> ပဲ ဖြစ်ပါတယ်။ လုပ်ငန်းခွင်မှာ လူတော်တော်များများဟာ ကိုယ်က ပိုတော်ကြောင်း၊ ပိုသိကြောင်း ပြသချင်တဲ့ စိတ်နဲ့ တခြားသူတွေရဲ့ စကားတွေကို အကဲဖြတ်တတ်ကြပါတယ်။ ဥပမာအားဖြင့် တစ်ယောက်ယောက်က အကြံဉာဏ်တစ်ခု လာပေးတဲ့အခါ "ဒါ ငါသိပြီးသားပါ" လို့ ပြန်ပြောလိုက်တာဟာ တစ်ဖက်လူကို အလွန် စိတ်အနှောင့်အယှက် ဖြစ်စေပါတယ်။ ထို့အတူပဲ စကားပြောတဲ့အခါတိုင်းမှာ "မဟုတ်ဘူး" (No)၊ "ဒါပေမဲ့" (But)၊ "ဘယ်လိုပဲဖြစ်ဖြစ်" (However) ဆိုတဲ့ စကားလုံးတွေနဲ့ စတင်တတ်တဲ့ အကျင့်ဟာလည်း တစ်ဖက်လူကို "မင်းပြောတာမှားတယ်၊ ငါပြောတာမှန်တယ်" လို့ သွယ်ဝိုက်ပြီး ပြောလိုက်တာနဲ့ အတူတူပါပဲ။ စာအုပ်ထဲမှာ ဖော်ပြထားတဲ့ မှတ်သားစရာ ဇာတ်လမ်းတစ်ပုဒ် ရှိပါတယ်။ ထိပ်တန်း အမှုဆောင်အရာရှိ တစ်ယောက်ဟာ သူ့ရဲ့ စကားပြောဆိုမှုပုံစံမှာ "No, But, However" ဆိုတဲ့ စကားလုံးတွေကို အမြဲသုံးလေ့ရှိပါတယ်။ စာရေးသူ Marshall က သူ့ကို အဲဒီအကျင့် ဖျောက်ဖို့ ပြောတဲ့အခါ သူက "ဒါပေမဲ့ (But)... ကျွန်တော် အဲဒီလို မပြောပါဘူး" ဆိုပြီး ငြင်းပါတယ်။ Marshall က "ကဲ... အခုပဲ အဲဒီစကားလုံးကို သုံးလိုက်တဲ့အတွက် ဒဏ်ကြေး ဒေါ်လာ ၂၀ ပေးပါ" လို့ ပြောလိုက်ပါတယ်။ အဲဒီအရာရှိက "မဟုတ်ဘူး (No)၊ ကျွန်တော် မသုံးပါဘူး" လို့ ထပ်ငြင်းပြန်တော့ ဒဏ်ကြေးက ဒေါ်လာ ၄၀ ဖြစ်သွားပါတယ်။ ဒီဇာတ်လမ်းကနေတဆင့် ကျွန်တော်တို့ဟာ ကိုယ်တိုင်တောင် သတိမထားမိဘဲ တစ်ဖက်လူကို ဆန့်ကျင်တဲ့ စကားလုံးတွေကို ဘယ်လောက်တောင် အလွယ်တကူ သုံးစွဲနေမိသလဲ ဆိုတာကို ထင်ရှားစွာ မြင်တွေ့ရမှာ ဖြစ်ပါတယ်။ ဒါကြောင့် တစ်စုံတစ်ယောက်က ကိုယ့်ကို အကြံပေးလာတဲ့အခါ ဘာမှ ပြန်လည်မချေပဘဲ "ကျေးဇူးတင်ပါတယ်" လို့ ရိုးရိုးရှင်းရှင်းလေး ပြောလိုက်ခြင်းကသာ အကောင်းဆုံး တုံ့ပြန်မှုဖြစ်တယ်ဆိုတာကို သင်ယူရမှာပါ။</p><p><b>နောက်ဆုံးအချက်အနေနဲ့ "ရည်မှန်းချက်အပေါ် အလွန်အကျွံ စွဲလမ်းလွန်းခြင်း" (Goal Obsession)</b> အကြောင်းကို တင်ပြချင်ပါတယ်။ ရည်မှန်းချက်ထားရှိခြင်းဟာ အောင်မြင်မှုအတွက် မရှိမဖြစ် လိုအပ်ပေမယ့်၊ အဲဒီရည်မှန်းချက်ကို အလွန်အကျွံ စွဲလမ်းသွားတဲ့အခါ ကိုယ့်ရဲ့ လူမှုရေး၊ မိသားစုရေးနဲ့ ကိုယ်ကျင့်တရားပိုင်းဆိုင်ရာတွေကိုပါ ထိခိုက်လာနိုင်ပါတယ်။ အလုပ်လုပ်တာဟာ ပိုက်ဆံရှာဖို့၊ အဲဒီပိုက်ဆံနဲ့ မိသားစုကို ရှာကျွေးဖို့ ဆိုတဲ့ မူလရည်ရွယ်ချက်ကို မေ့သွားပြီး၊ ပိုက်ဆံရှာဖို့ တစ်ခုတည်းကိုသာ ဇွတ်လုပ်နေတဲ့အခါ နောက်ဆုံးမှာ မိသားစုပါ ပြိုကွဲသွားရတဲ့ အဖြစ်ဆိုးတွေ အများကြီး ရှိပါတယ်။ ရည်မှန်းချက်ကို အကောင်အထည်ဖော်တဲ့ နေရာမှာ ရည်ရွယ်ချက် ပျောက်ဆုံးသွားခြင်းဟာ အလွန်ကြောက်စရာကောင်းတဲ့ အခြေအနေတစ်ခု ဖြစ်ပါတယ်။</p><p>ဒီအချက်ကို ပရင်စတန် တက္ကသိုလ်က ပြုလုပ်ခဲ့တဲ့ စိတ်ဝင်စားစရာ စမ်းသပ်မှုတစ်ခုနဲ့ သက်သေပြထားပါတယ်။ ဘာသာရေးကျောင်းသားတွေကို "ကြင်နာတတ်သော ရှမာရိလူမျိုး" (Good Samaritan) အကြောင်း ဟောပြောပွဲလုပ်ဖို့ အခြားအဆောက်အအုံတစ်ခုကို အမြန်သွားခိုင်းပါတယ်။ လမ်းမှာ ဒဏ်ရာရပြီး အကူအညီတောင်းနေတဲ့ လူနာဟန်ဆောင်ထားသူ တစ်ယောက်ကို ထားထားပါတယ်။ အံ့သြစရာကောင်းတာက အဲဒီ ဘာသာရေးကျောင်းသား ၉၀ ရာခိုင်နှုန်းဟာ ဟောပြောပွဲကို အချိန်မီရောက်ဖို့ဆိုတဲ့ ရည်မှန်းချက်ကို အရမ်းစွဲလမ်းနေတဲ့အတွက်၊ ဒဏ်ရာရနေသူကို လုံးဝ မကူညီဘဲ ကျော်သွားခဲ့ကြပါတယ်။ သူတို့ဟာ သူတစ်ပါးကို ကူညီရမယ်ဆိုတဲ့ တရားကို ဟောဖို့ သွားနေပေမယ့်၊ တကယ်တမ်း လက်တွေ့မှာတော့ ရည်မှန်းချက်နောက်ကို လိုက်ရင်း ကိုယ်ကျင့်တရားကို မေ့လျော့သွားခဲ့ကြတာပါ။ ဒါကြောင့် ကျွန်တော်တို့ဟာ အလုပ်လုပ်တဲ့အခါ ရည်မှန်းချက်နောက်ကို ကန်းကန်းမိုက်မိုက် လိုက်နေတာမျိုး မဖြစ်အောင် အမြဲတမ်း သတိကပ်နေဖို့ လိုအပ်ကြောင်းကို ဒီစာအုပ်က အလေးအနက် သင်ခန်းစာပေးထားပါတယ်။</p>',
  '<h3>အောင်မြင်မှုထိပ်တန်းသို့ ဆက်လက်တက်လှမ်းရန် မရှိမဖြစ်လိုအပ်သော အဓိကသော့ချက် (၅) ချက်</h3><p>ပထမဦးဆုံး အဓိကသော့ချက်အနေဖြင့် "အောင်မြင်မှုကြောင့် ဖြစ်ပေါ်လာသော မျက်ကန်းယုံကြည်မှု" (The Success Delusion) အကြောင်းကို လေ့လာကြည့်ရအောင်ပါ။ ကျွန်တော်တို့ဟာ တစ်ခုခုကို အောင်မြင်အောင် လုပ်နိုင်ခဲ့ပြီဆိုရင်၊ အဲဒီအောင်မြင်မှုရဖို့ လုပ်ဆောင်ခဲ့တဲ့ အရာအားလုံးဟာ မှန်ကန်တယ်လို့ ကောက်ချက်ချတတ်ကြပါတယ်။ တကယ်တော့ လူတစ်ယောက်ဟာ သူ့ဆီမှာ အကျင့်ဆိုးတွေ ရှိနေတဲ့ကြားကပဲ၊ တခြားသော ကောင်းမွန်တဲ့ အရည်အချင်းတွေကြောင့် အောင်မြင်နေတာမျိုး ဖြစ်နိုင်ပါတယ်။ ဒါပေမဲ့ အောင်မြင်သူတွေဟာ ကိုယ့်ရဲ့ အကျင့်ဆိုးတွေကိုပါ အောင်မြင်မှုရဲ့ လျှို့ဝှက်ချက်လို့ ထင်မှတ်မှားတတ်ကြပါတယ်။ ဥပမာအားဖြင့် ငါက ဒေါသကြီးပြီး ဝန်ထမ်းတွေကို အော်ဟစ်ဆူပူတတ်လို့ သူတို့က အလုပ်ကို သေချာလုပ်ကြတာ၊ ဒါကြောင့် ငါအောင်မြင်တာလို့ တွေးထင်တတ်ကြပါတယ်။ တကယ်တမ်းကျတော့ သူဟာ အဲဒီလို ဒေါသကြီးတဲ့ အကျင့်ဆိုးကြီး ရှိနေတဲ့ကြားကပဲ သူ့ရဲ့ ဉာဏ်ရည်ဉာဏ်သွေးကြောင့်သာ အောင်မြင်နေတာဖြစ်ပြီး၊ အဲဒီအကျင့်ဆိုးသာ မရှိဘူးဆိုရင် သူဟာ ဒီထက်မက ပိုပြီး ကြီးကျယ်တဲ့ ခေါင်းဆောင်တစ်ယောက် ဖြစ်လာနိုင်တယ်ဆိုတာကို မမြင်နိုင်ကြတော့ပါဘူး။</p><p>ဒီအချက်ကို ပိုမိုထင်ရှားစေဖို့ စာအုပ်ထဲက အမှုဆောင်အရာရှိကြီး တစ်ယောက်ရဲ့ အကြောင်းကို ဥပမာပေးချင်ပါတယ်။ သူဟာ အရောင်းပိုင်းမှာ အလွန်တော်ပေမယ့် တခြားသူတွေရဲ့ စကားကို ဘယ်တော့မှ အဆုံးထိ နားမထောင်ဘဲ ကြားဖြတ်ပြောတတ်တဲ့ အကျင့်ရှိပါတယ်။ သူ့ကို ဒီအကျင့်လေး ပြင်ဖို့ အကြံပေးတဲ့အခါ၊ သူက "ကျွန်တော် အချိန်ကုန်မခံနိုင်ဘူး၊ သူတို့ပြောချင်တာကို ကျွန်တော် ကြိုသိနေတယ်၊ ဒီလို မြန်မြန်ဆန်ဆန် ဆုံးဖြတ်နိုင်လို့ပဲ ကုမ္ပဏီက ကျွန်တော့်ကို ဒီနေရာပေးထားတာ" လို့ ပြန်လည်ချေပပါတယ်။ သူဟာ သူ့ရဲ့ နားမထောင်တတ်တဲ့ အကျင့်ဆိုးကိုပဲ အောင်မြင်မှုရဲ့ အကြောင်းရင်းအဖြစ် ဆုပ်ကိုင်ထားတာပါ။ ဒီလို ကိုယ့်ရဲ့ အားနည်းချက်ကို အားသာချက်အဖြစ် ထင်ယောင်ထင်မှား ဖြစ်နေသရွေ့ကာလပတ်လုံး၊ လူတစ်ယောက်ဟာ ဘယ်တော့မှ အပြောင်းအလဲ လုပ်နိုင်မှာ မဟုတ်ပါဘူး။ ဒါကြောင့် ကျွန်တော်တို့ဟာ ကိုယ်အောင်မြင်နေတာဟာ ကိုယ့်ရဲ့ အကျင့်ဆိုးတွေ \'ကြောင့်\' လား၊ ဒါမှမဟုတ် အဲဒီအကျင့်ဆိုးတွေ \'ရှိနေတဲ့ကြားက\' အောင်မြင်နေတာလား ဆိုတာကို သဲကွဲစွာ ခွဲခြားသိမြင်ဖို့ အလွန်အရေးကြီးပါတယ်။</p><p>ဒုတိယ အဓိကသော့ချက်ကတော့ "တန်ဖိုးများ အလွန်အကျွံ ဝင်ရောက်ဖြည့်စွက်ခြင်း" (Adding Too Much Value) ပဲ ဖြစ်ပါတယ်။ အောင်မြင်တဲ့ ခေါင်းဆောင်တွေ၊ ပညာရှင်တွေဟာ သူတို့ရဲ့ ဉာဏ်ရည်ဉာဏ်သွေးကို ပြသချင်ကြပါတယ်။ ဒါကြောင့် ကိုယ့်ရဲ့ လက်အောက်ငယ်သား ဒါမှမဟုတ် လုပ်ဖော်ကိုင်ဖက် တစ်ယောက်ယောက်က အကြံဉာဏ်ကောင်း တစ်ခု လာရောက်တင်ပြတဲ့အခါ၊ "အင်း.. မင်းအကြံဉာဏ်က တော်တော်လေး ကောင်းတယ်၊ ဒါပေမဲ့ ဒီလိုလေး လုပ်လိုက်ရင် ပိုမကောင်းဘူးလား" ဆိုပြီး ကိုယ့်ဘက်ကနေ တစ်ခုခု ဝင်ရောက်ဖြည့်စွက်ပြောဆိုမှ ကျေနပ်တတ်ကြပါတယ်။ ပြဿနာက ဘာလဲဆိုတော့ အဲဒီလို ဝင်ရောက်ဖြည့်စွက်လိုက်ခြင်းအားဖြင့် လုပ်ငန်းစဉ်က ၅ ရာခိုင်နှုန်းလောက်ပဲ ပိုကောင်းသွားနိုင်ပေမယ့်၊ အကြံဉာဏ်လာပေးတဲ့ ဝန်ထမ်းရဲ့ စိတ်အားထက်သန်မှုနဲ့ ပိုင်ဆိုင်လိုစိတ် (Ownership) ကတော့ ၅၀ ရာခိုင်နှုန်းလောက်အထိ ထိုးကျသွားတတ်တာပါပဲ။ ကိုယ့်ရဲ့ စကားတစ်ခွန်းကြောင့် အဲဒီအကြံဉာဏ်ဟာ သူ့ရဲ့ အကြံဉာဏ် မဟုတ်တော့ဘဲ သူဌေးရဲ့ အကြံဉာဏ် ဖြစ်သွားပါတော့တယ်။</p><p>ဒီအချက်နဲ့ ပတ်သက်ပြီး ထိပ်တန်း စီအီးအို တစ်ယောက်ရဲ့ အဖြစ်အပျက်က အလွန် စိတ်ဝင်စားဖို့ ကောင်းပါတယ်။ သူဟာ အစည်းအဝေးတွေမှာ ဝန်ထမ်းတွေ တင်ပြသမျှကို အမြဲတမ်း ဝင်ရောက်ပြင်ဆင်ပေးလေ့ ရှိပါတယ်။ တစ်နေ့မှာတော့ ဝန်ထမ်းတစ်ယောက်က ပရောဂျက်အသစ် တစ်ခုအတွက် အလွန်ကောင်းမွန်တဲ့ အစီအစဉ်တစ်ခုကို တင်ပြလာပါတယ်။ စီအီးအိုက သဘောကျပေမယ့် သူ့အကျင့်အတိုင်း အချက်အလက်တချို့ကို ဝင်ပြင်လိုက်ပါတယ်။ နောက်ဆက်တွဲ ရလဒ်ကတော့ အဲဒီဝန်ထမ်းဟာ ပရောဂျက်ကို ဆက်လက်လုပ်ဆောင်ရာမှာ အရင်ကလောက် တက်ကြွမှု မရှိတော့ဘဲ၊ "သူဌေး ပြင်ပေးထားတဲ့အတိုင်းပဲ လုပ်လိုက်တာပါ" ဆိုတဲ့ တာဝန်ရှောင်တဲ့ စကားမျိုး ပြောလာပါတော့တယ်။ ဒါဟာ ခေါင်းဆောင်တစ်ယောက်အနေနဲ့ ကိုယ်က အကြံဉာဏ်လေး ပေးလိုက်ရုံနဲ့ အလုပ်ပိုကောင်းသွားမယ်လို့ ထင်ရပေမယ့်၊ တကယ်တမ်းမှာတော့ ဝန်ထမ်းတွေရဲ့ ကိုယ်ပိုင်ဖန်တီးချင်စိတ်၊ တာဝန်ယူလိုစိတ်တွေကို အမြစ်ကနေ ဆွဲနှုတ်ဖျက်ဆီးပစ်လိုက်သလို ဖြစ်သွားတယ်ဆိုတာကို နက်နက်ရှိုင်းရှိုင်း သတိပြုရမယ့် အချက်ဖြစ်ပါတယ်။</p><p>တတိယ အဓိကသော့ချက်အနေဖြင့် "ရိုးသားစွာ တောင်းပန်ခြင်း၏ အစွမ်းသတ္တိ" (The Power of Apologizing) ကို ဆွေးနွေးလိုပါတယ်။ လူတော်တော်များများ၊ အထူးသဖြင့် ရာထူးကြီးမားပြီး အောင်မြင်နေသူတွေဟာ "ကျွန်တော် မှားသွားပါတယ်၊ တောင်းပန်ပါတယ်" ဆိုတဲ့ စကားကို ပြောထွက်ဖို့ အလွန် ဝန်လေးတတ်ကြပါတယ်။ သူတို့ရဲ့ စိတ်ထဲမှာ တောင်းပန်လိုက်ရင် သူတို့ရဲ့ ဩဇာအာဏာ ကျဆင်းသွားမယ်၊ အားနည်းတယ်လို့ အထင်ခံရမယ်လို့ စိုးရိမ်နေတတ်ပါတယ်။ ဒါပေမဲ့ တကယ့် လက်တွေ့မှာတော့ ရိုးသားစွာ တောင်းပန်ခြင်းဟာ ခေါင်းဆောင်တစ်ယောက်ရဲ့ အကြီးမားဆုံးသော သတ္တိနဲ့ ခွန်အားတစ်ခုပဲ ဖြစ်ပါတယ်။ ကျွန်တော်တို့ဟာ လူသားတွေဖြစ်တဲ့အတွက် အမှားနဲ့ ကင်းစင်နိုင်မှာ မမဟုတ်ပါဘူး။ အစည်းအဝေးမှာ ဒေါသထွက်ပြီး အော်မိတာ၊ သူများစကားကို ဖြတ်ပြောမိတာ၊ အချိန်မလေးစားမိတာ စတဲ့ အမှားလေးတွေကို လုပ်မိတဲ့အခါ ချက်ချင်း တောင်းပန်လိုက်ခြင်းက အခြေအနေအားလုံးကို အကောင်းဘက်သို့ ချက်ချင်း ပြောင်းလဲသွားစေနိုင်ပါတယ်။</p><p>စာအုပ်ထဲမှာ ဖော်ပြထားတဲ့ မှတ်သားစရာ ဇာတ်လမ်းတစ်ပုဒ် ရှိပါတယ်။ မာနကြီးတဲ့ အမှုဆောင်အရာရှိ တစ်ယောက်ဟာ သူ့ရဲ့ လုပ်ဖော်ကိုင်ဖက်တွေကို အမြဲတမ်း အထက်စီးကနေ ဆက်ဆံလေ့ရှိတဲ့အတွက် လူမုန်းများနေပါတယ်။ Marshall က သူ့ကို အဲဒီလုပ်ဖော်ကိုင်ဖက်တွေဆီ သွားပြီး အတိတ်က အပြုအမူတွေအတွက် ရိုးရိုးရှင်းရှင်းလေး တောင်းပန်ဖို့ အကြံပေးပါတယ်။ အစပိုင်းမှာ သူက အပြင်းအထန် ငြင်းဆန်ပေမယ့် နောက်ဆုံးမှာတော့ ကြိုးစားကြည့်ဖို့ သဘောတူလိုက်ပါတယ်။ သူက တစ်ယောက်ချင်းစီဆီကို သွားပြီး "ကျွန်တော် အရင်က ခင်ဗျားအပေါ် စကားပြောဆို ဆက်ဆံရိုင်းစိုင်းခဲ့မိတာတွေအတွက် တကယ်ကို တောင်းပန်ပါတယ်။ နောက်နောင် ပိုကောင်းအောင် နေပါ့မယ်" လို့ ပြောလိုက်တဲ့အခါ၊ တစ်ဖက်လူတွေရဲ့ အံ့သြဝမ်းသာသွားတဲ့ မျက်နှာတွေကို မြင်တွေ့ခဲ့ရပါတယ်။ တောင်းပန်ခြင်းမှာ ဆင်ခြေတွေ (ဒါပေမဲ့၊ သို့သော်) လုံးဝ မပါဝင်ရပါဘူး။ ဒီလို ရိုးသားစွာ တောင်းပန်လိုက်ခြင်းအားဖြင့် နှစ်ပေါင်းများစွာ တင်းမာနေခဲ့တဲ့ ဆက်ဆံရေးတွေဟာ ချက်ချင်းဆိုသလို ပြေလည်သွားပြီး ယုံကြည်မှုအသစ်တွေကို ပြန်လည်တည်ဆောက်နိုင်ခဲ့ပါတယ်။ ဒါဟာ အောင်မြင်သူတွေ လက်ကိုင်ထားသင့်တဲ့ အလွန်ထိရောက်တဲ့ လက်နက်တစ်ခု ဖြစ်ပါတယ်။</p><p>စတုတ္ထ အဓိကသော့ချက်မှာ "တိတ်ဆိတ်စွာဖြင့် နားထောင်ပေးခြင်း" (Active Listening without Interrupting) ဖြစ်ပါတယ်။ ကျွန်တော်တို့ အများစုဟာ သူတစ်ပါးစကားကို နားထောင်တဲ့အခါ တစ်ဖက်လူ ပြောတာကို နားလည်ဖို့အတွက် နားထောင်တာထက်၊ ကိုယ်ဘာပြန်ပြောရမလဲ ဆိုတာကို စဉ်းစားဖို့အတွက်သာ နားထောင်နေတတ်ကြပါတယ်။ အထူးသဖြင့် ဉာဏ်ကောင်းတဲ့ သူတွေဟာ တစ်ဖက်လူ စကားမဆုံးခင်မှာတင် ဘာပြောချင်လဲဆိုတာကို ရိပ်မိတဲ့အတွက် ကြားဖြတ်ပြောဆိုတတ်ကြပါတယ်။ ဒါဟာ တစ်ဖက်လူကို "မင်းပြောတာတွေက အရေးမပါဘူး၊ ငါက မင်းထက် ပိုသိတယ်" လို့ သွယ်ဝိုက်ပြီး စော်ကားလိုက်တာနဲ့ အတူတူပါပဲ။ ခေါင်းဆောင်ကောင်း တစ်ယောက်ဖြစ်ဖို့ဆိုရင် ကိုယ့်ရဲ့ ပါးစပ်ကို ပိတ်ပြီး တစ်ဖက်လူရဲ့ စကားကို အာရုံစူးစိုက်စွာ နားထောင်ပေးတတ်တဲ့ အကျင့်ကို မဖြစ်မနေ မွေးမြူရပါလိမ့်မယ်။</p><p>ဒီအချက်ကို လေ့ကျင့်ဖို့အတွက် အလွန်ခက်ခဲတဲ့ စမ်းသပ်မှုတစ်ခုကို စာရေးသူက ပြုလုပ်ခိုင်းလေ့ရှိပါတယ်။ အဲဒါကတော့ တစ်ဖက်လူ စကားပြောနေချိန်မှာ လုံးဝ (လုံးဝ) ဝင်မပြောဘဲ၊ ခေါင်းညိတ်ရုံ သို့မဟုတ် မျက်လုံးချင်းဆုံပြီး နားထောင်ရုံကလွဲလို့ ဘာမှမလုပ်ဖို့ပဲ ဖြစ်ပါတယ်။ အောင်မြင်တဲ့ စီအီးအိုကြီးတွေတောင် ဒီလို ၅ မိနစ်လောက် ငြိမ်ငြိမ်လေး နားထောင်ပေးဖို့ကို အလွန် ရုန်းကန်ရပါတယ်။ သူတို့ရဲ့ စိတ်ထဲမှာ တစ်ခုခု ဝင်ပြောချင်တဲ့ ဆန္ဒတွေက အလွန်ပြင်းထန်နေတတ်လို့ပါ။ ဒါပေမဲ့ ဒီလို တိတ်ဆိတ်စွာ နားထောင်ပေးခြင်းအားဖြင့် တစ်ဖက်လူဟာ သူ့ကိုယ်သူ လေးစားမှုခံရတယ်လို့ ခံစားရပြီး၊ သူတို့ရဲ့ ရင်တွင်းက အစစ်အမှန် ခံစားချက်တွေ၊ အကြံဉာဏ်တွေကို ပွင့်ပွင့်လင်းလင်း ပြောပြလာကြပါတယ်။ နားထောင်ခြင်းဆိုတာ ပါးစပ်ကို ပိတ်ထားရုံတင်မကဘဲ၊ စိတ်ထဲကနေ အကဲဖြတ်ဝေဖန်နေမှုတွေကိုပါ ရပ်တန့်ထားဖို့ လိုအပ်တယ်ဆိုတာကို နက်ရှိုင်းစွာ သဘောပေါက်ရပါမယ်။</p><p>ပဉ္စမမြောက်နှင့် နောက်ဆုံး အဓိကသော့ချက်ကတော့ "အတိတ်ကို မဝေဖန်ဘဲ အနာဂတ်အတွက် အကြံပြုခြင်း" (Practicing Feedforward instead of Feedback) ပဲ ဖြစ်ပါတယ်။ လုပ်ငန်းခွင်မှာ ကျွန်တော်တို့ဟာ ဝန်ထမ်းတွေကို ဝေဖန်အကြံပြုချက် (Feedback) တွေ အမြဲပေးလေ့ရှိပါတယ်။ ဒါပေမဲ့ Feedback ဆိုတာက ပြီးသွားတဲ့ အတိတ်က အမှားတွေကို ပြန်ပြောပြတာဖြစ်လို့၊ လူတော်တော်များများက နားထောင်ရတာ စိတ်ခုတတ်ကြပြီး ကာကွယ်ပြောဆိုချင်တဲ့ (Defensive) စိတ်တွေ ဝင်လာတတ်ပါတယ်။ ဒါကို ကျော်လွှားဖို့အတွက် Marshall Goldsmith က "Feedforward" ဆိုတဲ့ အလွန်ဆန်းသစ်ပြီး ထိရောက်တဲ့ နည်းလမ်းတစ်ခုကို မိတ်ဆက်ပေးထားပါတယ်။ အဲဒါကတော့ အတိတ်က အမှားတွေကို လုံးဝ ပြန်မပြောတော့ဘဲ၊ အနာဂတ်မှာ ပိုကောင်းအောင် ဘယ်လိုလုပ်ရမလဲ ဆိုတဲ့ အကြံဉာဏ်ကိုသာ တောင်းခံခြင်း၊ ပေးခြင်းပဲ ဖြစ်ပါတယ်။</p><p>ဥပမာအားဖြင့် မိတ်ဆွေက ခေါင်းဆောင်ကောင်း တစ်ယောက်ဖြစ်ချင်တယ်ဆိုရင်၊ လုပ်ဖော်ကိုင်ဖက်တွေဆီ သွားပြီး "ကျွန်တော် အရင်က ဘယ်လို အမှားတွေ လုပ်ခဲ့သလဲ" လို့ မေးမယ့်အစား၊ "ကျွန်တော် နောက်နောင် ပိုကောင်းတဲ့ ခေါင်းဆောင်တစ်ယောက် ဖြစ်လာဖို့အတွက် အနာဂတ်မှာ လုပ်သင့်တဲ့ အကြံဉာဏ် နှစ်ခုလောက် ပေးပါ" လို့ တောင်းဆိုရမှာပါ။ ဒီလိုမေးလိုက်တဲ့အခါ တစ်ဖက်လူအနေနဲ့လည်း အတိတ်က ပြဿနာတွေကို ထောက်ပြစရာ မလိုတော့တဲ့အတွက် ပေါ့ပေါ့ပါးပါးနဲ့ အပြုသဘောဆောင်တဲ့ အကြံဉာဏ်တွေကို ပေးလာနိုင်ပါတယ်။ ပြီးတော့ အကြံဉာဏ်ရလာတဲ့အခါ ကိုယ့်ဘက်ကနေ လုံးဝ ပြန်လည်မချေပဘဲ၊ မငြင်းဆန်ဘဲ "ကျေးဇူးတင်ပါတယ်" လို့သာ ရိုးရိုးရှင်းရှင်းလေး တုံ့ပြန်ရပါမယ်။ ဒီ Feedforward နည်းလမ်းဟာ လုပ်ငန်းခွင်အတွင်းမှာ လူပုဂ္ဂိုလ်ရေး ထိခိုက်မှုတွေကို ရှောင်ရှားနိုင်ပြီး၊ အနာဂတ် တိုးတက်ရေးကိုသာ အာရုံစိုက်နိုင်စေတဲ့အတွက် အလွန် အစွမ်းထက်တဲ့ ကိရိယာတစ်ခု ဖြစ်ပါတယ်။</p>',
  '<h3>လက်တွေ့ဘဝနှင့် လုပ်ငန်းခွင်တွင် အသုံးချခြင်း</h3><p>ဒီစာအုပ်ထဲက အတွေးအခေါ်တွေကို လက်တွေ့ဘဝနဲ့ လုပ်ငန်းခွင်မှာ ဘယ်လို အသုံးချမလဲဆိုတာက အလွန်အရေးကြီးပါတယ်။ ပထမဆုံးအနေနဲ့ ကိုယ့်ရဲ့ အားနည်းချက်တွေကို ရှာဖွေဖော်ထုတ်ဖို့အတွက် လုပ်ဖော်ကိုင်ဖက်တွေဆီကနေ အကြံပြုချက် (Feedback) တောင်းခံရပါမယ်။ ဒါပေမဲ့ အတိတ်က အမှားတွေကို ပြန်ပြောနေမယ့် အစား အနာဂတ်မှာ ဘယ်လို ပိုကောင်းအောင် လုပ်ရမလဲဆိုတဲ့ အကြံဉာဏ် (Feedforward) ကို တောင်းခံတဲ့ နည်းလမ်းဟာ ပိုပြီး ထိရောက်ပါတယ်။ ဥပမာအားဖြင့် "ကျွန်တော် နောက်နောင် ပိုကောင်းတဲ့ ခေါင်းဆောင်တစ်ယောက် ဖြစ်လာဖို့အတွက် အကြံဉာဏ် နှစ်ခုလောက် ပေးပါ" လို့ တောင်းဆိုရမှာပါ။ ဒီလို အကြံပေးလာတဲ့အခါ ကိုယ့်ဘက်က လုံးဝ ပြန်လည်မချေပဘဲ၊ မငြင်းဆန်ဘဲ "ကျေးဇူးတင်ပါတယ်" လို့သာ ယဉ်ယဉ်ကျေးကျေး ပြန်လည်တုံ့ပြန်ဖို့ အထူးလိုအပ်ပါတယ်။ ဒါဟာ ကိုယ့်ရဲ့ လွတ်လပ်ခွင့်နဲ့ အတ္တကို ခေတ္တဘေးဖယ်ထားပြီး သူတစ်ပါးရဲ့ အမြင်ကို လေးစားစွာ လက်ခံခြင်းပဲ ဖြစ်ပါတယ်။</p><p>ထို့ပြင် ကိုယ့်ကြောင့် နစ်နာခဲ့ရသူတွေ၊ စိတ်အနှောင့်အယှက် ဖြစ်ခဲ့ရသူတွေကို ရိုးသားစွာ တောင်းပန်ခြင်း (Apologizing) ဟာလည်း ခေါင်းဆောင်ကောင်းတို့ရဲ့ မရှိမဖြစ် လိုအပ်တဲ့ အရည်အသွေးတစ်ခု ဖြစ်ပါတယ်။ တောင်းပန်လိုက်ခြင်းအားဖြင့် ကိုယ်က ရှုံးနိမ့်သွားတာ မဟုတ်ဘဲ၊ ပိုမိုခိုင်မာတဲ့ ယုံကြည်မှုကို တည်ဆောက်နိုင်မှာပါ။ လုပ်ငန်းခွင်မှာ ကိုယ့်ရဲ့ အကျင့်စရိုက်တွေကို ဝန်ထမ်းတွေ သိရှိနားလည်စေဖို့အတွက် စာအုပ်ထဲက အမှုဆောင်အရာရှိ တစ်ယောက် လုပ်ခဲ့သလိုမျိုး "ကျွန်တော့်ကို ဘယ်လို ဆက်ဆံရမလဲ" (How to Handle Me) ဆိုတဲ့ မှတ်စုလေးရေးပြီး ဝန်ထမ်းတွေကို ပေးထားတာဟာလည်း အလွန်လက်တွေ့ကျတဲ့ နည်းလမ်းတစ်ခုပါ။ အဲဒီမှတ်စုမှာ ကိုယ်က ဘယ်လိုကိစ္စတွေကို သဘောကျတယ်၊ ဘယ်လိုကိစ္စတွေကိုတော့ မကြိုက်ဘူး၊ ကိုယ့်ရဲ့ အားနည်းချက်တွေက ဘာတွေဖြစ်တယ် ဆိုတာကို ပွင့်ပွင့်လင်းလင်း ရေးသားထားခြင်းအားဖြင့် ဝန်ထမ်းတွေအနေနဲ့ ကိုယ့်ကို ဘယ်လိုချဉ်းကပ်ရမလဲဆိုတာကို ရှင်းရှင်းလင်းလင်း သိသွားပါလိမ့်မယ်။</p><p>နောက်ဆုံးတစ်ချက်ကတော့ ပြောင်းလဲမှုတွေကို ရေရှည်တည်တံ့စေဖို့အတွက် ပုံမှန် နောက်ဆက်တွဲ စောင့်ကြည့်လေ့လာခြင်း (Follow-up) လုပ်ဖို့ပါ။ ကိုယ်ပြောင်းလဲမယ်လို့ ကတိပေးထားတဲ့ အရာတွေကို တကယ်လက်တွေ့မှာ လုပ်နေရဲ့လားဆိုတာကို လုပ်ဖော်ကိုင်ဖက်တွေကို မကြာခဏ ပြန်မေးရပါမယ်။ ဒီလို ပုံမှန် မေးမြန်းနေခြင်းကသာ ကိုယ့်ကို အမြဲတမ်း သတိတရားရစေပြီး လမ်းကြောင်းမှန်ပေါ်မှာ ဆက်လက်လျှောက်လှမ်းနိုင်အောင် ကူညီပေးမှာ ဖြစ်ပါတယ်။ မိတ်ဆွေတို့အနေနဲ့ ဒီနည်းလမ်းတွေကို မနက်ဖြန်ကစပြီး လုပ်ငန်းခွင်မှာ ချက်ချင်း လက်တွေ့အသုံးချကြည့်မယ်ဆိုရင် အံ့မခန်း အပြောင်းအလဲတွေကို ကိုယ်တိုင် တွေ့ကြုံခံစားရမှာ အသေအချာပါပဲ။</p>',
  '<h3>နိဂုံးနှင့် ရှေ့ဆက်ရန် အကြံပြုချက်</h3><p>အချုပ်အားဖြင့် ဆိုရလျှင် "What Got You Here Won\'t Get You There" စာအုပ်ဟာ ကျွန်တော်တို့ သတိမထားမိဘဲ ကျူးလွန်နေမိတဲ့ လူမှုဆက်ဆံရေး အမှားအယွင်းတွေကို မှန်ကန်စွာ ထောက်ပြပေးနိုင်စွမ်း ရှိပါတယ်။ အောင်မြင်မှုဆိုတာ ရပ်တန့်နေတဲ့ အရာတစ်ခု မဟုတ်ဘဲ အမြဲတမ်း ပြောင်းလဲတိုးတက်နေရမယ့် ခရီးစဉ်တစ်ခု ဖြစ်ပါတယ်။ အဲဒီခရီးစဉ်မှာ ဆက်လက် အောင်မြင်ချင်တယ်ဆိုရင် ကိုယ့်ရဲ့ အတိတ်က အောင်မြင်မှုတွေ၊ အကျင့်စရိုက်ဟောင်းတွေအပေါ် တွယ်တာနေတဲ့ စိတ်ကို စွန့်လွှတ်ရပါလိမ့်မယ်။</p><p>စာအုပ်ရဲ့ နိဂုံးချုပ်မှာ စာရေးသူက အလွန် လှပတဲ့ အတွေးအခေါ်တစ်ခုကို ချန်ရစ်ပေးခဲ့ပါတယ်။ အသက် ၉၅ နှစ်အရွယ် သေခါနီးအချိန်ကို ရောက်နေပြီလို့ သဘောထားပြီး အခုလက်ရှိ ကိုယ့်ကိုယ်ကိုယ် အကြံဉာဏ်ပေးကြည့်ပါလို့ ဆိုပါတယ်။ သေချာတာကတော့ အဲဒီအချိန်ရောက်ရင် ငါ ရာထူးလေးတစ်ခု ထပ်တိုးဖို့ လိုသေးတယ်၊ ပိုက်ဆံတွေ အများကြီး ရှာဖို့ လိုသေးတယ်လို့ ဘယ်သူမှ တွေးမိမှာ မဟုတ်ပါဘူး။</p><p>တကယ့်တကယ် အရေးကြီးတာက ကိုယ်ချစ်ရတဲ့ မိသားစု၊ မိတ်ဆွေ သူငယ်ချင်းတွေနဲ့ အချိန်တွေ အများကြီး မဖြတ်သန်းခဲ့ရတာ၊ ကိုယ်တကယ် ဖြစ်ချင်တဲ့ အိမ်မက်တွေကို မလုပ်ခဲ့ရတာတွေကိုသာ နောင်တရနေကြမှာပါ။ ဒါကြောင့် မိတ်ဆွေတို့အနေနဲ့ ကိုယ့်ရဲ့ လုပ်ငန်းခွင် အောင်မြင်မှုနောက်ကို လိုက်ရင်း ဘဝရဲ့ အနှစ်သာရ အစစ်အမှန်ဖြစ်တဲ့ လူသားဆန်မှု၊ ကြင်နာမှုနဲ့ ပျော်ရွှင်မှုတွေကို မေ့လျော့မနေဖို့ အရေးကြီးပါတယ်။ ကိုယ့်ရဲ့ အပြုအမူလေးတွေကို သတိထားပြီး ပြင်ဆင်လိုက်ရုံနဲ့ လုပ်ငန်းခွင်မှာသာမက ဘဝမှာပါ ပိုမိုကြီးမားတဲ့ အောင်မြင်ပျော်ရွှင်မှုတွေကို ရရှိပိုင်ဆိုင်နိုင်ပါစေလို့ ဆန္ဒပြု တိုက်တွန်းလိုက်ရပါတယ်။</p>'
]

            "The Earned Life": {
                title: "The Earned Life",

                description: "Marshall Goldsmith နှင့် Mark Reiter တို့ ရေးသားထားသော **The Earned Life** စာအုပ်မသည် **နောင်တကင်းဝေး၍ စိတ်ကျေနပ်မှုအပြည့်ရှိသော ဘဝ**ကို မည်သို့တည်ဆောက်ရမည်ကို လမ်းညွှန်ထားသည်။ စာရေးသူက ကျွန်ုပ်တို့၏ဘဝသည် **နောင်တ (Regret)** နှင့် **ပြည့်စုံမှု (Fulfillment)** ကြားတွင် အမြဲကူးလူးနေပြီး၊ မိမိတို့ပြုလုပ်သမျှ ရွေးချယ်မှုတိုင်းသည် ပန်းတိုင်တစ်ခုခုနှင့် ချိတ်ဆက်နေရမည်ဟု ဆိုသည်။ ဘဝကို အဓိပ္ပာယ်ရှိစေရန်အတွက် **ရည်ရွယ်ချက်၊ အောင်မြင်မှုနှင့် ပျော်ရွှင်မှု** အစရှိသည့် အချက်များကို အခြေခံ၍ နေ့စဉ်ဘဝကို ကြိုးစားအားထုတ်ရန် တိုက်တွန်းထားသည်။ ထို့အပြင် အတိတ်က အမှားများကို သင်ခန်းစာယူ၍ **လက်ရှိပစ္စုပ္ပန်တည့်တည့်တွင် အကောင်းဆုံးရှင်သန်ရန်** ဗုဒ္ဓ၏အဆုံးအမဖြစ်သော 'ထွက်သက်ဝင်သက်တိုင်းသည် ဘဝအသစ်ဖြစ်သည်' ဟူသည့် အယူအဆကို အသုံးချရန် ဖော်ပြထားသည်။ အောင်မြင်ကျော်ကြားသော ခေါင်းဆောင်များ၏ အဆိုအမိန့်များမှတစ်ဆင့် မိမိကိုယ်တိုင် စီမံခန့်ခွဲနိုင်သော **အမှန်တကယ် ထိုက်တန်သည့်ဘဝ**ကို ပိုင်ဆိုင်နိုင်မည့် နည်းလမ်းများကို ဤစာအုပ်က အဓိကမီးမောင်းထိုးပြထားပါသည်။",

                summaryHeading: "<h2>အသက်ရှင်ရကျိုးနပ်သော ဘဝကို တည်ဆောက်ခြင်း - နောင်တကင်းမဲ့ပြီး ပြည့်စုံလုံလောက်မှုရှိသော ဘဝဆီသို့</h2>",
                summaryParagraphs: [
  '<h3>မိတ်ဆက်နှင့် အဓိကပြဿနာ</h3><p>မိတ်ဆွေတို့အနေနဲ့ ဘဝမှာ တစ်ခုခုကို ပြင်းပြင်းပြပြ လိုချင်ခဲ့ပြီး အဲဒီအရာကို ရဖို့အတွက် ခက်ခဲပင်ပန်းစွာ ကြိုးစားအားထုတ်ခဲ့ကြဖူးမှာပါ။ ဒါပေမဲ့ တကယ်တမ်း အဲဒီရည်မှန်းချက်ကို ရောက်သွားတဲ့အခါမှာရော ထင်သလောက် ပျော်ရွှင်မနေဘူး၊ ခဏတာပဲ ဝမ်းသာပြီး ချက်ချင်းပဲ ဟာလာဟင်းလင်း ဖြစ်သွားတယ်ဆိုတဲ့ ခံစားချက်မျိုးကို ကြုံဖူးပါသလား။ ကျွန်တော်တို့ လူသားတွေဟာ အမြဲတမ်းလိုလို "ငါ ရာထူးတိုးရင် ပျော်ရွှင်သွားမှာပါ"၊ "ငါ ကားအသစ်ဝယ်နိုင်ရင် ပြည့်စုံသွားမှာပါ" ဆိုတဲ့ မျှော်လင့်ချက်တွေနဲ့ အသက်ရှင်နေကြတာပါ။ ဒါပေမဲ့ တကယ့်လက်တွေ့မှာတော့ အဲဒီရလဒ်တွေက ကျွန်တော်တို့ကို ရေရှည်တည်တံ့တဲ့ ပျော်ရွှင်မှုကို မပေးစွမ်းနိုင်ပါဘူး။ ဒီလိုနဲ့ အချိန်တွေ ကုန်လွန်သွားတဲ့အခါ ကျွန်တော်တို့ရဲ့ ဘဝဟာ အောင်မြင်မှုတွေ ရှိနေပေမယ့်လည်း အတွင်းစိတ်ထဲမှာတော့ နောင်တတရားတွေ၊ မွန်းကျပ်မှုတွေနဲ့ ပြည့်နှက်နေတတ်ပါတယ်။ ကိုယ်တကယ် လိုချင်တဲ့ဘဝကို မတည်ဆောက်နိုင်ခဲ့ဘူးဆိုတဲ့ နောင်တကြီးက ကျွန်တော်တို့ကို ခြောက်လှန့်နေတတ်ပါတယ်။ ဒါဟာ ဒီနေ့ခေတ် လုပ်ငန်းခွင်မှာ ကြိုးစားရုန်းကန်နေကြတဲ့ လူငယ်လူရွယ်တွေနဲ့ လုပ်ငန်းရှင်တွေ အဓိက ရင်ဆိုင်နေရတဲ့ ပြဿနာကြီးတစ်ခု ဖြစ်ပါတယ်။</p><p>ဒီလို နက်နဲတဲ့ စိတ်ပိုင်းဆိုင်ရာ ပြဿနာကို ကမ္ဘာ့ထိပ်တန်း ခေါင်းဆောင်မှုဆိုင်ရာ နည်းပြတစ်ဦးဖြစ်တဲ့ မာရှယ်လ် ဂိုးစမစ် (Marshall Goldsmith) က သူရဲ့ "The Earned Life: Lose Regret, Choose Fulfillment" ဆိုတဲ့ စာအုပ်မှာ အဖြေရှာပေးထားပါတယ်။ မာရှယ်လ် ဂိုးစမစ် ဟာ ထိပ်တန်း အမှုဆောင်အရာရှိချုပ် (CEO) ပေါင်းများစွာကို အကြံပေးခဲ့သူဖြစ်ပြီး လူတွေရဲ့ အောင်မြင်မှုနဲ့ ပျော်ရွှင်မှုကြားက ကွာဟချက်ကို သေသေချာချာ နားလည်ထားသူပါ။ သူက ဘဝမှာ နောင်တ (Regret) နဲ့ ပြည့်စုံလုံလောက်မှု (Fulfillment) ဆိုတဲ့ ဆန့်ကျင်ဘက် အစွန်းနှစ်ဖက် ရှိတယ်လို့ ဆိုပါတယ်။ လူအများစုဟာ အပြင်ပန်းမှာ အောင်မြင်နေပေမယ့် မိသားစုကို အချိန်မပေးနိုင်ခဲ့တာ၊ ကိုယ်ဝါသနာပါတဲ့ အလုပ်ကို မလုပ်ခဲ့ရတာ စတဲ့ နောင်တတွေနဲ့ နေထိုင်နေကြရပါတယ်။ ဥပမာအားဖြင့် ဥရောပက အောင်မြင်လှတဲ့ CEO ဂန်သာ (Gunther) ဆိုတဲ့သူဟာ သူ့ရဲ့ အလုပ်မှာ အမြဲတမ်း ထိပ်တန်းရောက်နေပေမယ့် မိသားစုဘဝ ပျက်စီးသွားရတဲ့အတွက် ကြီးမားတဲ့ နောင်တတွေနဲ့ ရှင်သန်နေရပါတယ်။ ဒါဟာ "ရကျိုးနပ်တဲ့ ဘဝ" မဟုတ်ပါဘူး။</p><p>ဒါကြောင့် စာရေးသူက "ကျွန်တော်တို့ရဲ့ ရွေးချယ်မှုတွေ၊ စွန့်စားမှုတွေနဲ့ ကြိုးစားအားထုတ်မှုတွေဟာ ရလဒ်ကောင်းသည်ဖြစ်စေ၊ ဆိုးသည်ဖြစ်စေ ကိုယ့်ဘဝရဲ့ အမြင့်မားဆုံးသော ရည်ရွယ်ချက်ကြီးတစ်ခုနဲ့ ကိုက်ညီနေတဲ့အခါမှသာ အသက်ရှင်ရကျိုးနပ်တဲ့ ဘဝ (Earned Life) ကို ရရှိတာဖြစ်တယ်" လို့ တင်ပြထားပါတယ်။ ဒီစာအုပ်ဟာ ကျွန်တော်တို့ကို အောင်မြင်မှုနောက်ကို လိုက်ရင်း ကိုယ့်ကိုယ်ကိုယ် ပျောက်ဆုံးသွားတာမျိုး မဖြစ်စေဘဲ၊ နေ့စဉ် ဖြတ်သန်းနေတဲ့ အချိန်တိုင်းမှာ တန်ဖိုးရှိရှိနဲ့ နောင်တကင်းကင်း နေထိုင်နိုင်မယ့် အတွေးအခေါ်သစ်တွေကို လမ်းပြပေးထားပါတယ်။ ဒါကြောင့် ဒီစာအုပ်ရဲ့ အနှစ်သာရတွေကို ကျွန်တော်တို့ အတူတူ လေ့လာကြည့်ကြရအောင်ပါ။</p>',
  '<h3>စာအုပ်၏ အနှစ်သာရနှင့် အတွေးအခေါ်များ</h3><p>ဒီစာအုပ်ထဲမှာ ကျွန်တော်တို့ရဲ့ ဘဝကို ပြောင်းလဲစေနိုင်တဲ့ အဓိက အတွေးအခေါ် အမြောက်အမြား ပါဝင်ပါတယ်။ အဲဒီအထဲကမှ လက်တွေ့ဘဝမှာ အထိရောက်ဆုံး အသုံးချနိုင်မယ့် အချက်သုံးချက်ကို ရွေးချယ်ပြီး အသေးစိတ် ဆွေးနွေးတင်ပြပေးသွားပါ့မယ်။</p><p><b>ထွက်သက်ဝင်သက်တိုင်းမှာ အသစ်ပြန်ဖြစ်နေတဲ့ ကိုယ်ပိုင်ဘဝ (The Every Breath Paradigm)</b></p><p>ပထမဆုံး သတိပြုရမယ့် အချက်ကတော့ ဗုဒ္ဓဘာသာရဲ့ အနိစ္စတရားအပေါ် အခြေခံထားတဲ့ "Every Breath Paradigm" လို့ခေါ်တဲ့ အတွေးအခေါ်ပဲ ဖြစ်ပါတယ်။ မာရှယ်လ် ဂိုးစမစ်က ဗုဒ္ဓမြတ်စွာဘုရားရဲ့ "ထွက်သက်ဝင်သက်တိုင်းမှာ ငါဟာ လူသစ်တစ်ယောက် ဖြစ်နေတယ်" ဆိုတဲ့ အဆုံးအမကို ယူပြီး ကျွန်တော်တို့ရဲ့ ဘဝကို ရှင်းပြထားပါတယ်။ ကျွန်တော်တို့ လူသားတွေဟာ အတိတ်က အမှားတွေ၊ အတိတ်က အောင်မြင်မှုတွေ အပေါ်မှာ ဖက်တွယ်ပြီး နေထိုင်တတ်ကြပါတယ်။ "ငါ အရင်က ဒီလို အမှားမျိုး လုပ်ခဲ့ဖူးတယ်၊ ငါဟာ လူဆိုးပဲ" ဆိုပြီး ကိုယ့်ကိုယ်ကိုယ် အပြစ်တင်နေတတ်သလို၊ "ငါ အရင်က ဒီလို အောင်မြင်ခဲ့တာပဲ" ဆိုပြီး အတိတ်က ဂုဏ်ပုဒ်တွေနဲ့ပဲ ကျေနပ်နေတတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ့်လက်တွေ့မှာတော့ စက္ကန့်တိုင်း မိနစ်တိုင်းမှာ အသက်ရှူသွင်းလိုက်တိုင်း ကျွန်တော်တို့ဟာ အတိတ်က လူမဟုတ်တော့ဘဲ ပစ္စုပ္ပန်မှာ လူသစ်တစ်ယောက် အနေနဲ့ ပြန်လည် မွေးဖွားနေတာ ဖြစ်ပါတယ်။ ဒါကြောင့် အတိတ်က အမှားတွေကို သင်ခန်းစာယူပြီး လွှတ်ချလိုက်ဖို့ လိုအပ်သလို၊ ပစ္စုပ္ပန် အချိန်လေးမှာ အကောင်းဆုံး ဖြစ်အောင် ကြိုးစားဖို့ကသာ အရေးကြီးဆုံး ဖြစ်တယ်ဆိုတာကို ဒီအချက်က မီးမောင်းထိုးပြနေပါတယ်။</p><p>ဒီအတွေးအခေါ်ကို ပိုပြီး ရှင်းလင်းသွားအောင် စာအုပ်ထဲက မိုက်က် (Mike) ဆိုတဲ့ CEO တစ်ယောက်ရဲ့ ဇာတ်လမ်းလေးကို ပြောပြချင်ပါတယ်။ မိုက်က်ဟာ အရင်တုန်းက အလုပ်ကိုပဲ ဦးစားပေးပြီး အတ္တကြီးလွန်းတဲ့၊ ကိုယ်ချင်းစာတရား ခေါင်းပါးတဲ့ လူတစ်ယောက် ဖြစ်ခဲ့ပါတယ်။ နောက်ပိုင်းမှာ မာရှယ်လ်နဲ့ နည်းပြခံရင်း သူဟာ လူကောင်းတစ်ယောက် ဖြစ်လာခဲ့ပါတယ်။ ဒါပေမဲ့ သူ့ရဲ့ ဇနီးဖြစ်သူ ရှယ်ရီ (Sherry) ကတော့ လွန်ခဲ့တဲ့ ဆယ်နှစ်က မိုက်က်ရဲ့ အပြုအမူတွေကို တွေးပြီး အမြဲတမ်း စိတ်ခုနေဆဲပါ။ တစ်နေ့မှာတော့ ကားအတူစီးလာရင်း ရှယ်ရီက အတိတ်က ကိစ္စတွေကို ပြန်ပြောပြီး ပြဿနာရှာတဲ့အခါ၊ မိုက်က်က တည်တည်ငြိမ်ငြိမ်နဲ့ပဲ "မင်းပြောတာ မှန်ပါတယ်။ လွန်ခဲ့တဲ့ ဆယ်နှစ်က လူဟာ အရမ်းကို ဆိုးရွားခဲ့ပါတယ်။ ဒါပေမဲ့ အခု ဒီကားပေါ်မှာ ထိုင်နေတဲ့လူက အဲဒီလူ မဟုတ်တော့ပါဘူး။ သူဟာ ပိုကောင်းတဲ့ လူတစ်ယောက် ဖြစ်အောင် ကြိုးစားနေသူပါ။ အတိတ်က မရှိတော့တဲ့ လူတစ်ယောက်ရဲ့ အမှားတွေအတွက် အခု ပစ္စုပ္ပန်က လူကို အပြစ်တင်နေတာ တရားသလား" လို့ မေးလိုက်ပါတယ်။ အဲဒီအခါကျမှ ရှယ်ရီလည်း သဘောပေါက်သွားပြီး ခွင့်လွှတ်နားလည်ပေးနိုင်ခဲ့ပါတယ်။</p><p>ဒီဇာတ်လမ်းလေးက ကျွန်တော်တို့ကို ဘာပြောနေသလဲဆိုရင် ကျွန်တော်တို့ဟာ ကိုယ့်ကိုယ်ကိုယ်ရော၊ သူတစ်ပါးကိုပါ အတိတ်က ပုံရိပ်တွေနဲ့ပဲ အကဲဖြတ်နေကြတယ် ဆိုတာပါပဲ။ အဲဒီလို အကဲဖြတ်နေသရွေ့ ကျွန်တော်တို့ဟာ နောင်တတွေ၊ နာကြည်းမှုတွေကြားမှာပဲ သံသရာလည်နေမှာပါ။ "Every Breath Paradigm" ကို လက်ခံကျင့်သုံးလိုက်တဲ့အခါ ကျွန်တော်တို့ဟာ နေ့စဉ် ထွက်သက်ဝင်သက်တိုင်းမှာ ဘဝကို အသစ်ပြန်စတင်နိုင်တဲ့ အခွင့်အရေး ရရှိသွားပါတယ်။ ကိုယ်ဖြစ်ချင်တဲ့ ဘဝကို နေ့စဉ် အသစ်တဖန် ပြန်လည် တည်ဆောက်ခွင့် (Re-earn) ရသွားတာမို့ အတိတ်က နောင်တတွေကို လွှတ်ချနိုင်ပြီး ပစ္စုပ္ပန်မှာ လွတ်လပ်ပေါ့ပါးစွာနဲ့ ရှင်သန်နိုင်မှာ ဖြစ်ပါတယ်။</p><p><b>လုပ်ဆောင်ချက်၊ ရည်မှန်းချက်နှင့် ရည်ရွယ်ချက် မျှခြေညီခြင်း (The Action, Ambition, and Aspiration Model)</b></p><p>ဒုတိယမြောက် အရေးကြီးတဲ့ အချက်ကတော့ ကျွန်တော်တို့ရဲ့ နေ့စဉ် လုပ်ရပ်တွေဟာ တကယ့် ရည်ရွယ်ချက်ကြီးနဲ့ ကိုက်ညီမှု ရှိမရှိ ဆိုတာကို ဆန်းစစ်တဲ့ "Triple A Model" ပဲ ဖြစ်ပါတယ်။ ဒီမော်ဒယ်မှာ အပိုင်းသုံးပိုင်း ပါဝင်ပါတယ်။ Action (လုပ်ဆောင်ချက်) ဆိုတာက လက်ရှိ အခုချက်ချင်း လုပ်နေတဲ့ အရာတွေပါ။ Ambition (ရည်မှန်းချက်) ဆိုတာက အချိန်ကာလ တစ်ခု သတ်မှတ်ပြီး ရယူချင်တဲ့ ပန်းတိုင်တွေ (ဥပမာ - ရာထူးတိုးဖို့၊ ပရောဂျက် ပြီးဖို့) ဖြစ်ပါတယ်။ Aspiration (ရည်ရွယ်ချက်) ဆိုတာကတော့ အချိန်ကာလ အကန့်အသတ်မရှိဘဲ ကိုယ်ဘယ်လို လူမျိုးဖြစ်ချင်တာလဲ၊ ဘဝမှာ ဘယ်လို တန်ဖိုးတွေထားပြီး ရှင်သန်ချင်တာလဲ ဆိုတဲ့ ပိုမို ကြီးမားမြင့်မြတ်တဲ့ ရည်ရွယ်ချက် ဖြစ်ပါတယ်။ ကျွန်တော်တို့ အများစုဟာ နေ့စဉ် အလုပ်တွေ (Action) နဲ့ ကာလတို ရည်မှန်းချက်တွေ (Ambition) နောက်ကိုသာ လိုက်နေကြပြီး၊ တကယ့် ဘဝရဲ့ ရည်ရွယ်ချက် (Aspiration) ကို မေ့လျော့နေတတ်ကြပါတယ်။ အဲဒီ သုံးခု ဟန်ချက်မညီတဲ့အခါ ဘယ်လောက်ပဲ အောင်မြင်နေပါစေ စိတ်ထဲမှာတော့ လစ်ဟာနေတတ်ပါတယ်။</p><p>ဒီအချက်ကို သက်သေပြဖို့ ကာစီနိုလောင်းကစားရုံက စလော့စက် (Slot Machine) ဆော့နေသူတွေနဲ့ NFL ဘောလုံးသမား ကာတစ်စ် မာတင် (Curtis Martin) တို့ရဲ့ ကွာခြားချက်ကို နှိုင်းယှဉ်ပြချင်ပါတယ်။ စလော့စက် ဆော့နေသူတွေဟာ စက်ခလုတ်ကို ဆွဲချလိုက်၊ ရလဒ်ကို စောင့်ကြည့်လိုက်နဲ့ "Action" ဆိုတဲ့ ပစ္စုပ္ပန် အခိုက်အတန့်လေးမှာပဲ ပိတ်မိနေကြပါတယ်။ သူတို့မှာ ရေရှည် ရည်မှန်းချက်၊ ရည်ရွယ်ချက် ဘာတစ်ခုမှ မရှိပါဘူး။ ဆန့်ကျင်ဘက်အနေနဲ့ ကာတစ်စ် မာတင် ကတော့ အမေရိကန် ဘောလုံးကစားရတာကို ဝါသနာပါလွန်းလို့ ကစားခဲ့တာ မဟုတ်ပါဘူး။ သူ့ရဲ့ တကယ့် Aspiration က အနာဂတ်မှာ မသန်စွမ်းသူတွေနဲ့ ဆင်းရဲသားတွေကို ကူညီထောက်ပံ့ပေးနိုင်တဲ့ လူတစ်ယောက် ဖြစ်ချင်တာပါ။ အဲဒီ ရည်ရွယ်ချက်ကြီးကို ရောက်ဖို့အတွက် သူဟာ ဘောလုံးကစားခြင်းဆိုတဲ့ (Action နဲ့ Ambition) ကို ရွေးချယ်ပြီး ရုပ်ပိုင်းဆိုင်ရာ နာကျင်မှုတွေ၊ စွန့်စားမှုတွေကို အံတုပြီး ကြိုးစားခဲ့ပါတယ်။ ဒါကြောင့် သူအနားယူတဲ့အခါမှာ သူ့ရဲ့ ဖောင်ဒေးရှင်းကနေတဆင့် သူမျှော်မှန်းထားတဲ့ ဘဝကို ရရှိခဲ့ပါတယ်။</p><p>ဒီအချက်ရဲ့ နက်ရှိုင်းတဲ့ အဓိပ္ပာယ်ကတော့ ကျွန်တော်တို့ လုပ်နေတဲ့ အလုပ်တွေဟာ ပင်ပန်းခက်ခဲနေဦးတော့၊ အဲဒီ လုပ်ရပ်တွေဟာ ကိုယ်ဖြစ်ချင်တဲ့ ရည်ရွယ်ချက်ကြီး (Aspiration) နဲ့ တစ်သားတည်း ကျနေမယ်ဆိုရင် အဲဒီ ပင်ပန်းမှုဟာ နောင်တရစရာ မဖြစ်လာဘဲ တန်ဖိုးရှိတဲ့ အားထုတ်မှု ဖြစ်လာမယ် ဆိုတာပါပဲ။ ကိုယ့်ရဲ့ နေ့စဉ် လုပ်ရပ်တွေ၊ ကာလတို ရည်မှန်းချက်တွေဟာ ကိုယ်တကယ် ဖြစ်ချင်တဲ့ ပုံရိပ်ကြီးဆီကို ဦးတည်နေရဲ့လား ဆိုတာကို အမြဲ ဆန်းစစ်နေဖို့ လိုအပ်ပါတယ်။ ဒါမှသာ အသက်ရှင်ရကျိုးနပ်တဲ့ ဘဝကို နေ့စဉ် တည်ဆောက်နေတာနဲ့ တူမှာ ဖြစ်ပါတယ်။</p><p><b>ရလဒ်ထက် ကြိုးစားအားထုတ်မှုကိုသာ အကဲဖြတ်ခြင်း (The Life Plan Review - LPR)</b></p><p>တတိယမြောက် မှတ်သားစရာ ကတော့ ကျွန်တော်တို့ရဲ့ တိုးတက်မှုကို တိုင်းတာတဲ့ နည်းလမ်းသစ်တစ်ခု ဖြစ်တဲ့ "Life Plan Review (LPR)" ဆိုတဲ့ စနစ်ပဲ ဖြစ်ပါတယ်။ သာမန်အားဖြင့် ကျွန်တော်တို့ဟာ ကိုယ့်ရဲ့ အောင်မြင်မှုကို ရလဒ်တွေနဲ့ပဲ တိုင်းတာလေ့ ရှိကြပါတယ်။ "ပစ်မှတ် ပြည့်ရဲ့လား"၊ "ဝင်ငွေ ဘယ်လောက်ရလဲ" ဆိုတာမျိုးတွေပါ။ ဒါပေမဲ့ ရလဒ်ဆိုတာ ကိုယ်မထိန်းချုပ်နိုင်တဲ့ ပြင်ပ အကြောင်းတရားတွေ အများကြီးအပေါ်မှာ မူတည်နေပါတယ်။ ဒါကြောင့် မာရှယ်လ် ဂိုးစမစ် က ရလဒ်ကို မတိုင်းတာဘဲ ကိုယ့်ရဲ့ "ကြိုးစားအားထုတ်မှု" ကိုသာ တိုင်းတာဖို့ အကြံပြုထားပါတယ်။ သူက မေးခွန်းတွေကို ပြောင်းလဲမေးခိုင်းပါတယ်။ ဥပမာ - "ငါ ပျော်ရွှင်ရဲ့လား" လို့ မေးမယ့်အစား "ငါ ဒီနေ့ ပျော်ရွှင်အောင် အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား (Did I do my best to be happy?)" ဆိုပြီး ကိုယ့်ကိုယ်ကိုယ် ပြန်မေးဖို့ လမ်းညွှန်ထားပါတယ်။</p><p>ဒီစနစ်လေး ဖြစ်ပေါ်လာပုံက ဖို့ဒ် (Ford) မော်တော်ကားကုမ္ပဏီရဲ့ CEO ဟောင်း အလန် မူလာလီ (Alan Mulally) ကျင့်သုံးခဲ့တဲ့ Business Plan Review (BPR) ကနေ ဆင်းသက်လာတာပါ။ အလန်ဟာ ကုမ္ပဏီ အရှုံးပေါ်နေချိန်မှာ အပတ်စဉ် အစည်းအဝေးလုပ်ပြီး အရာရှိတွေကို သူတို့ရဲ့ တိုးတက်မှု အခြေအနေတွေကို ပွင့်ပွင့်လင်းလင်း တင်ပြခိုင်းပါတယ်။ အပြစ်တင်တာမျိုး မလုပ်ဘဲ မှန်ကန်စွာ တင်ပြရဲတဲ့ သတ္တိကို ချီးကျူးခဲ့ပါတယ်။ အဲဒီလို လုံခြုံစိတ်ချရတဲ့ ပတ်ဝန်းကျင် ဖန်တီးပေးပြီး ကြိုးစားအားထုတ်မှုတွေကို အကဲဖြတ်တဲ့ စနစ်ကြောင့် ဖို့ဒ် ကုမ္ပဏီကြီး ပြန်လည် နာလန်ထူလာခဲ့ပါတယ်။ ဒီသဘောတရားကို ယူပြီး မာရှယ်လ် က လူတစ်ဦးချင်းစီအတွက် LPR စနစ်ကို ဖန်တီးခဲ့တာပါ။ ကိုယ့်ရဲ့ နေ့စဉ်ဘဝမှာ အဓိပ္ပာယ်ရှိရှိ နေထိုင်ဖို့၊ ဆက်ဆံရေးတွေ ကောင်းမွန်ဖို့အတွက် အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား ဆိုတာကို (၁) ကနေ (၁၀) အထိ အမှတ်ပေးပြီး အကဲဖြတ်ခိုင်းတာ ဖြစ်ပါတယ်။</p><p>ဒီစနစ်ရဲ့ အကျိုးကျေးဇူးက ဘာလဲဆိုတော့ ကျွန်တော်တို့ကို စိတ်ပျက်အားငယ်မှုကနေ ကယ်တင်ပေးနိုင်တာပါပဲ။ တချို့နေ့တွေမှာ အလုပ်တွေ အဆင်မပြေဖြစ်ပြီး ရလဒ်တွေ ဆိုးရွားနေနိုင်ပါတယ်။ ဒါပေမဲ့ ညအိပ်ရာဝင်ခါနီး ကိုယ့်ကိုယ်ကိုယ် ပြန်သုံးသပ်တဲ့အခါ "ရလဒ်တွေ မကောင်းခဲ့ပေမယ့် ငါ့ဘက်ကတော့ အကောင်းဆုံး ကြိုးစားခဲ့ပါတယ်" လို့ ရိုးရိုးသားသား အဖြေထွက်လာခဲ့ရင် အဲဒီနေ့အတွက် ဘာနောင်တမှ ရစရာ မလိုတော့ပါဘူး။ ကိုယ်ထိန်းချုပ်နိုင်တာက ကိုယ့်ရဲ့ ကြိုးစားအားထုတ်မှုပဲ ဖြစ်လို့၊ အဲဒီ အားထုတ်မှု အပိုင်းမှာ ရာခိုင်နှုန်းပြည့် တာဝန်ကျေခဲ့ရင် အဲဒီဘဝဟာ တန်ဖိုးရှိတဲ့ ဘဝ၊ Earned Life ပဲ ဖြစ်တယ်ဆိုတာကို နက်နက်ရှိုင်းရှိုင်း နားလည်စေပါတယ်။</p>',
  '<h3>အသက်ရှင်ရကျိုးနပ်သော ဘဝဆီသို့ - မာရှယ်လ် ဂိုးစမစ်၏ စာအုပ်မှ အရေးကြီးဆုံး သင်ခန်းစာများကို လေ့လာခြင်း</h3><p>စာအုပ်ထဲကနေ ကျွန်တော်တို့ ရရှိနိုင်တဲ့ ပထမဆုံးနဲ့ အရေးအကြီးဆုံး သင်ခန်းစာတစ်ခုကတော့ ပစ္စုပ္ပန်တည့်တည့်မှာ အသစ်ပြန်လည် မွေးဖွားခြင်း (The Every Breath Paradigm) ဆိုတဲ့ အယူအဆပဲ ဖြစ်ပါတယ်။ ဗုဒ္ဓဘာသာရဲ့ အနိစ္စတရားကို အခြေခံထားတဲ့ ဒီအတွေးအခေါ်က ကျွန်တော်တို့ကို အတိတ်ရဲ့ သံယောဇဉ်ကြိုးတွေကနေ လွတ်မြောက်စေပါတယ်။ ကျွန်တော်တို့ဟာ အရင်က လုပ်ခဲ့ဖူးတဲ့ အမှားတွေ၊ ဆုံးရှုံးမှုတွေအတွက် ကိုယ့်ကိုယ်ကိုယ် အပြစ်တင်ရင်း အချိန်ကုန်တတ်သလို၊ တစ်ခါတလေကျရင်လည်း အတိတ်က အောင်မြင်ခဲ့ဖူးတဲ့ ဂုဏ်ပုဒ်တွေအောက်မှာ သာယာပြီး ရှေ့ဆက်မတိုးနိုင်ဘဲ ဖြစ်နေတတ်ပါတယ်။ ဒါပေမဲ့ မာရှယ်လ် ဂိုးစမစ်က ကျွန်တော်တို့ အသက်ရှူသွင်းလိုက်တိုင်း၊ ထွက်သက်ဝင်သက် တစ်ခု ဖြစ်ပေါ်လာတိုင်းမှာ ကျွန်တော်တို့ဟာ အတိတ်က လူဟောင်း မဟုတ်တော့ဘဲ လူသစ်တစ်ယောက်အနေနဲ့ ပြန်လည်မွေးဖွားနေတယ်လို့ ဆိုပါတယ်။ ဒါကြောင့် လွန်ခဲ့တဲ့ တစ်မိနစ်က လုပ်ခဲ့တဲ့ အမှားဟာ အတိတ်က လူရဲ့ အမှားသာ ဖြစ်ပြီး၊ လက်ရှိ ပစ္စုပ္ပန်မှာ ရောက်နေတဲ့ ကိုယ်ကတော့ အဲဒီအမှားကို သင်ခန်းစာယူပြီး ပိုကောင်းတဲ့ လူသစ်တစ်ယောက်အဖြစ် ချက်ချင်း ပြောင်းလဲခွင့် ရှိနေပါတယ်။</p><p>ဒီအတွေးအခေါ်ကို ပိုပြီး နက်နက်ရှိုင်းရှိုင်း နားလည်နိုင်ဖို့ စာအုပ်ထဲက ဥပမာတစ်ခုကို ပြောပြချင်ပါတယ်။ အလွန်ကို ဒေါသကြီးပြီး အတ္တဆန်တဲ့ အမှုဆောင်အရာရှိချုပ် တစ်ယောက်ဟာ သူ့ရဲ့ အပြုအမူတွေကို ပြုပြင်ဖို့ ဆုံးဖြတ်လိုက်ပါတယ်။ သူဟာ အရင်လို ဒေါသတကြီး မဆက်ဆံတော့ဘဲ အကောင်းဆုံး ပြောင်းလဲနေပေမယ့်၊ သူ့ရဲ့ ဇနီးဖြစ်သူကတော့ လွန်ခဲ့တဲ့ နှစ်တွေတုန်းက သူ့ရဲ့ ဆိုးရွားတဲ့ အပြုအမူတွေကိုပဲ အမြဲတမ်း ပြန်တွေးပြီး ပြဿနာ ရှာနေဆဲပါ။ အဲဒီအခါမှာ သူက "အရင်တုန်းက အဲဒီလို ဆိုးရွားခဲ့တဲ့ လူဟာ အခု ကျွန်တော် မဟုတ်တော့ပါဘူး။ အခု ကျွန်တော်က အကောင်းဆုံး ဖြစ်အောင် ကြိုးစားနေတဲ့ လူသစ်တစ်ယောက်ပါ။ မရှိတော့တဲ့ လူတစ်ယောက်ရဲ့ အမှားတွေအတွက် လက်ရှိ လူသစ်ကို အပြစ်ပေးနေတာဟာ တရားမျှတမှု မရှိပါဘူး" လို့ ရှင်းပြခဲ့ပါတယ်။ ဒီဖြစ်ရပ်က ကျွန်တော်တို့ကို အတိတ်ဆိုတာ ပြီးဆုံးသွားပြီ ဖြစ်ကြောင်းနဲ့၊ ကိုယ့်ကိုယ်ကိုယ်ရော တခြားသူတွေကိုပါ အတိတ်က ပုံရိပ်တွေနဲ့ပဲ အမြဲတမ်း အကဲမဖြတ်ဖို့ သတိပေးနေပါတယ်။ နေ့စဉ်စက္ကန့်တိုင်းမှာ ကိုယ်ဖြစ်ချင်တဲ့ ဘဝကို အသစ်တဖန် ပြန်လည် တည်ဆောက်ခွင့် (Re-earn) ရှိတယ်ဆိုတာကို သိထားရင် ကျွန်တော်တို့ဟာ နောင်တတွေကနေ ကင်းဝေးနိုင်မှာပါ။</p><p>ဒုတိယမြောက် မှတ်သားရမယ့် သင်ခန်းစာကတော့ အနာဂတ်မှာမှ ပျော်ရွှင်မယ်ဆိုတဲ့ ထောင်ချောက် (The Destination Fallacy) ကို ရှောင်ရှားဖို့ပဲ ဖြစ်ပါတယ်။ ကျွန်တော်တို့ အများစုဟာ "ငါ ဒီပရောဂျက်ကြီး ပြီးသွားရင်တော့ အေးအေးဆေးဆေး နားရတော့မှာပါ" သို့မဟုတ် "ငါ မန်နေဂျာ ရာထူးရသွားရင်တော့ ပျော်ရွှင်ရမှာပါ" ဆိုပြီး ပျော်ရွှင်မှုကို အနာဂတ် ကာလတစ်ခုဆီကို အမြဲတမ်း ရွှေ့ဆိုင်းထားတတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ်တမ်း အဲဒီနေရာကို ရောက်သွားတဲ့အခါ နောက်ထပ် ပိုမြင့်တဲ့ ရည်မှန်းချက်တွေ ပေါ်လာပြန်ရောမို့ တကယ့် ပျော်ရွှင်မှုဆိုတာ ဘယ်တော့မှ ဆိုက်ရောက်မလာတဲ့ ရထားကြီး တစ်စင်းလို ဖြစ်နေတတ်ပါတယ်။ "Earned Life" ဆိုတာ တစ်နေ့နေ့ တစ်ချိန်ချိန်ကျမှ ရရှိမယ့် ဆုဖလားကြီး တစ်ခု မဟုတ်ပါဘူး။ အဲဒါဟာ နေ့စဉ်နဲ့အမျှ ကျွန်တော်တို့ ဖြတ်သန်းနေတဲ့ ခရီးစဉ်ကြီး တစ်ခုလုံးကို ဆိုလိုတာပါ။ ဒါကြောင့် ပျော်ရွှင်မှုနဲ့ ပြည့်စုံလုံလောက်မှု ဆိုတာကို အနာဂတ်မှာ သွားရှာနေမယ့်အစား၊ ဒီနေ့ လက်ရှိ လုပ်နေတဲ့ အလုပ်တွေအပေါ်မှာပဲ အဓိပ္ပာယ်ရှိရှိ အာရုံစိုက်ပြီး ခံစားတတ်ဖို့ လိုအပ်ပါတယ်။</p><p>တတိယမြောက် အလွန်အရေးကြီးတဲ့ သင်ခန်းစာကတော့ လုပ်ရပ်၊ ရည်မှန်းချက်နှင့် တန်ဖိုးထားမှုတို့၏ ဟန်ချက်ညီခြင်း (The Triple A Model: Action, Ambition, and Aspiration) ပဲ ဖြစ်ပါတယ်။ နေ့စဉ် ကျွန်တော်တို့ လုပ်နေတဲ့ "Action" တွေ၊ ကာလတို အတွက် သတ်မှတ်ထားတဲ့ "Ambition" (ရည်မှန်းချက်) တွေဟာ ကိုယ်တကယ် ဖြစ်ချင်တဲ့ ပိုမို ကြီးမားတဲ့ "Aspiration" (ဘဝရဲ့ တန်ဖိုးထားမှု သို့မဟုတ် ရည်ရွယ်ချက်ကြီး) နဲ့ တစ်ထပ်တည်း ကျနေဖို့ လိုအပ်ပါတယ်။ ဥပမာအားဖြင့် လောင်းကစားရုံမှာ စက်ခလုတ်ကို နှိပ်ပြီး ဆော့နေသူတွေဟာ လက်ရှိ "Action" မှာပဲ နစ်မြုပ်နေပြီး ဘာရည်မှန်းချက်၊ ဘာရည်ရွယ်ချက်မှ မရှိပါဘူး။ ဒါပေမဲ့ အမေရိကန် နာမည်ကျော် ဘောလုံးသမား ကာတစ်စ် မာတင် (Curtis Martin) ကတော့ သူ့ရဲ့ နေ့စဉ် ပြင်းထန်တဲ့ လေ့ကျင့်မှုတွေ (Action) ကို အနာဂတ်မှာ ဆင်းရဲသားတွေကို ကူညီထောက်ပံ့နိုင်တဲ့ လူတစ်ယောက် ဖြစ်လာမယ်ဆိုတဲ့ ကြီးမားတဲ့ ရည်ရွယ်ချက်ကြီး (Aspiration) အတွက် လုပ်ဆောင်ခဲ့တာပါ။ ဒီသုံးခု ဟန်ချက်ညီသွားတဲ့အခါ ကျွန်တော်တို့ရဲ့ နေ့စဉ် ပင်ပန်းမှုတွေဟာ အဓိပ္ပာယ်ရှိလာပြီး နောင်တရစရာ အကြောင်း မရှိတော့ပါဘူး။</p><p>စတုတ္ထမြောက် သင်ခန်းစာကတော့ ရလဒ်ကို ပစ်ပယ်၍ အားထုတ်မှုကိုသာ တိုင်းတာခြင်း (Measuring Effort over Outcomes via Life Plan Review) ဖြစ်ပါတယ်။ ကျွန်တော်တို့ဟာ များသောအားဖြင့် ရလဒ် (Outcome) တွေကို ကြည့်ပြီး ကိုယ့်ကိုယ်ကိုယ် အကဲဖြတ်တတ်ကြပါတယ်။ ဒါပေမဲ့ ရလဒ်ဆိုတာ ကိုယ်မထိန်းချုပ်နိုင်တဲ့ ပြင်ပ အကြောင်းအရာတွေ (ဥပမာ - စီးပွားရေး အခြေအနေ၊ အခြားသူတွေရဲ့ ဆုံးဖြတ်ချက်) အပေါ်မှာ အများကြီး မူတည်နေပါတယ်။ ဒါကြောင့် မာရှယ်လ်က ကိုယ်ထိန်းချုပ်လို့ရတဲ့ "ကြိုးစားအားထုတ်မှု (Effort)" ကိုသာ တိုင်းတာဖို့ LPR ဆိုတဲ့ စနစ်ကို မိတ်ဆက်ပေးထားပါတယ်။ "ဒီနေ့ ငါ အောင်မြင်ခဲ့ရဲ့လား" လို့ မေးမယ့်အစား "ဒီနေ့ ငါ အဓိပ္ပာယ်ရှိရှိ နေထိုင်ဖို့ အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား (Did I do my best to...)" ဆိုပြီး ကိုယ့်ကိုယ်ကိုယ် ပြန်မေးရမှာပါ။ ဖို့ဒ် (Ford) ကုမ္ပဏီရဲ့ အမှုဆောင်အရာရှိချုပ်ဟောင်း အလန် မူလာလီ (Alan Mulally) ဟာ အရှုံးပေါ်နေတဲ့ ကုမ္ပဏီကြီးကို ဒီလိုမျိုး ရလဒ်ထက် ကြိုးစားအားထုတ်မှုနဲ့ ပွင့်လင်းမြင်သာမှုကို ဦးစားပေးတဲ့ စနစ်နဲ့ ပြန်လည် ကယ်တင်နိုင်ခဲ့ပါတယ်။ ဒီလို ချဉ်းကပ်မှုက ကျွန်တော်တို့ကို စိတ်ဖိစီးမှုတွေကနေ ကင်းဝေးစေပြီး၊ ရလဒ် မကောင်းတဲ့ နေ့တွေမှာတောင် ကိုယ့်ဘက်က အကောင်းဆုံး လုပ်ခဲ့တယ်ဆိုတဲ့ ကျေနပ်မှုကို ရရှိစေပါတယ်။</p><p>ပဉ္စမမြောက် သင်ခန်းစာကတော့ တကိုယ်တော် အောင်မြင်မှုဆိုသော ဒဏ္ဍာရီကို စွန့်လွှတ်ခြင်း (The Myth of the Self-Made Man) ပါပဲ။ ကျွန်တော်တို့ လူ့အဖွဲ့အစည်းမှာ လူတစ်ယောက်ဟာ ဘယ်သူ့အကူအညီမှ မပါဘဲ သူ့ချည်းသက်သက် အောင်မြင်လာတယ်ဆိုတဲ့ အယူအဆကို အမွှမ်းတင်တတ်ကြပါတယ်။ ဒါပေမဲ့ ဒါဟာ လုံးဝ မှားယွင်းပါတယ်။ ကြီးမားတဲ့ အောင်မြင်မှုတိုင်းရဲ့ နောက်ကွယ်မှာ မိသားစု၊ ဆရာသမား၊ လုပ်ဖော်ကိုင်ဖက်တွေရဲ့ ပံ့ပိုးကူညီမှုတွေ အမြဲတမ်း ပါဝင်နေပါတယ်။ ဒါကြောင့် အသက်ရှင်ရကျိုးနပ်တဲ့ ဘဝကို တည်ဆောက်ရာမှာ အကူအညီ တောင်းခံဖို့ ဝန်မလေးသင့်ပါဘူး။ ကိုယ်အားနည်းတဲ့ အချိန်မှာ ကိုယ်ယုံကြည်ရသူတွေကို ရဲရဲဝံ့ဝံ့ အကူအညီတောင်းပါ။ အပြန်အလှန်အားဖြင့် သူတို့ လိုအပ်ချိန်မှာလည်း ကူညီပေးပါ။ ဒီလို အပြန်အလှန် ဖေးမကူညီတတ်တဲ့ အသိုက်အဝန်းလေး တစ်ခု တည်ဆောက်ထားခြင်းဟာ ကျွန်တော်တို့ရဲ့ ဘဝခရီးလမ်းကို ပိုမို ခိုင်မာ အဓိပ္ပာယ်ရှိစေပါတယ်။</p>',
  '<h3>လက်တွေ့ဘဝနှင့် လုပ်ငန်းခွင်တွင် အသုံးချခြင်း</h3><p>ဒီစာအုပ်ထဲက အတွေးအခေါ်တွေကို မနက်ဖြန်ကစပြီး ကျွန်တော်တို့ရဲ့ လက်တွေ့ဘဝနဲ့ လုပ်ငန်းခွင်မှာ ဘယ်လို အသုံးချနိုင်မလဲ ဆိုတာ ဆွေးနွေးကြည့်ရအောင်ပါ။ ပထမဆုံး အနေနဲ့ စိတ်ထား (Mindset) ပြောင်းလဲဖို့ လိုအပ်ပါတယ်။ "Earned Life" ဆိုတာ တစ်နေ့နေ့ တစ်ချိန်ချိန်ကျမှ ရောက်ရှိသွားမယ့် ပန်းတိုင်ကြီးတစ်ခု မဟုတ်ပါဘူး။ နေ့စဉ်နေ့တိုင်း၊ ထွက်သက်ဝင်သက်တိုင်းမှာ တည်ဆောက်သွားရမယ့် အလေ့အကျင့် (Habit) တစ်ခုဆိုတာ သတိထားရပါမယ်။ မနက်အိပ်ရာနိုးတာနဲ့ "ဒီနေ့ ငါ ဘယ်လိုလူမျိုး ဖြစ်အောင် နေထိုင်မလဲ" ဆိုတာကို ဆုံးဖြတ်ချက်ချပြီး အဲဒီဆုံးဖြတ်ချက်နဲ့ ကိုက်ညီအောင် နေထိုင်ဖို့ လိုအပ်ပါတယ်။</p><p>ဒုတိယအနေနဲ့ ခေါင်းဆောင်မှု (Leadership) နဲ့ စွမ်းဆောင်ရည် မြှင့်တင်ရေး အပိုင်းမှာ LPR စနစ်ကို အသုံးချနိုင်ပါတယ်။ မိတ်ဆွေဟာ အဖွဲ့အစည်းတစ်ခုရဲ့ ခေါင်းဆောင်ဆိုရင် ကိုယ့်အဖွဲ့သားတွေကို KPI ရလဒ်တွေချည်းပဲ ဖိအားပေးနေမယ့်အစား၊ သူတို့ရဲ့ ကြိုးစားအားထုတ်မှုကို အသိအမှတ်ပြုပေးတဲ့ ယဉ်ကျေးမှုတစ်ရပ်ကို တည်ဆောက်ပါ။ အပတ်စဉ် အစည်းအဝေးတွေမှာ ကိုယ့်အဖွဲ့သားတွေအနေနဲ့ အမှားတွေကို ရဲရဲဝံ့ဝံ့ တင်ပြရဲတဲ့ လုံခြုံတဲ့ ပတ်ဝန်းကျင် (Safe Space) ဖန်တီးပေးပါ။ ဒါ့အပြင် လုပ်ငန်းခွင် ဆက်ဆံရေးမှာ "Singular Empathy" လို့ခေါ်တဲ့ အပြည့်အဝ အာရုံစိုက် နားလည်ပေးမှုမျိုးကို ကျင့်သုံးပါ။ ကိုယ့်ရဲ့ ဝန်ထမ်း သို့မဟုတ် လုပ်ဖော်ကိုင်ဖက် တစ်ယောက်နဲ့ စကားပြောနေချိန်မှာ ဖုန်းကို ကြည့်နေတာမျိုး မလုပ်ဘဲ သူ့ကိုပဲ ရာခိုင်နှုန်းပြည့် အာရုံစိုက်ပြီး နားထောင်ပေးပါ။ ဒီလို သေးငယ်ပေမယ့် အားကောင်းတဲ့ အပြုအမူတွေကနေတဆင့် ယုံကြည်မှုနဲ့ လေးစားမှုကို အခိုင်အမာ တည်ဆောက်နိုင်ပါတယ်။</p><p>တတိယ အချက်ကတော့ အကူအညီတောင်းဖို့ ဝန်မလေးပါနဲ့ ဆိုတာပါပဲ။ ကျွန်တော်တို့ လူ့အဖွဲ့အစည်းမှာ ကိုယ့်ခြေထောက်ပေါ် ကိုယ်ရပ်တည်ပြီး ဘယ်သူ့အကူအညီမှ မပါဘဲ အောင်မြင်လာတယ် ဆိုတဲ့ (Self-made) ဒဏ္ဍာရီကို ယုံကြည်နေတတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ့်လက်တွေ့မှာတော့ ကြီးမားတဲ့ အောင်မြင်မှုတိုင်းရဲ့ နောက်ကွယ်မှာ အခြားသူတွေရဲ့ ကူညီပံ့ပိုးမှုတွေ အမြဲတမ်း ပါဝင်နေပါတယ်။ ဒါကြောင့် အကူအညီတောင်းတာဟာ အားနည်းချက် မဟုတ်ဘူး ဆိုတာကို နားလည်လက်ခံပါ။ ကိုယ့်ရဲ့ ရည်မှန်းချက်တွေကို အကောင်အထည်ဖော်ဖို့အတွက် ကိုယ်ယုံကြည်ရတဲ့ လုပ်ဖော်ကိုင်ဖက်တွေ၊ နည်းပြ (Mentor) တွေ၊ မိတ်ဆွေတွေနဲ့ ဖွဲ့စည်းထားတဲ့ ကိုယ်ပိုင် Support Group သေးသေးလေး တစ်ခု တည်ဆောက်ပါ။ ကိုယ်အားနည်းတဲ့ အချိန်မှာ သူတို့ကို ရဲရဲဝံ့ဝံ့ အကူအညီတောင်းပါ။ အပြန်အလှန်အားဖြင့် သူတို့ လိုအပ်ချိန်မှာလည်း ကူညီပေးပါ။ ဒီလို အပြန်အလှန် ပံ့ပိုးပေးတဲ့ အသိုက်အဝန်းလေး တစ်ခု ရှိနေခြင်းက နောင်တကင်းမဲ့တဲ့ ဘဝခရီးလမ်းကို လျှောက်လှမ်းရာမှာ အကြီးမားဆုံး ခွန်အား တစ်ရပ် ဖြစ်လာပါလိမ့်မယ်။</p>',
  '<h3>နိဂုံးနှင့် ရှေ့ဆက်ရန် အကြံပြုချက်</h3><p>အချုပ်အားဖြင့် ဆိုရရင် "The Earned Life" ဆိုတာ ဆုဖလားကြီး တစ်ခုရဖို့ ပြိုင်ပွဲဝင်နေတာ မဟုတ်ပါဘူး။ ကိုယ်ရွေးချယ်ထားတဲ့ လမ်းကြောင်းပေါ်မှာ မှန်မှန်ကန်ကန်နဲ့ နေ့စဉ် ကြိုးစားအားထုတ်နေတဲ့ ဖြစ်စဉ်ကြီး တစ်ခုလုံးကို ဆိုလိုတာပါ။ ကျွန်တော်တို့ဟာ ဒီခရီးစဉ်ကြီးထဲမှာ လျှောက်လှမ်းနေရင်းနဲ့ အောင်မြင်မှုတွေ၊ ကျရှုံးမှုတွေ၊ နာကျင်မှုတွေနဲ့ ပျော်ရွှင်မှုတွေကို ကြုံတွေ့ရမှာ သေချာပါတယ်။ ဒါပေမဲ့ အရေးအကြီးဆုံးကတော့ ကိုယ့်ရဲ့ လုပ်ရပ်တွေဟာ ကိုယ်တကယ် ယုံကြည်တန်ဖိုးထားတဲ့ အရာတွေနဲ့ ထပ်တူကျနေဖို့ပဲ ဖြစ်ပါတယ်။</p><p>ပီတာ ဒရက်ကာ (Peter Drucker) ပြောခဲ့သလိုပဲ "ကျွန်တော်တို့ ဘဝရဲ့ တာဝန်ဟာ ကိုယ်ဘယ်လောက် တော်ကြောင်း၊ ဘယ်လောက် မှန်ကြောင်း သက်သေပြဖို့ မဟုတ်ပါဘူး၊ လောကကြီးကို ကောင်းမွန်တဲ့ ပြောင်းလဲမှုလေးတွေ ယူဆောင်လာပေးဖို့ပဲ" ဖြစ်ပါတယ်။ ကျွန်တော်တို့ရဲ့ အချိန်တွေဟာ အကန့်အသတ် ရှိပါတယ်။ မွေးဖွားလာမယ်၊ ဖျားနာမယ်၊ သေဆုံးသွားကြရပါမယ်။ ဒီလို တိုတောင်းလှတဲ့ အချိန်လေး အတွင်းမှာ သူတစ်ပါးရဲ့ မျှော်လင့်ချက်တွေ၊ သူတစ်ပါး သတ်မှတ်ထားတဲ့ အောင်မြင်မှု စံနှုန်းတွေနောက်ကို လိုက်ရင်း ကိုယ့်ဘဝကို အလဟဿ မဖြုန်းတီးပစ်လိုက်ပါနဲ့။ ထွက်သက်ဝင်သက်တိုင်းဟာ အခွင့်အရေးသစ် တစ်ခု ဖြစ်တယ်ဆိုတာကို နှလုံးသွင်းပြီး၊ မိတ်ဆွေတို့ရဲ့ နေ့စဉ်လုပ်ရပ်တွေကနေတဆင့် ကိုယ်ချစ်တဲ့ သူတွေ၊ ကိုယ့်ရဲ့ ပတ်ဝန်းကျင်အတွက် အပြုသဘောဆောင်တဲ့ ပြောင်းလဲမှုလေးတွေ ဖန်တီးပေးနိုင်အောင် ကြိုးစားရင်း နောင်တကင်းမဲ့တဲ့ "အသက်ရှင်ရကျိုးနပ်သော ဘဝ" ကို ပိုင်ဆိုင်နိုင်ကြပါစေလို့ ဆန္ဒပြု တိုက်တွန်းလိုက်ရပါတယ်။</p>'
]
            },
            "Do This Before Bed": {
                title: "Do This Before Bed",
                author: "Oliver Nino",
                description: "Oliver Niño ရေးသားထားသော **Do This Before Bed** စာအုပ်သည် အိပ်ရာမဝင်မီ ငါးမိနစ်ခန့် အချိန်ပေးရုံဖြင့် ဘဝကို ပြောင်းလဲစေနိုင်သည့် **စွမ်းအင်ဆိုင်ရာ ကျင့်စဉ်များကို** အဓိက ဖော်ပြထားပါသည်။ စာရေးသူသည် မိမိ၏ ကိုယ်ပိုင် အတွေ့အကြုံများနှင့် သိပ္ပံနည်းကျ အချက်အလက်များကို အခြေခံ၍ **မသိစိတ် (Subconscious Mind)** ကို အပြုသဘောဆောင်သော အတွေးများဖြင့် မည်သို့ ပုံဖော်ရမည်ကို လမ်းညွှန်ပေးထားသည်။ ဤစာအုပ်တွင် စိတ်ဖိစီးမှု လျှော့ချရန်၊ အိပ်စက်ခြင်း အရည်အသွေး မြှင့်တင်ရန်နှင့် မိမိ၏ ရည်မှန်းချက်များကို ဖော်ဆောင်ရန်အတွက် **အခြေခံ ကျင့်စဉ်လေးမျိုးနှင့်** ကဏ္ဍအလိုက် လက်တွေ့လုပ်ဆောင်ချက်များကို တင်ပြထားပါသည်။ အထူးသဖြင့် အိပ်ရာမဝင်မီ အချိန်ပိုင်းအတွင်း စိတ်လှုပ်ရှားမှုနှင့် စွမ်းအင်များကို **သန့်စင်ပေးခြင်းဖြင့်** ပိုမိုပျော်ရွှင်၍ အဓိပ္ပာယ်ရှိသော နေ့ရက်များကို ပိုင်ဆိုင်နိုင်မည်ဖြစ်ကြောင်း အလေးပေး ရေးသားထားပါသည်။ အနှစ်ချုပ်အားဖြင့် ဤရင်းမြစ်သည် စာဖတ်သူများအား မိမိတို့၏ **အတွင်းစိတ် စွမ်းအားကို** အသုံးချ၍ ဘဝသစ် တစ်ခုကို တည်ဆောက်နိုင်စေရန် ရည်ရွယ်ထားခြင်း ဖြစ်ပါသည်။",
                cover: "/bookcovers/do-this-before-bed.jpg",

                summaryHeading: "<h2>အိပ်ရာမဝင်ခင် လုပ်ဆောင်ရမည့် စွမ်းအင်သန့်စင်ခြင်း အနုပညာ (The Art of Energy Cleansing Before Bed)</h2>",
                summaryParagraphs: [
  '<h3>မိတ်ဆက်နှင့် အဓိကပြဿနာ</h3><p>မိတ်ဆွေတို့အနေနဲ့ မနက်ခင်းတိုင်းမှာ ဘယ်လိုစိတ်ခံစားချက်မျိုးနဲ့ နိုးထလေ့ရှိပါသလဲဆိုတာကို ခဏလောက် ပြန်လည်စဉ်းစားကြည့်စေချင်ပါတယ်။ မနက်လင်းတာနဲ့ တစ်ပြိုင်နက် လန်းဆန်းတက်ကြွစွာနဲ့ နေ့သစ်တစ်နေ့ကို စတင်ဖို့ အဆင်သင့်ဖြစ်နေပါသလား။ ဒါမှမဟုတ်ရင်တော့ နှိုးစက်သံကို အကြိမ်ကြိမ်ပိတ်ပြီး အိပ်ရာထဲကနေ မနည်းရုန်းထကာ ကော်ဖီပြင်းပြင်းတစ်ခွက်ကို အသည်းအသန် ရှာဖွေရတဲ့အထိ စိတ်ဖိစီးနေတတ်ပါသလား။ ကျွန်တော်တို့လို အလုပ်ခွင်မှာ နေ့စဉ်နဲ့အမျှ ရုန်းကန်လှုပ်ရှားနေရတဲ့ ပညာရှင်တွေ၊ ဝန်ထမ်းတွေနဲ့ စီးပွားရေးလုပ်ငန်းရှင်တွေအတွက် ညဘက်အိပ်မပျော်ခြင်း၊ မနက်နိုးလာတဲ့အခါမှာလည်း စွမ်းအင်တွေ ကုန်ခမ်းနေခြင်းဆိုတဲ့ ပြဿနာဟာ အလွန်ကို ကြီးမားလှပါတယ်။ တစ်နေ့တာလုံး ကြုံတွေ့ခဲ့ရတဲ့ အခက်အခဲတွေ၊ အခြားသူတွေဆီကနေ ကူးစက်လာတဲ့ အနုတ်လက္ခဏာဆောင်တဲ့ စိတ်ခံစားမှုတွေကို ကျွန်တော်တို့ဟာ မသိမသာနဲ့ အိပ်ရာထဲအထိ သယ်ဆောင်သွားလေ့ရှိကြပါတယ်။ ဒီလို စွမ်းအင်အညစ်အကြေးတွေကို မသန့်စင်ဘဲ အိပ်စက်ခြင်းဟာ ကျွန်တော်တို့ရဲ့ နောက်ထပ်နေ့သစ်တွေကိုပါ ကြီးမားစွာ ထိခိုက်စေနိုင်ပါတယ်။</p><p>ဒီပြဿနာကို ဖြေရှင်းဖို့အတွက် စွမ်းအင်ကုထုံးပညာရှင်တစ်ဦးဖြစ်တဲ့ အိုလီဗာ နီညို (Oliver Niño) က သူရဲ့ အတွေ့အကြုံ နှစ်ပေါင်း ၂၀ ကျော်ကနေ ရရှိလာတဲ့ အသိပညာတွေကို စုစည်းပြီး <b>Do This Before Bed</b> ဆိုတဲ့ စာအုပ်မှာ အသေးစိတ် ရေးသားဖော်ပြထားပါတယ်။ အိုလီဗာဟာ လူပေါင်း နှစ်သန်းနီးပါးကို စွမ်းအင်သန့်စင်ခြင်းနည်းလမ်းတွေ သင်ကြားပေးခဲ့သူဖြစ်ပြီး၊ သူရဲ့ အဓိကအဆိုပြုချက်ကတော့ အိပ်ရာမဝင်ခင် ငါးမိနစ်အချိန်လေးဟာ ကျွန်တော်တို့ရဲ့ ဘဝတစ်ခုလုံးကို ပြောင်းလဲပေးနိုင်လောက်တဲ့အထိ အစွမ်းထက်တယ်ဆိုတဲ့ အချက်ပဲ ဖြစ်ပါတယ်။ အထူးသဖြင့် ညဘက်အိပ်ပျော်ခါစ အချိန်လေးဟာ ကျွန်တော်တို့ရဲ့ မသိစိတ် (Subconscious mind) ကို အလွယ်တကူ ဝင်ရောက်နိုင်တဲ့ အချိန်ဖြစ်ပြီး၊ အဲ့ဒီအချိန်မှာ မှန်ကန်တဲ့ စွမ်းအင်တွေကို ထည့်သွင်းပေးနိုင်မယ်ဆိုရင် ကျွန်တော်တို့ လိုလားတောင့်တတဲ့ အောင်မြင်မှု၊ ပျော်ရွှင်မှုနဲ့ ကျန်းမာရေးကောင်းမွန်မှုတွေကို အလွယ်တကူ ဖန်တီးယူနိုင်မှာ ဖြစ်ပါတယ်။ ဒီစာအုပ်ဟာ စိတ်ကူးယဉ်ဆန်ဆန် ပြောဆိုထားတာမျိုး မဟုတ်ဘဲ လက်တွေ့ကျကျ အသုံးချနိုင်တဲ့ အလေ့အကျင့်ကောင်းတွေကို လမ်းညွှန်ပေးထားတာဖြစ်လို့ မိတ်ဆွေတို့ရဲ့ နေ့စဉ်ဘဝမှာ မရှိမဖြစ် လိုအပ်တဲ့ စွမ်းအင်မြှင့်တင်ရေး လက်စွဲစာအုပ်တစ်ခုလို့ ဆိုရမှာပါ။</p>',
  '<h3>စာအုပ်၏ အနှစ်သာရနှင့် အတွေးအခေါ်များ</h3><p><b>ပထမဆုံး အဓိကအချက်အနေနဲ့ အခြေခံ စွမ်းအင်သန့်စင်ခြင်း (Foundational Energy Hygiene) အကြောင်းကို ဆွေးနွေးချင်ပါတယ်။</b> အိုလီဗာက အိပ်ရာမဝင်ခင်တိုင်း မဖြစ်မနေ လုပ်ဆောင်သင့်တဲ့ အခြေခံအဆင့် လေးဆင့်ကို ချပြထားပါတယ်။ ပထမအဆင့်ကတော့ တစ်နေ့တာလုံး မြင်တွေ့ကြားသိခဲ့ရတဲ့ အညစ်အကြေးတွေကို တတိယမျက်လုံး (Third eye)၊ နားနဲ့ နှလုံးသားကနေတစ်ဆင့် ဖယ်ရှားပစ်ခြင်းပဲ ဖြစ်ပါတယ်။ အဖြူရောင်အလင်းတန်းကြီးက ကိုယ်ခန္ဓာထဲကို ဝင်ရောက်လာပြီး အနုတ်လက္ခဏာစွမ်းအင်တွေကို ဆေးကြောပစ်လိုက်တယ်လို့ စိတ်ကူးပုံဖော်ရမှာပါ။ ဒုတိယအဆင့်ကတော့ ကျေးဇူးတင်စရာကိစ္စတွေ၊ ဒီနေ့ အကောင်းဆုံးလုပ်နိုင်ခဲ့တဲ့ အရာတွေနဲ့ မနက်ဖြန်မှာ ဖန်တီးချင်တဲ့ အတွေ့အကြုံတွေကို မေးခွန်းသုံးခုအနေနဲ့ ကိုယ့်ကိုယ်ကိုယ် ပြန်လည်မေးခွန်းထုတ်ခြင်း ဖြစ်ပါတယ်။ တတိယအဆင့်ကတော့ ကြုံတွေ့ခဲ့ရတဲ့ အခက်အခဲတွေရဲ့ နောက်ကွယ်က ပိုမိုမြင့်မားတဲ့ ရည်ရွယ်ချက်ကို ရှာဖွေခြင်းဖြစ်ပြီး၊ နောက်ဆုံးအဆင့်ကတော့ အရာအားလုံး ပြည့်စုံနေတဲ့ ကိုယ့်ရဲ့ အမြင့်မားဆုံးသော ဗားရှင်း (Highest self) နဲ့ ချိတ်ဆက်ခြင်းပဲ ဖြစ်ပါတယ်။</p><p>ဒီအချက်ကို ပိုပြီးရှင်းလင်းသွားအောင် စာအုပ်ထဲက ရှန်နွန် (Shannon) ဆိုတဲ့ ကျောင်းသူလေးရဲ့ ဇာတ်လမ်းကို မျှဝေပေးချင်ပါတယ်။ ရှန်နွန်ဟာ အစပထမပိုင်းမှာ သူမရဲ့ ရည်းစားဟောင်းကို ပြန်လည်ရရှိချင်တဲ့ ဆန္ဒနဲ့ ဆွဲငင်ခြင်းနိယာမ (Manifestation) ကို အသုံးပြုခဲ့ပါတယ်။ ဒါပေမယ့် သူမရဲ့ စိတ်ခံစားချက်ဟာ မိမိကိုယ်ကို တန်ဖိုးမထားခြင်း၊ ကြောက်ရွံ့ခြင်းဆိုတဲ့ တုန်ခါမှုအနိမ့်ပိုင်း (Low vibration) မှာ ရှိနေခဲ့တဲ့အတွက် ရည်းစားဟောင်းပြန်ရောက်လာပေမယ့်လည်း သစ္စာဖောက်ခံရပြီး ပိုမိုဆိုးရွားတဲ့ နာကျင်မှုတွေနဲ့ပဲ အဆုံးသတ်ခဲ့ရပါတယ်။ အဲ့ဒီနောက်မှာတော့ ရှန်နွန်ဟာ အခြေခံ စွမ်းအင်သန့်စင်ခြင်း အလေ့အကျင့်တွေကို စတင်လုပ်ဆောင်ခဲ့ပြီး သူမရဲ့ စိတ်ပိုင်းဆိုင်ရာ တုန်ခါမှုကို မြှင့်တင်ခဲ့ပါတယ်။ ရလဒ်အနေနဲ့ သူမဟာ ယုံကြည်မှုအပြည့်နဲ့ တောက်ပလာပြီး မကြာခင်မှာပဲ ယောဂအတန်းမှာ သိခဲ့ဖူးတဲ့ အမျိုးသားတစ်ဦးနဲ့ ချိတ်ဆက်မိကာ သူမတကယ် လိုလားတောင့်တခဲ့တဲ့ နက်ရှိုင်းပြီး ရိုးသားတဲ့ အချစ်စစ်ကို ပိုင်ဆိုင်နိုင်ခဲ့ပါတယ်။</p><p>ဒီဇာတ်လမ်းလေးကနေ ကျွန်တော်တို့ သိနိုင်တာကတော့ မိမိလိုချင်တဲ့ အရာတွေကို ယူငင်တဲ့အခါမှာ ကြောက်ရွံ့မှုနဲ့ လိုအပ်ချက်တွေကနေ လားတာမျိုးမဟုတ်ဘဲ၊ ပြည့်စုံကြွယ်ဝမှုနဲ့ ကျေးဇူးတင်တတ်တဲ့ စိတ်ကနေ အစပြုမှသာလျှင် ရေရှည်တည်တံ့တဲ့ အောင်မြင်မှုကို ရရှိနိုင်မယ်ဆိုတဲ့ နက်ရှိုင်းတဲ့ သဘောတရားပဲ ဖြစ်ပါတယ်။ <b>ဒုတိယ အဓိကအချက်ကတော့ နယ်နိမိတ်သတ်မှတ်ခြင်းနှင့် စွမ်းအင်ကာကွယ်ခြင်း (Boundaries and Energy Protection) ဖြစ်ပါတယ်။</b> ကျွန်တော်တို့ တော်တော်များများဟာ အခြားသူတွေကို ငြင်းဆန်ဖို့ ဝန်လေးတတ်ကြပြီး အမြဲတမ်း အလျှော့ပေးလိုက်လျောတတ်ကြပါတယ်။ အိုလီဗာက နယ်နိမိတ်သတ်မှတ်တယ်ဆိုတာ တင်းကျပ်တဲ့ တံတိုင်းကြီးတွေ တည်ဆောက်တာမဟုတ်ဘဲ ကိုယ့်ရဲ့ စွမ်းအင်နဲ့ အချိန်ကို မှန်ကန်စွာ စီမံခန့်ခွဲတာဖြစ်တယ်လို့ ရှင်းပြထားပါတယ်။ ရုပ်ပိုင်းဆိုင်ရာ၊ အချိန်ပိုင်းဆိုင်ရာ၊ စကားလုံးပိုင်းဆိုင်ရာနဲ့ စွမ်းအင်ပိုင်းဆိုင်ရာ ဆိုပြီး နယ်နိမိတ် အမျိုးမျိုး ရှိပါတယ်။ ကာလီ (Carly) ဆိုတဲ့ အမျိုးသမီးတစ်ဦးရဲ့ အဖြစ်အပျက်ကို ကြည့်မယ်ဆိုရင်၊ သူမဟာ အလုပ်မှာကော အိမ်မှာပါ အမြဲတမ်း \'Yes\' လို့ချည်းပဲ ပြောခဲ့တဲ့အတွက် နောက်ဆုံးမှာ ပြင်းထန်တဲ့ စိတ်ဖိစီးမှုနဲ့ ကျန်းမာရေးပြဿနာတွေကို ရင်ဆိုင်ခဲ့ရပါတယ်။ သူမဟာ အိုလီဗာဆီကနေ "Yes, and..." (ဟုတ်ကဲ့၊ ဒါပေမယ့်...) ဆိုတဲ့ နည်းလမ်းကို သင်ယူခဲ့ပြီးနောက်မှာတော့ အခြားသူတွေကို မထိခိုက်စေဘဲ ကိုယ့်ရဲ့ လိုအပ်ချက်တွေကိုပါ ထည့်သွင်းတောင်းဆိုတတ်လာပါတယ်။ အရေးကြီးတဲ့ အစည်းအဝေးတွေ၊ စိတ်ဖိစီးစရာကောင်းတဲ့ ပတ်ဝန်းကျင်တွေကို မသွားခင်မှာ မိမိကိုယ်ကို အဖြူရောင် အလင်းပူဖောင်းလေးနဲ့ ကာကွယ်ထားတယ်လို့ စိတ်ကူးယဉ်ခြင်းဟာလည်း အခြားသူတွေရဲ့ အနုတ်လက္ခဏာ စွမ်းအင်တွေ ကိုယ့်ဆီ ကူးစက်မလာအောင် တားဆီးပေးနိုင်တဲ့ အကောင်းဆုံး နည်းလမ်းတစ်ခု ဖြစ်ပါတယ်။</p><p><b>တတိယ အဓိကအချက်အနေနဲ့ ကုစားခြင်းနှင့် ဘဝရည်ရွယ်ချက် (Healing and Purpose) အကြောင်းကို ပြောပြချင်ပါတယ်။</b> အတိတ်က ရရှိခဲ့တဲ့ နာကျင်မှုတွေ၊ စိတ်ဒဏ်ရာတွေကို အပြည့်အဝ မကုစားနိုင်သရွေ့ ကျွန်တော်တို့ဟာ ရှေ့ဆက်လှမ်းဖို့ ခက်ခဲနေမှာပါပဲ။ မက်တ် (Matt) ဆိုတဲ့ အမျိုးသားတစ်ဦးဟာ ကင်ဆာရောဂါကြောင့် နောက်ထပ် နှစ်နှစ်ပဲ အသက်ရှင်ရတော့မယ်လို့ ဆရာဝန်တွေက သတ်မှတ်ခြင်း ခံခဲ့ရပါတယ်။ သူဟာ ကလေးဘဝတည်းက မိဘတွေနဲ့ အဆင်မပြေခဲ့ဘဲ ကြီးမားတဲ့ စိတ်ဒဏ်ရာတွေကို သယ်ဆောင်လာခဲ့သူပါ။ အိုလီဗာနဲ့ တွေ့ဆုံပြီးနောက်မှာတော့ မက်တ်ဟာ ခွင့်လွှတ်ဖို့ဆိုတာထက်စာရင် အဲ့ဒီနာကျင်မှု စွမ်းအင်တွေကို မိမိခန္ဓာကိုယ်ထဲကနေ ထုတ်လွှတ်ပစ်ဖို့ကို အာရုံစိုက်ခဲ့ပါတယ်။ အံ့သြစရာကောင်းတာကတော့ သူရဲ့ အတိတ်က နာကျင်မှုတွေကို ရင်ဆိုင်ကုစားနိုင်ခဲ့တဲ့အခါမှာ မိဘတွေနဲ့ ပြန်လည်သင့်မြတ်သွားခဲ့ရုံသာမက၊ မျိုးရိုးစဉ်ဆက် ဆင်းသက်လာတဲ့ စိတ်ဒဏ်ရာတွေကိုပါ ဖြတ်တောက်နိုင်ခဲ့ပြီး သူရဲ့ ကင်ဆာရောဂါဟာလည်း အံ့ဖွယ်နည်းနဲ့ ပျောက်ကင်းသွားခဲ့ပါတယ်။ ဒီအဖြစ်အပျက်က သက်သေပြနေတာကတော့ ဘဝရဲ့ ရည်ရွယ်ချက်ဆိုတာ အပြင်ဘက်မှာ လိုက်လံရှာဖွေရမယ့် အရာတစ်ခုမဟုတ်ဘဲ၊ မိမိရဲ့ အတွင်းစိတ်က နာကျင်မှုတွေကို ကုစားပြီး စစ်မှန်တဲ့ ကိုယ်ပိုင်အနှစ်သာရ (Core essence) နဲ့ ပြန်လည်ချိတ်ဆက်မိတဲ့အခါ သဘာဝအလျောက် ပေါ်ထွက်လာတဲ့ အရာဖြစ်တယ်ဆိုတာပါပဲ။ မိမိကိုယ်ကို ကုစားနိုင်ခြင်းဟာ အခြားသူတွေကို ကူညီပေးနိုင်မယ့် အကြီးမားဆုံးသော ဘဝရည်ရွယ်ချက်ဆီကို လမ်းပြပေးနေတာ ဖြစ်ပါတယ်။</p>',
  '<h3>အိပ်ရာမဝင်ခင် လုပ်ဆောင်ရမည့် အဓိက အချက် ၅ ချက် (5 Key Takeaways from Do This Before Bed)</h3><p>ပထမဦးဆုံး အဓိကအချက်အနေနဲ့ အိပ်ရာမဝင်ခင် အချိန်လေးဟာ မသိစိတ် (Subconscious Mind) ကို ပြန်လည် ပရိုဂရမ်လုပ်ဖို့ အကောင်းဆုံးအချိန် ဖြစ်တယ်ဆိုတဲ့ အချက်ကို ဆွေးနွေးချင်ပါတယ်။ ကျွန်တော်တို့ရဲ့ ဦးနှောက်လုပ်ဆောင်ချက်တွေထဲမှာ ၅ ရာခိုင်နှုန်းကသာ သိစိတ် (Conscious mind) နဲ့ သက်ဆိုင်ပြီး၊ ကျန်တဲ့ ၉၅ ရာခိုင်နှုန်းကတော့ မသိစိတ်ရဲ့ အလိုအလျောက် လုပ်ဆောင်မှုတွေ ဖြစ်ကြပါတယ်။ သိစိတ်ဆိုတာက ဆန်းစစ်လေ့လာတာတွေ၊ ဆုံးဖြတ်ချက်ချတာတွေနဲ့ အတိတ်က မှတ်ဉာဏ်တွေကို စွဲလမ်းနေတတ်တဲ့ အတ္တ (Ego) နေရာဖြစ်ပြီး၊ မသိစိတ်ကတော့ ကျွန်တော်တို့ရဲ့ ဘဝအတွေ့အကြုံ အားလုံးကို သိမ်းဆည်းထားတဲ့ နေရာကြီးတစ်ခုပါ။ အိပ်ရာမဝင်ခင် အိပ်ပျော်ခါစ အချိန်လေး (Hypnagogic state) မှာ ကျွန်တော်တို့ရဲ့ ဦးနှောက်လှိုင်းတွေဟာ နှေးကွေးသွားပြီး၊ အမြဲတမ်း ဆင်ခြေပေးတတ်တဲ့ သိစိတ်ကို ကျော်လွန်ကာ မသိစိတ်ထဲကို တိုက်ရိုက် ဝင်ရောက်နိုင်ပါတယ်။ ပြင်သစ် စိတ်ပညာရှင် Émile Coué ဆိုရင် သူရဲ့ စိတ်ကျရောဂါသည်တွေကို အိပ်ရာမဝင်ခင် "နေ့စဉ်နဲ့အမျှ ငါဟာ နေရာတိုင်းမှာ ပိုပိုပြီး ကောင်းမွန်လာနေပြီ" လို့ အထပ်ထပ် ရွတ်ဆိုခိုင်းခဲ့ပါတယ်။ ဒီလို အပြုသဘောဆောင်တဲ့ စကားလုံးတွေကနေတစ်ဆင့် မသိစိတ်ကို ပြန်လည်မွမ်းမံပေးတဲ့အခါမှာ လူနာတွေရဲ့ ရုပ်ပိုင်းဆိုင်ရာနဲ့ စိတ်ပိုင်းဆိုင်ရာ ကျန်းမာရေးတွေ သိသိသာသာ တိုးတက်လာတာကို တွေ့ရှိခဲ့ရပါတယ်။ ဒါကြောင့် အိပ်ရာမဝင်ခင် အချိန်လေးကို ကောင်းမွန်တဲ့ ရည်ရွယ်ချက်တွေ သတ်မှတ်ဖို့ အသုံးပြုခြင်းဟာ အလွန်ကို အစွမ်းထက်ပါတယ်။</p><p>ဒုတိယမြောက် မှတ်သားစရာကတော့ အခြေခံ စွမ်းအင်သန့်စင်ခြင်း (Foundational Energy Hygiene) ရဲ့ အရေးပါမှုပဲ ဖြစ်ပါတယ်။ ကျွန်တော်တို့ဟာ တစ်နေ့တာလုံး ကြုံတွေ့ခဲ့ရတဲ့ အညစ်အကြေးတွေကို ညဘက်မှာ မသန့်စင်ဘဲ အိပ်ရာထဲ ယူသွားမယ်ဆိုရင် အိပ်မက်ဆိုးတွေ မက်တာ၊ မနက်နိုးလာရင် ပင်ပန်းနွမ်းနယ်နေတာတွေ ဖြစ်တတ်ပါတယ်။ ဒါကြောင့် အိုလီဗာက အခြေခံ အလေ့အကျင့် လေးခုကို ညစဉ် လုပ်ဆောင်ဖို့ တိုက်တွန်းထားပါတယ်။ ပထမကတော့ တစ်နေ့တာရဲ့ အညစ်အကြေးတွေကို မိမိရဲ့ တတိယမျက်လုံး (Third eye)၊ နားနဲ့ နှလုံးသား စွမ်းအင်ဗဟိုချက်တွေကနေ ဖယ်ရှားပစ်ဖို့ပါ။ ဒုတိယကတော့ မိမိကျေးဇူးတင်တဲ့ အရာတွေ၊ ဒီနေ့ အကောင်းဆုံး လုပ်နိုင်ခဲ့တာတွေနဲ့ ဖန်တီးချင်တဲ့ အနာဂတ်အကြောင်း မေးခွန်းသုံးခု မေးပြီး ကိုယ့်ရဲ့ တုန်ခါမှု (Vibration) ကို မြှင့်တင်ဖို့ပါ။ တတိယကတော့ အဆင်မပြေမှုတွေ ကြုံရတဲ့အခါ ဒါဟာ ဘယ်လို ပိုမိုမြင့်မားတဲ့ ရည်ရွယ်ချက်အတွက် ဖြစ်လာရတာလဲ ဆိုတာကို ရှာဖွေဖို့ဖြစ်ပြီး၊ နောက်ဆုံး စတုတ္ထအချက်ကတော့ အရာအားလုံး ပြည့်စုံနေတဲ့ ကိုယ့်ရဲ့ အမြင့်မားဆုံးသော ဗားရှင်း (Highest self) နဲ့ ချိတ်ဆက်ဖို့ပဲ ဖြစ်ပါတယ်။ ဒီအလေ့အကျင့်တွေကို လုပ်ဆောင်ခြင်းဖြင့် ဂယ်ရီ (Gary) ဆိုတဲ့ အမျိုးသားဟာ ခြောက်လထက်ပိုပြီး အလုပ်မမြဲခဲ့ရာကနေ သုံးလအတွင်း ဝင်ငွေကောင်းတဲ့ စီးပွားရေးတစ်ခုကို တည်ဆောက်နိုင်ခဲ့သလို၊ ဒိုင်နာ (Dina) ဆိုတဲ့ အမျိုးသမီးဟာလည်း အဆိပ်သင့်ဆက်ဆံရေးကနေ ရုန်းထွက်နိုင်ခဲ့ပါတယ်။</p><p>တတိယ အဓိကအချက်ကတော့ တုန်ခါမှုအမြင့်ပိုင်းနဲ့ လိုအင်ဆန္ဒတွေကို ဖန်တီးယူခြင်း (High-Vibration Manifestation) ဖြစ်ပါတယ်။ ဆွဲငင်ခြင်းနိယာမကို အသုံးပြုတဲ့နေရာမှာ တုန်ခါမှုအနိမ့်ပိုင်းကနေ ဆွဲငင်တာနဲ့ အမြင့်ပိုင်းကနေ ဆွဲငင်တာဆိုပြီး ကွာခြားချက်တွေ ရှိပါတယ်။ ကြောက်ရွံ့မှု၊ စိုးရိမ်ပူပန်မှုနဲ့ လိုအပ်ချက်တွေအပေါ် အခြေခံပြီး ဆွဲငင်တဲ့အခါမှာ ရလဒ်တွေက မတည်မြဲတတ်ပါဘူး။ ရှန်နွန် (Shannon) ဆိုတဲ့ ကျောင်းသူလေးရဲ့ ဇာတ်လမ်းကို ကြည့်မယ်ဆိုရင် သူမဟာ စွန့်ပစ်ခံရမှာ ကြောက်တဲ့စိတ်နဲ့ ရည်းစားဟောင်းကို ပြန်ရဖို့ ဆွဲငင်ခဲ့တဲ့အတွက် ရည်းစားဟောင်း ပြန်ရောက်လာပေမယ့်လည်း သစ္စာဖောက်ခံရပြီး ပိုဆိုးတဲ့ နာကျင်မှုတွေနဲ့ အဆုံးသတ်ခဲ့ရပါတယ်။ ဒါပေမယ့် သူမဟာ စွမ်းအင်သန့်စင်ခြင်းတွေ လုပ်ဆောင်ပြီး ကျေးဇူးတင်တတ်တဲ့စိတ်၊ ပျော်ရွှင်တဲ့စိတ်စတဲ့ တုန်ခါမှုအမြင့်ပိုင်းကနေ ချစ်ခြင်းမေတ္တာကို ထပ်မံ ဖန်တီးယူတဲ့အခါမှာတော့ သူမတကယ် လိုလားတောင့်တခဲ့တဲ့ မှန်ကန်တဲ့ အချစ်စစ်ကို လျင်မြန်စွာ ပိုင်ဆိုင်နိုင်ခဲ့ပါတယ်။ ဒါကြောင့် လိုချင်တာကို အတင်းအကျပ် ရယူတာထက်၊ စိတ်ကို ဖြေလျှော့ပြီး မှန်ကန်တဲ့ တုန်ခါမှုလှိုင်းထဲမှာ နေထိုင်ဖို့က အလွန်အရေးကြီးပါတယ်။</p><p>စတုတ္ထအချက်အနေနဲ့ နယ်နိမိတ်သတ်မှတ်ခြင်းနှင့် စွမ်းအင်ကာကွယ်ခြင်း (Boundaries and Energy Protection) ရဲ့ အရေးပါမှုကို သိမြင်စေချင်ပါတယ်။ အထူးသဖြင့် အခြားသူတွေရဲ့ ခံစားချက်ကို လိုက်လံခံစားပေးတတ်တဲ့ အမ်ပက်သ် (Empaths) တွေအတွက် နယ်နိမိတ်သတ်မှတ်ခြင်းဟာ လုံးဝ မရှိမဖြစ် လိုအပ်ပါတယ်။ ကာလီ (Carly) ဆိုတဲ့ အမျိုးသမီးဟာ ငယ်စဉ်ကတည်းက အခြားသူတွေရဲ့ အလိုကို လိုက်လျောခဲ့ရတဲ့ (People pleaser) တစ်ဦးဖြစ်ပြီး အလုပ်မှာရော အိမ်မှာပါ ငြင်းဆန်ဖို့ ခက်ခဲနေခဲ့ပါတယ်။ သူမဟာ အိုလီဗာဆီကနေ "Yes, and..." လို့ခေါ်တဲ့ နည်းလမ်းကို သင်ယူခဲ့ပြီး၊ အလျှော့ပေးတာမျိုး မဟုတ်ဘဲ မိမိရဲ့ လိုအပ်ချက်ကိုပါ ပူးတွဲတောင်းဆိုတတ်လာခဲ့ပါတယ်။ ရုပ်ပိုင်းဆိုင်ရာ၊ အချိန်ပိုင်းဆိုင်ရာ၊ စကားလုံးပိုင်းဆိုင်ရာနဲ့ စွမ်းအင်ပိုင်းဆိုင်ရာ နယ်နိမိတ်တွေကို သတ်မှတ်ဖို့ အရေးကြီးကြောင်း သူမရဲ့ ဘဝပြောင်းလဲမှုက သက်သေပြနေပါတယ်။ အိပ်ရာမဝင်ခင်မှာ အဖြူရောင် အလင်းပူဖောင်းလေးက မိမိကို ကာကွယ်ပေးထားတယ်လို့ စိတ်ကူးယဉ်ခြင်း (Protective bubble) ဟာ အခြားသူတွေရဲ့ အနုတ်လက္ခဏာ စွမ်းအင်တွေ ကူးစက်မလာအောင် တားဆီးပေးနိုင်တဲ့ အကောင်းဆုံး နည်းလမ်းတစ်ခု ဖြစ်ပါတယ်။</p><p>ပဉ္စမမြောက်နဲ့ နောက်ဆုံးအချက်ကတော့ စိတ်ဒဏ်ရာများကို ကုစားခြင်းနှင့် ဘဝရည်ရွယ်ချက်ကို ရှာဖွေခြင်း (Healing Trauma and Finding Purpose) အကြောင်းပဲ ဖြစ်ပါတယ်။ အတိတ်က နာကျင်မှုတွေကို အပြည့်အဝ မကုစားနိုင်သရွေ့ ကျွန်တော်တို့ရဲ့ ဘဝဟာ ရှေ့ဆက်ဖို့ ခက်ခဲနေမှာပါ။ မက်တ် (Matt) ဆိုတဲ့ အမျိုးသားဟာ ကင်ဆာရောဂါကြောင့် နောက်ထပ် နှစ်နှစ်ပဲ အသက်ရှင်ရတော့မယ်လို့ ဆရာဝန်တွေက သတ်မှတ်ခဲ့ပါတယ်။ သူဟာ ကလေးဘဝက နှိပ်စက်ခဲ့တဲ့ မိဘတွေအပေါ် ဒေါသထွက်နေခဲ့ပေမယ့်၊ ခွင့်လွှတ်ဖို့ဆိုတာထက်စာရင် အဲ့ဒီနာကျင်မှု စွမ်းအင်တွေကို မိမိခန္ဓာကိုယ်ထဲကနေ ထုတ်လွှတ်ပစ်ဖို့ကိုသာ အာရုံစိုက်ခဲ့ပါတယ်။ မီးရှို့ပြီး စွမ်းအင်ပြောင်းလဲတဲ့ ရိုးရာအလေ့အကျင့် (Fire ceremony) တွေကို လုပ်ဆောင်ပြီးနောက်မှာတော့ မျိုးရိုးစဉ်ဆက် ဆင်းသက်လာတဲ့ စိတ်ဒဏ်ရာတွေကို ဖြတ်တောက်နိုင်ခဲ့ပြီး သူရဲ့ ကင်ဆာရောဂါဟာလည်း အံ့ဖွယ်နည်းနဲ့ ပျောက်ကင်းသွားခဲ့ပါတယ်။ မိမိကိုယ်ကို ကုစားနိုင်ခြင်းကနေတစ်ဆင့် သူဟာ အခြားသူတွေကို ကူညီပေးနိုင်တဲ့ စစ်မှန်တဲ့ ဘဝရည်ရွယ်ချက်ကိုပါ ရှာဖွေတွေ့ရှိသွားပါတယ်။ ဘဝရဲ့ ရည်ရွယ်ချက်ဆိုတာ အပြင်ဘက်မှာ လိုက်လံရှာဖွေရမယ့် အရာတစ်ခုမဟုတ်ဘဲ၊ မိမိရဲ့ အတွင်းစိတ် အနှစ်သာရ (Core essence) နဲ့ ပြန်လည်ချိတ်ဆက်မိတဲ့အခါ သဘာဝအလျောက် ပေါ်ထွက်လာတဲ့ အရာဖြစ်တယ်ဆိုတာကို ဒီအချက်က သက်သေပြနေပါတယ်။</p>',
  '<h3>လက်တွေ့ဘဝနှင့် လုပ်ငန်းခွင်တွင် အသုံးချခြင်း</h3><p>ဒီစာအုပ်ထဲက အသိပညာတွေကို လုပ်ငန်းခွင်နဲ့ လက်တွေ့ဘဝမှာ ဘယ်လိုအသုံးချမလဲဆိုတာကို လေ့လာကြည့်ကြရအောင်ပါ။ ခေါင်းဆောင်မှုအပိုင်း၊ ကုန်ထုတ်စွမ်းအားမြှင့်တင်ရေးနဲ့ စိတ်ပိုင်းဆိုင်ရာ ကြံ့ခိုင်ရေးတွေအတွက် ဒီအလေ့အကျင့်တွေက အလွန်ကို အသုံးဝင်ပါတယ်။ ပထမဆုံးအနေနဲ့ ညဘက်အိပ်ရာမဝင်ခင် မိနစ် ၃၀ လောက်အလိုမှာ ဖုန်းတွေ၊ အီလက်ထရောနစ် ပစ္စည်းတွေကို ပိတ်ထားပြီး အီမေးလ်စစ်တာမျိုး၊ အလုပ်ကိစ္စ တွေးတာမျိုးတွေကို လုံးဝ ရှောင်ကြဉ်ရပါမယ်။ အလုပ်မှာ စိတ်ဖိစီးမှုတွေ များနေတဲ့ နေ့မျိုးတွေမှာ ကိုယ်ခန္ဓာထဲမှာ စုပုံနေတဲ့ စွမ်းအင်တွေကို လှုပ်ရှားမှုနဲ့ ဖယ်ရှားပစ်ဖို့ လိုအပ်ပါတယ်။ ဥပမာ - ခန္ဓာကိုယ် အစိတ်အပိုင်းတွေကို စက်ဝိုင်းပုံစံ လှည့်ပေးတာ (Body rolls)၊ ခန္ဓာကိုယ်အနှံ့ လက်နဲ့ ဖွဖွလေး ပုတ်ပေးတာ (Tapping) မျိုးတွေ လုပ်ဆောင်ခြင်းဖြင့် ပိတ်ဆို့နေတဲ့ စွမ်းအင်တွေကို ပြန်လည်စီးဆင်းစေနိုင်ပါတယ်။</p><p>အလုပ်ခွင်မှာ အာရုံစူးစိုက်မှု (Mental focus) အားကောင်းစေဖို့အတွက် "Not-to-do list" (မလုပ်ရမည့် စာရင်း) ကို ရေးဆွဲဖို့ အိုလီဗာက အကြံပြုထားပါတယ်။ ကျွန်တော်တို့ဟာ လုပ်စရာစာရင်း (To-do list) တွေကိုပဲ အာရုံစိုက်လေ့ရှိပေမယ့်၊ တကယ်တမ်း ကိုယ့်ရဲ့ အချိန်နဲ့ စွမ်းအင်ကို အချည်းနှီး ကုန်ဆုံးစေတဲ့ အကျင့်ဆိုးတွေကို စွန့်လွှတ်လိုက်မှသာ မိမိရဲ့ ရည်မှန်းချက် ပန်းတိုင်ဆီကို တည့်မတ်စွာ သွားနိုင်မှာပါ။ နောက်ထပ် အရေးကြီးတဲ့ အသုံးချနည်း တစ်ခုကတော့ အရေးကြီးတဲ့ ဆွေးနွေးပွဲတွေ၊ လူကြီးတွေနဲ့ တွေ့ဆုံရမယ့် အချိန်တွေမှာ မိမိရဲ့ စိတ်ပူပန်မှုတွေကို လျှော့ချဖို့ "Box breathing" (အသက်ရှူသွင်း၊ ထိန်းထား၊ ရှူထုတ်၊ ထိန်းထား ၄ စက္ကန့်စီ လုပ်ခြင်း) သို့မဟုတ် ၄-၇-၈ အသက်ရှူနည်း (4-7-8 breathing technique) ကို အသုံးပြုနိုင်ပါတယ်။ ဒီလိုလုပ်ဆောင်ခြင်းဖြင့် အာရုံကြောစနစ်ကို ပြေလျော့စေပြီး တည်ငြိမ်တဲ့ ဆုံးဖြတ်ချက်တွေကို ချမှတ်နိုင်မှာ ဖြစ်ပါတယ်။ ဒါ့အပြင် မိမိကိုယ်ကို ချစ်ခင်မြတ်နိုးမှု (Self-love) ကို မြှင့်တင်ဖို့အတွက် နေ့စဉ်ကြုံတွေ့ရတဲ့ သေးငယ်တဲ့ ဝမ်းမြောက်စရာ ကိစ္စလေးတွေကို ချရေးမှတ်သားတဲ့ "Joy Journal" (ပျော်ရွှင်မှု မှတ်တမ်း) တစ်ခု ထားရှိဖို့လည်း မမေ့သင့်ပါဘူး။ ကိုယ့်ကိုယ်ကို ဂရုစိုက်ခြင်း (Self-care) ဟာ တစ်ကိုယ်ကောင်းဆန်တာ မဟုတ်ဘဲ၊ ကိုယ့်ရဲ့ ခွက်ကလေး ပြည့်လျှံနေမှသာ အခြားသူတွေကို ပိုလျှံတဲ့ မေတ္တာတွေ၊ စွမ်းအင်တွေ ဝေမျှပေးနိုင်မယ်ဆိုတာကို ခေါင်းဆောင်ကောင်းတိုင်း သတိပြုရမှာ ဖြစ်ပါတယ်။</p>',
  '<h3>နိဂုံးနှင့် ရှေ့ဆက်ရန် အကြံပြုချက်</h3><p>အချုပ်အားဖြင့် ဆိုရရင်တော့ အိုလီဗာ နီညိုရဲ့ <b>Do This Before Bed</b> စာအုပ်ဟာ ညဘက်အိပ်စက်ခြင်းဆိုတဲ့ သာမန်လုပ်ရိုးလုပ်စဉ်တစ်ခုကို ကိုယ့်ဘဝကို ပြောင်းလဲပေးနိုင်တဲ့ အစွမ်းထက် ကိရိယာတစ်ခုအဖြစ် ဘယ်လို အသွင်ပြောင်းရမလဲဆိုတာကို လက်တွေ့ကျကျ လမ်းညွှန်ပေးထားတာ ဖြစ်ပါတယ်။ အိပ်စက်ခြင်းဆိုတာ ခန္ဓာကိုယ်အတွက် အနားယူတာ သက်သက်မဟုတ်ဘဲ၊ ကျွန်တော်တို့ရဲ့ မသိစိတ်ကို ပြန်လည်မွမ်းမံဖို့နဲ့ ပိုမိုမြင့်မားတဲ့ ဝိညာဉ်ရေးရာ အသိဉာဏ် (Spiritual self) ဆီကို ကူးလူးဆက်သွယ်ပေးတဲ့ တံတားတစ်စင်းပဲ ဖြစ်ပါတယ်။ ကျွန်တော်တို့ရဲ့ ဘဝမှာ ကြုံတွေ့နေရတဲ့ ပြဿနာတိုင်းရဲ့ အဖြေဟာ ပြင်ပမှာ ရှိမနေဘဲ ကျွန်တော်တို့ရဲ့ အတွင်းစိတ်ထဲမှာ အမြဲတမ်း ကိန်းအောင်းနေပြီးသားပါ။ ဒီစာအုပ်ထဲက အလေ့အကျင့်လေးတွေကို ညစဉ်ညတိုင်း အချိန်အနည်းငယ် ပေးပြီး လိုက်နာကျင့်သုံးသွားမယ်ဆိုရင် မိတ်ဆွေတို့ရဲ့ စိတ်ပိုင်းဆိုင်ရာ တုန်ခါမှုတွေ သိသိသာသာ မြင့်တက်လာပြီး လိုချင်တဲ့ အောင်မြင်မှု၊ ငြိမ်းချမ်းမှုနဲ့ ပျော်ရွှင်မှုတွေကို အလိုအလျောက် ဆွဲငင်လာနိုင်မှာ အသေအချာပဲ ဖြစ်ပါတယ်။ အတိတ်က နာကျင်မှုတွေ၊ ပိတ်ဆို့မှုတွေကို ရဲရဲဝံ့ဝံ့ စွန့်လွှတ်လိုက်ပြီး ကိုယ်တကယ် ဖြစ်တည်ချင်တဲ့ အကောင်းဆုံး ဗားရှင်းအဖြစ် နေ့သစ်တိုင်းကို အားသစ်အင်သစ်တွေနဲ့ စတင်နိုင်ပါစေလို့ ဆန္ဒပြုလိုက်ပါတယ်။ မိတ်ဆွေတို့ရဲ့ အိပ်ရာဝင်ချိန်တိုင်းဟာ ငြိမ်းချမ်းမှုနဲ့ အံ့ဖွယ်ရာတွေ ပြည့်နှက်နေတဲ့ အချိန်လေးတွေ ဖြစ်ပါစေဗျာ။</p>'
]

            "Future Fit": {
                title: "Future Fit",
                author: "Andrea Clarke",
                description: "Andrea Clarke ရေးသားထားသော 'Future Fit' စာအုပ်သည် လျင်မြန်စွာ ပြောင်းလဲနေသော အလုပ်အကိုင်လောကတွင် မိမိကိုယ်ကိုယ် အစဉ်အမြဲ အသုံးဝင်နေစေရန်နှင့် ယှဉ်ပြိုင်နိုင်စွမ်းရှိစေရန် လိုအပ်သည့် အရည်အချင်းများကို အဓိကထား တင်ပြထားသည်။ စာရေးသူက နည်းပညာ တိုးတက်မှုထက် လူသားဆန်သော စွမ်းရည်များဖြစ်သည့် ပြဿနာဖြေရှင်းနိုင်စွမ်း၊ ဆက်သွယ်ပြောဆိုမှုနှင့် ခံနိုင်ရည်ရှိမှု တို့က ပိုမိုအရေးကြီးကြောင်း ထောက်ပြထားပါသည်။ စာအုပ်တွင် Reputation Capital (ဂုဏ်သတင်း အရင်းအနှီး) တည်ဆောက်ခြင်းနှင့် အစဉ်မပြတ် သင်ယူလိုစိတ်ရှိခြင်း တို့သည် အနာဂတ်အတွက် အကောင်းဆုံး ပြင်ဆင်မှုများဖြစ်ကြောင်း ရှင်းလင်းဖော်ပြထားသည်။ ထို့ပြင် ကိုဗစ်-၁၉ ကပ်ရောဂါကြောင့် ပြောင်းလဲသွားသော Hybrid လုပ်ငန်းခွင် ပတ်ဝန်းကျင် တွင် မည်သို့ လိုက်လျောညီထွေ ရှင်သန်ရမည်ကို လက်တွေ့ကျသော အကြံပြုချက်များဖြင့် လမ်းညွှန်ထားသည်။ ဤအရင်းအမြစ်သည် ဝန်ထမ်းများအနေဖြင့် အပြောင်းအလဲများကို မကြောက်ဘဲ မိမိကိုယ်ကိုယ် ပြန်လည် ဆန်းသစ်တီထွင်နိုင်ရန် တွန်းအားပေးသည့် လမ်းပြမြေပုံတစ်ခု ဖြစ်ပါသည်။",
