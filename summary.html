            "Triggers": {
                title: "Triggers",
                author: "Marshall Goldsmith",
                description: "ဤစာအုပ်သည် ကမ္ဘာကျော် စီမံခန့်ခွဲမှုပညာရှင် Marshall Goldsmith ရေးသားထားသော 'Triggers' ဖြစ်ပြီး လူသားတို့၏ အမူအကျင့် ပြောင်းလဲခြင်း ဆိုင်ရာ အခက်အခဲများကို ဆွေးနွေးတင်ပြထားပါသည်။ ကျွန်ုပ်တို့၏ အတွေးနှင့် လုပ်ရပ်များကို ပုံဖော်ပေးနေသော ပတ်ဝန်းကျင်မှ လှုံ့ဆော်မှုများ (Triggers) ကို မည်သို့သိရှိနားလည်ပြီး ထိန်းချုပ်ရမည်ကို ရှင်းလင်းထားသည်။ စာရေးသူက လူတို့သည် မိမိဖြစ်ချင်သော ပုံစံသို့ ပြောင်းလဲရန် ကြိုးစားရာတွင် နောင်တ နှင့် အဟန့်အတားများ ကို မည်သို့ကျော်လွှားရမည်ကို လက်တွေ့ကျသော နည်းလမ်းများဖြင့် လမ်းညွှန်ပေးထားပါသည်။ အောင်မြင်သော ခေါင်းဆောင်များ၏ အတွေ့အကြုံများကို အခြေခံ၍ မိမိကိုယ်ကိုယ် ဆန်းစစ်ခြင်း နှင့် စနစ်တကျ ပြောင်းလဲခြင်း တို့၏ အရေးပါမှုကို ဖော်ပြထားပါသည်။ နောက်ဆုံးတွင် ဤစာအုပ်သည် လူတစ်ဦးချင်းစီအား မိမိအမှန်တကယ် ဖြစ်ချင်သောသူ ဖြစ်လာစေရန်နှင့် ဘဝတွင် နောင်တကင်းစွာ နေထိုင်နိုင်ရန် ကူညီပေးသည့် လမ်းညွှန်ချက်တစ်ခု ဖြစ်ပါသည်။",
                cover: "/bookscovers/triger creating book cover.jpg",
                audio: "audio/the-coaching-habit.mp3",
                summaryHeading: "<h2>ကိုယ်ဖြစ်ချင်တဲ့သူ အမှန်တကယ်ဖြစ်လာစေဖို့ ပတ်ဝန်းကျင်ရဲ့ လွှမ်းမိုးမှုတွေကို ကျော်လွှားခြင်း</h2>",
                summaryParagraphs: [
                  '<h3>မိတ်ဆက်နှင့် အဓိကပြဿနာ</h3><p>ဒီပြဿနာကို ကမ္ဘာကျော် ခေါင်းဆောင်မှုဆိုင်ရာ နည်းပြ (Executive Coach) တစ်ဦးဖြစ်တဲ့ Marshall Goldsmith က သူ့ရဲ့ "Triggers: Creating Behavior That Lasts--Becoming the Person You Want to Be" ဆိုတဲ့ စာအုပ်မှာ အလွန်တရာ စိတ်ဝင်စားဖွယ်ကောင်းအောင် တင်ပြထားပါတယ်။ Marshall Goldsmith ဟာ ကမ္ဘာ့ထိပ်တန်း ကုမ္ပဏီကြီးတွေက စီအီးအို (CEO) တွေကို ပြောင်းလဲတိုးတက်အောင် နည်းပြပေးခဲ့တဲ့ အတွေ့အကြုံတွေကနေတဆင့် ဒီစာအုပ်ကို ရေးသားခဲ့တာ ဖြစ်ပါတယ်။ သူ့ရဲ့ အဓိက အဆိုပြုချက်ကတော့ ကျွန်တော်တို့ရဲ့ ပတ်ဝန်းကျင်ဟာ ကျွန်တော်တို့ကို အမြဲတမ်း စမ်းသပ်နေတဲ့၊ အမြဲတမ်း လွှမ်းမိုးနေတဲ့ အင်အားစုကြီး တစ်ခုဖြစ်တယ်ဆိုတာပါပဲ။ ကိုယ်က ဘယ်လောက်ပဲ စိတ်ရှည်မယ်လို့ ဆုံးဖြတ်ထားပါစေ၊ ရုံးရောက်တဲ့အခါ အလုပ်တွေ အရမ်းများလာတာ၊ လုပ်ဖော်ကိုင်ဖက်တွေက အဆင်မပြေတာတွေ လုပ်လာတဲ့အခါ အလိုလို ဒေါသထွက်သွားတတ်ပါတယ်။ ဒီလိုမျိုး ကိုယ့်ရဲ့ မူလရည်မှန်းချက်ကို သွေဖည်သွားစေတဲ့ တွန်းအားပေးမှုတွေ၊ လှုံ့ဆော်မှုတွေကို စာရေးသူက **Triggers** လို့ ခေါ်ဝေါ်သုံးနှုန်းထားပါတယ်။ ဒီစာအုပ်ဟာ အဲဒီ Triggers တွေကို ဘယ်လို သတိပြုမိအောင် လုပ်မလဲ၊ ဘယ်လို ထိန်းချုပ်မလဲဆိုတာကို နက်နက်ရှိုင်းရှိုင်း ဆွေးနွေးထားတဲ့အတွက် လုပ်ငန်းခွင်မှာရော၊ ပုဂ္ဂိုလ်ရေးဘဝမှာပါ အောင်မြင်ချင်သူတိုင်း မဖြစ်မနေ လေ့လာသင့်တဲ့ အတွေးအခေါ်တွေကို ပေးစွမ်းနိုင်မှာ ဖြစ်ပါတယ်။</p>',
                  '<h3>စာအုပ်၏ အနှစ်သာရနှင့် အတွေးအခေါ်များ</h3><p>ဒီစာအုပ်ရဲ့ အဓိက အနှစ်သာရတွေကို လေ့လာကြည့်တဲ့အခါ ပထမဆုံး အနေနဲ့ **ပတ်ဝန်းကျင်၏ လွှမ်းမိုးမှု (The Power of Environment)** ကို နားလည်ဖို့ အလွန်အရေးကြီးပါတယ်။ ကျွန်တော်တို့ အများစုဟာ ကိုယ့်ရဲ့ ဆုံးဖြတ်ချက်နဲ့ ကိုယ့်ရဲ့ စိတ်ဆန္ဒအပေါ်မှာပဲ အလွန်အကျွံ ယုံကြည်မှု လွန်ကဲနေတတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ့် လက်တွေ့မှာတော့ ပတ်ဝန်းကျင်ဆိုတာ ကျွန်တော်တို့ကို အချိန်တိုင်း လွှမ်းမိုးနေတဲ့၊ ကျွန်တော်တို့ရဲ့ အပြုအမူတွေကို အလိုအလျောက် ပြောင်းလဲသွားစေနိုင်တဲ့ အစွမ်းထက် စက်ယန္တရားကြီး တစ်ခု ဖြစ်ပါတယ်။ ဥပမာအားဖြင့် အိမ်မှာ မိသားစုနဲ့ အေးအေးချမ်းချမ်း နေတတ်တဲ့သူ တစ်ယောက်ဟာ ကားလမ်းပိတ်ဆို့နေတဲ့ အချိန်မှာ တခြားကားက ဝင်တိုးတာကို ခံရတဲ့အခါ ချက်ချင်းဆိုသလို ကြမ်းတမ်းတဲ့ စကားတွေ ပြောထွက်သွားတတ်ပါတယ်။ အဲဒီအခါမှာ သူ့ရဲ့ မူလစရိုက်လက္ခဏာ ပျောက်ဆုံးသွားပြီး ပတ်ဝန်းကျင်က ဖန်တီးလိုက်တဲ့ အခြေအနေအရ တုံ့ပြန်လိုက်မိတာ ဖြစ်ပါတယ်။ စာရေးသူက ဒီလိုမျိုး အခြေအနေတွေကို ဥပမာပေးပြီး ပတ်ဝန်းကျင်ရဲ့ စိန်ခေါ်မှုတွေကို ကျွန်တော်တို့ အနေနဲ့ လျှော့မတွက်ဖို့ အလေးအနက် သတိပေးထားပါတယ်။ ကျွန်တော်တို့ဟာ ကိုယ်ဖြစ်ချင်တဲ့သူ ဖြစ်လာဖို့အတွက်ဆိုရင် ကိုယ့်ကို လမ်းချော်သွားစေနိုင်တဲ့ Triggers တွေကို ကြိုတင် ခန့်မှန်းပြီး ပြင်ဆင်ထားဖို့ လိုအပ်တယ်ဆိုတာကို နားလည်သဘောပေါက်ရမှာ ဖြစ်ပါတယ်။</p><p>ဒုတိယမြောက် အရေးပါတဲ့ သဘောတရားကတော့ **ပြောင်းလဲခြင်း စက်ဝိုင်း (The Wheel of Change)** ပဲ ဖြစ်ပါတယ်။ လူတွေက ပြောင်းလဲမှုလို့ ပြောလိုက်တာနဲ့ အကျင့်သစ်တွေ ဖန်တီးတာ၊ ဒါမှမဟုတ် အကျင့်ဆိုးတွေ ဖျောက်တာကိုပဲ ပြေးမြင်တတ်ကြပါတယ်။ ဒါပေမဲ့ Marshall Goldsmith က ပြောင်းလဲခြင်းကို အပိုင်းလေးပိုင်းနဲ့ သေချာ ခွဲခြမ်းစိတ်ဖြာ ပြထားပါတယ်။ ပထမတစ်ခုကတော့ ဖန်တီးခြင်း (Creating) ဖြစ်ပြီး ကိုယ့်မှာ မရှိသေးတဲ့ အပြုအမူကောင်းတွေကို အသစ်တဖန် မွေးမြူတာ ဖြစ်ပါတယ်။ ဒုတိယတစ်ခုကတော့ ထိန်းသိမ်းခြင်း (Preserving) ပါ။ ဒါက အရမ်းကို အရေးကြီးပါတယ်။ ကိုယ့်ဆီမှာ ရှိပြီးသား ကောင်းမွန်တဲ့ အရည်အချင်းတွေကို ပတ်ဝန်းကျင် အခြေအနေတွေ ဘယ်လိုပဲ ပြောင်းလဲသွားပါစေ ဆက်လက် ထိန်းသိမ်းထားနိုင်ဖို့ ကြိုးစားရတာ ဖြစ်ပါတယ်။ တတိယတစ်ခုကတော့ ဖယ်ရှားခြင်း (Eliminating) ဖြစ်ပြီး ကိုယ့်ရဲ့ တိုးတက်မှုကို အဟန့်အတား ဖြစ်စေတဲ့ အကျင့်ဆိုးတွေကို ရဲရဲဝံ့ဝံ့ စွန့်လွှတ်တာပါ။ နောက်ဆုံး စတုတ္ထတစ်ခုကတော့ လက်ခံခြင်း (Accepting) ဖြစ်ပါတယ်။ ကျွန်တော်တို့ ဘဝမှာ ကိုယ်တိုင် ပြောင်းလဲလို့မရတဲ့ အရာတွေ၊ ဥပမာ- ကုမ္ပဏီရဲ့ မူဝါဒတွေ၊ ဒါမှမဟုတ် အထက်လူကြီးရဲ့ ပြောင်းလဲလို့ မရတဲ့ စရိုက်လက္ခဏာတွေကို အလကားနေရင်း ဒေါသထွက်ပြီး အချိန်ဖြုန်းနေမယ့် အစား အရှိကို အရှိအတိုင်း လက်ခံပြီး ရှေ့ဆက်နိုင်ဖို့ လိုအပ်တယ်ဆိုတာကို ဒီပြောင်းလဲခြင်း စက်ဝိုင်းကနေတဆင့် သွန်သင်ပေးထားပါတယ်။</p><တတိယမြောက် အထင်ရှားဆုံးနဲ့ ဒီစာအုပ်ရဲ့ အသက်သွေးကြောလို့ ခေါ်ဆိုနိုင်တဲ့ အချက်ကတော့  **တက်ကြွသော မေးခွန်းများ (Active Questions)** ရဲ့ အသုံးဝင်မှုပဲ ဖြစ်ပါတယ်။ ပုံမှန်အားဖြင့် ကျွန်တော်တို့ဟာ ကိုယ့်ကိုယ်ကိုယ် ဆန်းစစ်တဲ့အခါ "ငါ ဒီနေ့ ရည်မှန်းချက်တွေ ပြည့်မီခဲ့ရဲ့လား" ဆိုတဲ့ Passive မေးခွန်းမျိုးကိုသာ မေးလေ့ရှိပါတယ်။ အဲဒီလို မေးတဲ့အခါ အဖြေက မပြည့်မီဘူးဆိုရင် ကျွန်တော်တို့ ဦးနှောက်က အလိုလို ဆင်ခြေတွေ ရှာပါတော့တယ်။ "ဒီနေ့ ရာသီဥတု မကောင်းလို့၊ အလုပ်မှာ Boss က အလုပ်တွေ ပုံပေးလိုက်လို့" စသဖြင့် ပတ်ဝန်းကျင်ကို အပြစ်တင်တတ်ကြပါတယ်။ ဒီနေရာမှာ စာရေးသူက အဲဒီမေးခွန်းတွေကို Active Questions တွေအဖြစ် ပြောင်းလဲပစ်ဖို့ အကြံပြုထားပါတယ်။ ဆိုလိုတာက "ငါ ဒီနေ့ ရည်မှန်းချက်တွေ ပြည့်မီဖို့အတွက် **ငါ့ဘက်က အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား** (Did I do my best to...)" ဆိုပြီး ပြောင်းမေးရမှာ ဖြစ်ပါတယ်။ ဒီလို ပြောင်းမေးလိုက်တဲ့အတွက် ကြောင့်မို့လို့ အပြစ်တင်စရာ ဆင်ခြေပေးစရာ လမ်းကြောင်း ပိတ်သွားပြီး မိမိရဲ့ တာဝန်ယူမှု၊ တာဝန်ခံမှု အပြည့်အဝ ရှိလာစေပါတယ်။ ကိုယ် အကောင်းဆုံး မကြိုးစားခဲ့ဘူးဆိုရင် ကိုယ့်အမှားပဲ ဖြစ်တဲ့အတွက် နောက်နေ့တွေမှာ ပိုပြီး သတိထား ကြိုးစားလာအောင် တွန်းအားပေးရာ ရောက်ပါတယ်။ ဒီအတွေးအခေါ်ဟာ သိပ်ကို ရိုးရှင်းပေမဲ့ အလွန်တရာ အစွမ်းထက်တဲ့ ပြောင်းလဲမှု တစ်ခု ဖြစ်တယ်ဆိုတာကို ကျွန်တော်တို့ လက်ခံရမှာ ဖြစ်ပါတယ်။နောက်ဆုံး စတုတ္ထမြောက် အရေးကြီးတဲ့ အယူအဆတစ်ခုကတော့ အချိန်တိုင်းမှာ ကိုယ့်ကိုယ်ကိုယ် ပြန်မေးရမယ့် **AIWATT မေးခွန်း** ပဲ ဖြစ်ပါတယ်။ AIWATT ဆိုတာကတော့ "Am I willing, at this time, to make the investment required to make a positive difference on this topic?" (ဒီကိစ္စနဲ့ ပတ်သက်ပြီး အကောင်းမြင်နိုင်တဲ့ အပြောင်းအလဲတစ်ခု ဖြစ်လာဖို့အတွက် အခုအချိန်မှာ ငါ့ဘက်က လိုအပ်တဲ့အချိန်နဲ့ခွန်အားတွေကို ရင်းနှီးမြှုပ်နှံဖို့ ဆန္ဒရှိရဲ့လား) ဆိုတာပဲ ဖြစ်ပါတယ်။ အထူးသဖြင့် အလုပ်ခွင်မှာ လုပ်ဖော်ကိုင်ဖက် တစ်ယောက်ယောက်က ကိုယ့်ကို စိတ်အနှောင့်အယှက် ဖြစ်အောင် ပြောလာတဲ့အခါ ချက်ချင်း ဒေါသတကြီး တုံ့ပြန်တော့မယ့် အစား ဒီမေးခွန်းလေးကို ကိုယ့်ကိုယ်ကိုယ် အရင်မေးကြည့်ဖို့ လိုပါတယ်။ ငါ အခု ငြင်းခုံလိုက်လို့ ဘာအကျိုးအမြတ် ရလာမှာလဲ၊ ပြဿနာ ပိုကြီးသွားမလား၊ ငါ့ရဲ့ တန်ဖိုးရှိတဲ့ အချိန်တွေ၊ စွမ်းအင်တွေ ဆုံးရှုံးခံပြီး ဒီပြဿနာကို ဖြေရှင်းဖို့ တကယ်ပဲ တန်ရဲ့လား ဆိုတာကို စဉ်းစားလိုက်တာနဲ့ မလိုအပ်တဲ့ ပဋိပက္ခ အများစုကို ရှောင်လွှဲနိုင်သွားမှာ ဖြစ်ပါတယ်။ ဒါဟာ မိမိကိုယ်ကိုယ် ထိန်းချုပ်ခြင်း (Self-control) ကို အမြင့်ဆုံး အဆင့်အထိ တည်ဆောက်ပေးနိုင်တဲ့ လေ့ကျင့်ခန်း တစ်ခုပဲ ဖြစ်ပါတယ်။</p>'
                 ]    
            },

                summaryHeading: "<h2>Key Insights</h2>",
                summaryParagraphs: [
                    '<h3>Main Idea</h3><p>ဒီပြဿနာကို ကမ္ဘာကျော် ခေါင်းဆောင်မှုဆိုင်ရာ နည်းပြ (Executive Coach) တစ်ဦးဖြစ်တဲ့ Marshall Goldsmith က သူ့ရဲ့ "Triggers: Creating Behavior That Lasts--Becoming the Person You Want to Be" ဆိုတဲ့ စာအုပ်မှာ အလွန်တရာ စိတ်ဝင်စားဖွယ်ကောင်းအောင် တင်ပြထားပါတယ်။ Marshall Goldsmith ဟာ ကမ္ဘာ့ထိပ်တန်း ကုမ္ပဏီကြီးတွေက စီအီးအို (CEO) တွေကို ပြောင်းလဲတိုးတက်အောင် နည်းပြပေးခဲ့တဲ့ အတွေ့အကြုံတွေကနေတဆင့် ဒီစာအုပ်ကို ရေးသားခဲ့တာ ဖြစ်ပါတယ်။ သူ့ရဲ့ အဓိက အဆိုပြုချက်ကတော့ ကျွန်တော်တို့ရဲ့ ပတ်ဝန်းကျင်ဟာ ကျွန်တော်တို့ကို အမြဲတမ်း စမ်းသပ်နေတဲ့၊ အမြဲတမ်း လွှမ်းမိုးနေတဲ့ အင်အားစုကြီး တစ်ခုဖြစ်တယ်ဆိုတာပါပဲ။ ကိုယ်က ဘယ်လောက်ပဲ စိတ်ရှည်မယ်လို့ ဆုံးဖြတ်ထားပါစေ၊ ရုံးရောက်တဲ့အခါ အလုပ်တွေ အရမ်းများလာတာ၊ လုပ်ဖော်ကိုင်ဖက်တွေက အဆင်မပြေတာတွေ လုပ်လာတဲ့အခါ အလိုလို ဒေါသထွက်သွားတတ်ပါတယ်။ ဒီလိုမျိုး ကိုယ့်ရဲ့ မူလရည်မှန်းချက်ကို သွေဖည်သွားစေတဲ့ တွန်းအားပေးမှုတွေ၊ လှုံ့ဆော်မှုတွေကို စာရေးသူက **Triggers** လို့ ခေါ်ဝေါ်သုံးနှုန်းထားပါတယ်။ ဒီစာအုပ်ဟာ အဲဒီ Triggers တွေကို ဘယ်လို သတိပြုမိအောင် လုပ်မလဲ၊ ဘယ်လို ထိန်းချုပ်မလဲဆိုတာကို နက်နက်ရှိုင်းရှိုင်း ဆွေးနွေးထားတဲ့အတွက် လုပ်ငန်းခွင်မှာရော၊ ပုဂ္ဂိုလ်ရေးဘဝမှာပါ အောင်မြင်ချင်သူတိုင်း မဖြစ်မနေ လေ့လာသင့်တဲ့ အတွေးအခေါ်တွေကို ပေးစွမ်းနိုင်မှာ ဖြစ်ပါတယ်။</p>',
                    '<h3>စာအုပ်၏ အနှစ်သာရနှင့် အတွေးအခေါ်များ</h3><p>ဒီစာအုပ်ရဲ့ အဓိက အနှစ်သာရတွေကို လေ့လာကြည့်တဲ့အခါ ပထမဆုံး အနေနဲ့ **ပတ်ဝန်းကျင်၏ လွှမ်းမိုးမှု (The Power of Environment)** ကို နားလည်ဖို့ အလွန်အရေးကြီးပါတယ်။ ကျွန်တော်တို့ အများစုဟာ ကိုယ့်ရဲ့ ဆုံးဖြတ်ချက်နဲ့ ကိုယ့်ရဲ့ စိတ်ဆန္ဒအပေါ်မှာပဲ အလွန်အကျွံ ယုံကြည်မှု လွန်ကဲနေတတ်ကြပါတယ်။ ဒါပေမဲ့ တကယ့် လက်တွေ့မှာတော့ ပတ်ဝန်းကျင်ဆိုတာ ကျွန်တော်တို့ကို အချိန်တိုင်း လွှမ်းမိုးနေတဲ့၊ ကျွန်တော်တို့ရဲ့ အပြုအမူတွေကို အလိုအလျောက် ပြောင်းလဲသွားစေနိုင်တဲ့ အစွမ်းထက် စက်ယန္တရားကြီး တစ်ခု ဖြစ်ပါတယ်။ ဥပမာအားဖြင့် အိမ်မှာ မိသားစုနဲ့ အေးအေးချမ်းချမ်း နေတတ်တဲ့သူ တစ်ယောက်ဟာ ကားလမ်းပိတ်ဆို့နေတဲ့ အချိန်မှာ တခြားကားက ဝင်တိုးတာကို ခံရတဲ့အခါ ချက်ချင်းဆိုသလို ကြမ်းတမ်းတဲ့ စကားတွေ ပြောထွက်သွားတတ်ပါတယ်။ အဲဒီအခါမှာ သူ့ရဲ့ မူလစရိုက်လက္ခဏာ ပျောက်ဆုံးသွားပြီး ပတ်ဝန်းကျင်က ဖန်တီးလိုက်တဲ့ အခြေအနေအရ တုံ့ပြန်လိုက်မိတာ ဖြစ်ပါတယ်။ စာရေးသူက ဒီလိုမျိုး အခြေအနေတွေကို ဥပမာပေးပြီး ပတ်ဝန်းကျင်ရဲ့ စိန်ခေါ်မှုတွေကို ကျွန်တော်တို့ အနေနဲ့ လျှော့မတွက်ဖို့ အလေးအနက် သတိပေးထားပါတယ်။ ကျွန်တော်တို့ဟာ ကိုယ်ဖြစ်ချင်တဲ့သူ ဖြစ်လာဖို့အတွက်ဆိုရင် ကိုယ့်ကို လမ်းချော်သွားစေနိုင်တဲ့ Triggers တွေကို ကြိုတင် ခန့်မှန်းပြီး ပြင်ဆင်ထားဖို့ လိုအပ်တယ်ဆိုတာကို နားလည်သဘောပေါက်ရမှာ ဖြစ်ပါတယ်။</p><p>ဒုတိယမြောက် အရေးပါတဲ့ သဘောတရားကတော့ **ပြောင်းလဲခြင်း စက်ဝိုင်း (The Wheel of Change)** ပဲ ဖြစ်ပါတယ်။ လူတွေက ပြောင်းလဲမှုလို့ ပြောလိုက်တာနဲ့ အကျင့်သစ်တွေ ဖန်တီးတာ၊ ဒါမှမဟုတ် အကျင့်ဆိုးတွေ ဖျောက်တာကိုပဲ ပြေးမြင်တတ်ကြပါတယ်။ ဒါပေမဲ့ Marshall Goldsmith က ပြောင်းလဲခြင်းကို အပိုင်းလေးပိုင်းနဲ့ သေချာ ခွဲခြမ်းစိတ်ဖြာ ပြထားပါတယ်။ ပထမတစ်ခုကတော့ ဖန်တီးခြင်း (Creating) ဖြစ်ပြီး ကိုယ့်မှာ မရှိသေးတဲ့ အပြုအမူကောင်းတွေကို အသစ်တဖန် မွေးမြူတာ ဖြစ်ပါတယ်။ ဒုတိယတစ်ခုကတော့ ထိန်းသိမ်းခြင်း (Preserving) ပါ။ ဒါက အရမ်းကို အရေးကြီးပါတယ်။ ကိုယ့်ဆီမှာ ရှိပြီးသား ကောင်းမွန်တဲ့ အရည်အချင်းတွေကို ပတ်ဝန်းကျင် အခြေအနေတွေ ဘယ်လိုပဲ ပြောင်းလဲသွားပါစေ ဆက်လက် ထိန်းသိမ်းထားနိုင်ဖို့ ကြိုးစားရတာ ဖြစ်ပါတယ်။ တတိယတစ်ခုကတော့ ဖယ်ရှားခြင်း (Eliminating) ဖြစ်ပြီး ကိုယ့်ရဲ့ တိုးတက်မှုကို အဟန့်အတား ဖြစ်စေတဲ့ အကျင့်ဆိုးတွေကို ရဲရဲဝံ့ဝံ့ စွန့်လွှတ်တာပါ။ နောက်ဆုံး စတုတ္ထတစ်ခုကတော့ လက်ခံခြင်း (Accepting) ဖြစ်ပါတယ်။ ကျွန်တော်တို့ ဘဝမှာ ကိုယ်တိုင် ပြောင်းလဲလို့မရတဲ့ အရာတွေ၊ ဥပမာ- ကုမ္ပဏီရဲ့ မူဝါဒတွေ၊ ဒါမှမဟုတ် အထက်လူကြီးရဲ့ ပြောင်းလဲလို့ မရတဲ့ စရိုက်လက္ခဏာတွေကို အလကားနေရင်း ဒေါသထွက်ပြီး အချိန်ဖြုန်းနေမယ့် အစား အရှိကို အရှိအတိုင်း လက်ခံပြီး ရှေ့ဆက်နိုင်ဖို့ လိုအပ်တယ်ဆိုတာကို ဒီပြောင်းလဲခြင်း စက်ဝိုင်းကနေတဆင့် သွန်သင်ပေးထားပါတယ်။</p><တတိယမြောက် အထင်ရှားဆုံးနဲ့ ဒီစာအုပ်ရဲ့ အသက်သွေးကြောလို့ ခေါ်ဆိုနိုင်တဲ့ အချက်ကတော့  **တက်ကြွသော မေးခွန်းများ (Active Questions)** ရဲ့ အသုံးဝင်မှုပဲ ဖြစ်ပါတယ်။ ပုံမှန်အားဖြင့် ကျွန်တော်တို့ဟာ ကိုယ့်ကိုယ်ကိုယ် ဆန်းစစ်တဲ့အခါ "ငါ ဒီနေ့ ရည်မှန်းချက်တွေ ပြည့်မီခဲ့ရဲ့လား" ဆိုတဲ့ Passive မေးခွန်းမျိုးကိုသာ မေးလေ့ရှိပါတယ်။ အဲဒီလို မေးတဲ့အခါ အဖြေက မပြည့်မီဘူးဆိုရင် ကျွန်တော်တို့ ဦးနှောက်က အလိုလို ဆင်ခြေတွေ ရှာပါတော့တယ်။ "ဒီနေ့ ရာသီဥတု မကောင်းလို့၊ အလုပ်မှာ Boss က အလုပ်တွေ ပုံပေးလိုက်လို့" စသဖြင့် ပတ်ဝန်းကျင်ကို အပြစ်တင်တတ်ကြပါတယ်။ ဒီနေရာမှာ စာရေးသူက အဲဒီမေးခွန်းတွေကို Active Questions တွေအဖြစ် ပြောင်းလဲပစ်ဖို့ အကြံပြုထားပါတယ်။ ဆိုလိုတာက "ငါ ဒီနေ့ ရည်မှန်းချက်တွေ ပြည့်မီဖို့အတွက် **ငါ့ဘက်က အကောင်းဆုံး ကြိုးစားခဲ့ရဲ့လား** (Did I do my best to...)" ဆိုပြီး ပြောင်းမေးရမှာ ဖြစ်ပါတယ်။ ဒီလို ပြောင်းမေးလိုက်တဲ့အတွက် ကြောင့်မို့လို့ အပြစ်တင်စရာ ဆင်ခြေပေးစရာ လမ်းကြောင်း ပိတ်သွားပြီး မိမိရဲ့ တာဝန်ယူမှု၊ တာဝန်ခံမှု အပြည့်အဝ ရှိလာစေပါတယ်။ ကိုယ် အကောင်းဆုံး မကြိုးစားခဲ့ဘူးဆိုရင် ကိုယ့်အမှားပဲ ဖြစ်တဲ့အတွက် နောက်နေ့တွေမှာ ပိုပြီး သတိထား ကြိုးစားလာအောင် တွန်းအားပေးရာ ရောက်ပါတယ်။ ဒီအတွေးအခေါ်ဟာ သိပ်ကို ရိုးရှင်းပေမဲ့ အလွန်တရာ အစွမ်းထက်တဲ့ ပြောင်းလဲမှု တစ်ခု ဖြစ်တယ်ဆိုတာကို ကျွန်တော်တို့ လက်ခံရမှာ ဖြစ်ပါတယ်။နောက်ဆုံး စတုတ္ထမြောက် အရေးကြီးတဲ့ အယူအဆတစ်ခုကတော့ အချိန်တိုင်းမှာ ကိုယ့်ကိုယ်ကိုယ် ပြန်မေးရမယ့် **AIWATT မေးခွန်း** ပဲ ဖြစ်ပါတယ်။ AIWATT ဆိုတာကတော့ "Am I willing, at this time, to make the investment required to make a positive difference on this topic?" (ဒီကိစ္စနဲ့ ပတ်သက်ပြီး အကောင်းမြင်နိုင်တဲ့ အပြောင်းအလဲတစ်ခု ဖြစ်လာဖို့အတွက် အခုအချိန်မှာ ငါ့ဘက်က လိုအပ်တဲ့အချိန်နဲ့ခွန်အားတွေကို ရင်းနှီးမြှုပ်နှံဖို့ ဆန္ဒရှိရဲ့လား) ဆိုတာပဲ ဖြစ်ပါတယ်။ အထူးသဖြင့် အလုပ်ခွင်မှာ လုပ်ဖော်ကိုင်ဖက် တစ်ယောက်ယောက်က ကိုယ့်ကို စိတ်အနှောင့်အယှက် ဖြစ်အောင် ပြောလာတဲ့အခါ ချက်ချင်း ဒေါသတကြီး တုံ့ပြန်တော့မယ့် အစား ဒီမေးခွန်းလေးကို ကိုယ့်ကိုယ်ကိုယ် အရင်မေးကြည့်ဖို့ လိုပါတယ်။ ငါ အခု ငြင်းခုံလိုက်လို့ ဘာအကျိုးအမြတ် ရလာမှာလဲ၊ ပြဿနာ ပိုကြီးသွားမလား၊ ငါ့ရဲ့ တန်ဖိုးရှိတဲ့ အချိန်တွေ၊ စွမ်းအင်တွေ ဆုံးရှုံးခံပြီး ဒီပြဿနာကို ဖြေရှင်းဖို့ တကယ်ပဲ တန်ရဲ့လား ဆိုတာကို စဉ်းစားလိုက်တာနဲ့ မလိုအပ်တဲ့ ပဋိပက္ခ အများစုကို ရှောင်လွှဲနိုင်သွားမှာ ဖြစ်ပါတယ်။ ဒါဟာ မိမိကိုယ်ကိုယ် ထိန်းချုပ်ခြင်း (Self-control) ကို အမြင့်ဆုံး အဆင့်အထိ တည်ဆောက်ပေးနိုင်တဲ့ လေ့ကျင့်ခန်း တစ်ခုပဲ ဖြစ်ပါတယ်။</p>'

                cover: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800",
                audio: "audio/jab-jab-jab-right-hook.mp3",
                summaryHeading: "<h2>Key Insights</h2>",
                summaryParagraphs: [
                    "<h3>Main Idea</h3><p>Placeholder summary. Add lessons on delivering value repeatedly before asking for the sale.</p>",
                    "<h4>Practical Takeaway</h4><p>Give context-native value, then make a clear ask.</p>"
                ]
            }
        };

        const params = new URLSearchParams(window.location.search);
        const key = params.get("book");
        const selectedBook = books[key];
        const audioElement = document.getElementById("bookAudio");
        const durationText = document.getElementById("durationText");
        const progressValue = document.getElementById("progressValue");
        const summaryHeading = document.getElementById("summaryHeading");
        const summaryContent = document.getElementById("summaryContent");
        const audioStatus = document.getElementById("audioStatus");
        const playPauseBtn = document.getElementById("playPauseBtn");

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function sanitizeRichHtml(html) {
            const template = document.createElement("template");
            const allowedTags = new Set(["P", "H2", "H3", "H4", "A", "UL", "OL", "LI", "STRONG", "EM", "BR"]);
            const allowedHrefPattern = /^(https?:\/\/|mailto:|\/|#)/i;
            template.innerHTML = html;

            function walk(node) {
                Array.from(node.childNodes).forEach(function (child) {
                    if (child.nodeType === Node.ELEMENT_NODE) {
                        const tag = child.tagName;
                        if (!allowedTags.has(tag)) {
                            const fragment = document.createDocumentFragment();
                            while (child.firstChild) {
                                fragment.appendChild(child.firstChild);
                            }
                            child.replaceWith(fragment);
                            walk(node);
                            return;
                        }

                        Array.from(child.attributes).forEach(function (attr) {
                            const name = attr.name.toLowerCase();
                            if (tag === "A") {
                                if (name !== "href" && name !== "target" && name !== "rel") {
                                    child.removeAttribute(attr.name);
                                }
                            } else {
                                child.removeAttribute(attr.name);
                            }
                        });

                        if (tag === "A") {
                            const href = child.getAttribute("href") || "#";
                            if (!allowedHrefPattern.test(href)) {
                                child.setAttribute("href", "#");
                            }
                            if (child.getAttribute("target") === "_blank" && !child.getAttribute("rel")) {
                                child.setAttribute("rel", "noopener noreferrer");
                            }
                        }
                    }
                    walk(child);
                });
            }

            walk(template.content);
            return template.innerHTML;
        }

        function hasHtml(value) {
            return /<[^>]+>/.test(value);
        }

        function htmlWithMarkdownBold(value) {
            return String(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        }

        function plainTextToRichHtml(value) {
            const parts = String(value).split(/\*\*(.+?)\*\*/g);
            return parts
                .map(function (part, index) {
                    if (index % 2 === 1) {
                        return "<strong>" + escapeHtml(part) + "</strong>";
                    }
                    return escapeHtml(part);
                })
                .join("");
        }

        function renderSummary(book) {
            const heading = (book && book.summaryHeading) ? book.summaryHeading : "Key Insights";
            const paragraphs = (book && Array.isArray(book.summaryParagraphs) && book.summaryParagraphs.length > 0)
                ? book.summaryParagraphs
                : [
                    "This summary is a placeholder for " + (book ? book.title : "this book") + ". Add unique summary text in the book object inside summary.html.",
                    "For each book, provide summaryHeading and summaryParagraphs so title, heading, and paragraphs are managed in one place."
                ];

            const headingIsHtml = hasHtml(heading);
            summaryHeading.classList.toggle("hidden", headingIsHtml);
            if (!headingIsHtml) {
                summaryHeading.innerHTML = plainTextToRichHtml(heading);
            }

            const contentBlocks = [];
            if (headingIsHtml) {
                contentBlocks.push(sanitizeRichHtml(htmlWithMarkdownBold(heading)));
            }

            paragraphs.forEach(function (paragraph) {
                if (hasHtml(paragraph)) {
                    contentBlocks.push(sanitizeRichHtml(htmlWithMarkdownBold(paragraph)));
                } else {
                    contentBlocks.push("<p>" + plainTextToRichHtml(paragraph) + "</p>");
                }
            });

            summaryContent.innerHTML = contentBlocks.join("");
        }

        if (selectedBook) {
            document.getElementById("bookTitle").textContent = selectedBook.title;
            document.getElementById("bookAuthor").textContent = selectedBook.author;
            const descEl = document.getElementById("bookDescription");
            descEl.textContent = selectedBook.description || "";
            descEl.classList.toggle("hidden", !selectedBook.description);
            document.getElementById("bookCover").src = selectedBook.cover;
            document.getElementById("bookCover").alt = selectedBook.title + " cover";
            document.title = "Phath Mat Tway | " + selectedBook.title;
            const defaultAudioSrc = "audio/" + key + ".mp3";
            audioElement.src = selectedBook.audio || defaultAudioSrc;
            renderSummary(selectedBook);
        } else {
            const descEl = document.getElementById("bookDescription");
            descEl.textContent = "";
            descEl.classList.add("hidden");
            renderSummary(null);
        }

        function setAudioStatus(message) {
            if (!audioStatus) return;
            audioStatus.textContent = message || "";
            audioStatus.classList.toggle("hidden", !message);
        }

        function setPlayableState({ playable }) {
            playPauseBtn.disabled = !playable;
            playPauseBtn.setAttribute("aria-disabled", playable ? "false" : "true");
            playPauseBtn.style.opacity = playable ? "" : "0.5";
            playPauseBtn.style.cursor = playable ? "" : "not-allowed";
        }

        if (selectedBook) {
            setPlayableState({ playable: true });
            setAudioStatus("");
        } else {
            setPlayableState({ playable: false });
            setAudioStatus("Unknown book. Please open this page from the library links.");
            durationText.textContent = "";
        }

        playPauseBtn.addEventListener("click", function () {
            if (!audioElement.src) {
                return;
            }
            if (audioElement.paused) {
                audioElement.play().catch(function () {
                    playPauseBtn.textContent = "▶";
                });
            } else {
                audioElement.pause();
            }
        });

        audioElement.addEventListener("play", function () {
            playPauseBtn.textContent = "⏸";
        });

        audioElement.addEventListener("pause", function () {
            playPauseBtn.textContent = "▶";
        });

        audioElement.addEventListener("loadedmetadata", function () {
            if (!isNaN(audioElement.duration) && audioElement.duration > 0) {
                const minutes = Math.ceil(audioElement.duration / 60);
                durationText.textContent = minutes + " min";
            }
        });

        audioElement.addEventListener("timeupdate", function () {
            if (audioElement.duration > 0) {
                const percent = (audioElement.currentTime / audioElement.duration) * 100;
                progressValue.style.width = percent + "%";
            }
        });

        audioElement.addEventListener("error", function () {
            // Common causes: file missing, wrong path, server not serving static files.
            setPlayableState({ playable: false });
            setAudioStatus("Audio file not found. Add the MP3 in the `audio/` folder or fix the `audio:` path in summary.html.");
            playPauseBtn.textContent = "▶";
            durationText.textContent = "";
            progressValue.style.width = "0%";
        });
    </script>
</body>
</html>
