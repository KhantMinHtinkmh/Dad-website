<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside Lab MM | Deep Dive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="summary.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="pb-36">
    <header class="top-bar sticky top-0 z-20 bg-white/90 border-b border-slate-200">
        <div class="max-w-5xl mx-auto h-16 px-4 md:px-6 grid grid-cols-3 items-center">
            <a href="index.html" class="text-sm md:text-base text-indigo-600 font-700 hover:underline justify-self-start">Back to Library</a>
            <div class="text-center text-sm md:text-base font-800 tracking-wide">INSIDE LAB MM</div>
            <div></div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 md:px-6 py-10 md:py-14">
        <section class="text-center mb-10">
            <img id="bookCover" class="book-cover mx-auto mb-5" src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=800" alt="Book cover">
            <h1 id="bookTitle" class="text-3xl md:text-4xl font-800 mb-2">Book Title Placeholder</h1>
            <p id="bookAuthor" class="text-lg italic text-slate-500">Author Name Placeholder</p>
        </section>

        <section class="bg-white rounded-2xl border border-slate-200 p-6 md:p-8">
            <h2 id="summaryHeading" class="text-2xl md:text-3xl font-800 text-slate-900 mb-6">Key Insights</h2>
            <article id="summaryContent" class="reading-mode"></article>
        </section>
    </main>

    <aside class="audio-player fixed bottom-0 left-0 right-0 z-30">
        <div class="max-w-5xl mx-auto px-4 md:px-6 py-3 md:py-4 flex items-center gap-4">
            <button id="playPauseBtn" class="play-btn" aria-label="Play or pause summary audio">▶</button>
            <div class="flex-1">
                <div class="progress-track">
                    <div id="progressValue" class="progress-value"></div>
                </div>
            </div>
            <span id="durationText" class="text-sm font-700 text-indigo-600">15 min</span>
        </div>
        <audio id="bookAudio" preload="metadata"></audio>
    </aside>

    <script>
        const books = {
            // Add each book summary directly here for easy maintenance:
            // "book-slug": {
            //   title: "Book Title",
            //   author: "Author Name",
            //   cover: "IMAGE_URL",
            //   audio: "audio/book-slug.mp3",
            //   summaryHeading: "Key Insights",
            //   summaryParagraphs: ["Paragraph 1...", "Paragraph 2..."]
            // },
            "the-coaching-habit": {
                title: "The Coaching Habit",
                author: "Michael Bungay Stanier",
                cover: "https://images.unsplash.com/photo-1553729459-efe14ef6055d?q=80&w=800",
                audio: "audio/the-coaching-habit.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "The Coaching Habit teaches leaders to coach through short, high-impact questions instead of long advice. The book helps teams think for themselves and improves ownership in everyday decisions.",
                    "Its central idea is simple: stay curious longer. By asking better questions consistently, managers reduce dependency and create a culture where people solve problems with more confidence."
                ]
            },
            "trillion-dollar-coach": {
                title: "Trillion Dollar Coach",
                author: "Eric Schmidt",
                cover: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=800",
                audio: "audio/trillion-dollar-coach.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Trillion Dollar Coach shows how leadership is amplified when managers invest in people, not just metrics. Bill Campbell's influence came from trust, direct feedback, and commitment to team success.",
                    "The book highlights that elite performance cultures are built on care and accountability together. Leaders who coach with consistency create stronger collaboration and better long-term decisions."
                ]
            },
            "coaching-for-performance": {
                title: "Coaching for Performance",
                author: "John Whitmore",
                cover: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=800",
                audio: "audio/coaching-for-performance.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Coaching for Performance introduces the GROW model to guide focused coaching conversations: Goal, Reality, Options, and Will. This structure helps people clarify direction and commit to action.",
                    "The core lesson is that awareness and responsibility drive growth. When individuals define their own path instead of receiving instructions, motivation rises and performance becomes sustainable."
                ]
            },
            "zero-to-one": {
                title: "Zero to One",
                author: "Peter Thiel",
                cover: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=800",
                audio: "audio/zero-to-one.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Zero to One argues that real progress comes from creating something new, not copying existing businesses. Great companies move from zero to one by solving hard, meaningful problems.",
                    "Thiel emphasizes independent thinking, defensible advantages, and long-term strategy. The best startups avoid crowded competition and instead build unique value that compounds over time."
                ]
            },
            "the-lean-startup": {
                title: "The Lean Startup",
                author: "Eric Ries",
                cover: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800",
                audio: "audio/the-lean-startup.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "The Lean Startup teaches founders to validate ideas quickly through small experiments instead of betting everything on assumptions. Build-measure-learn is the central loop for faster progress.",
                    "By releasing minimum viable products and tracking actionable metrics, teams reduce waste and adapt faster to customer needs. Learning speed becomes a core competitive advantage."
                ]
            },
            "good-to-great": {
                title: "Good to Great",
                author: "Jim Collins",
                cover: "https://images.unsplash.com/photo-1454165833267-028cc21e767c?q=80&w=800",
                audio: "audio/good-to-great.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Good to Great examines why only some companies sustain exceptional performance. Collins highlights disciplined people, disciplined thought, and disciplined action as core transformation drivers.",
                    "Concepts like Level 5 Leadership and the Hedgehog Concept help organizations focus on what they can do best. Long-term excellence comes from consistency, not one-time breakthroughs."
                ]
            },
            "thinking-fast-and-slow": {
                title: "Thinking, Fast and Slow",
                author: "Daniel Kahneman",
                cover: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?q=80&w=800",
                audio: "audio/thinking-fast-and-slow.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Kahneman explains two systems of thinking: fast, intuitive reactions and slow, analytical reasoning. Many judgment errors happen when fast thinking dominates without enough reflection.",
                    "The book helps readers identify biases like overconfidence and anchoring. Better decisions come from pausing, checking assumptions, and using structured thinking in high-stakes moments."
                ]
            },
            "influence": {
                title: "Influence",
                author: "Robert Cialdini",
                cover: "https://images.unsplash.com/photo-1575402511411-9e7939339396?q=80&w=800",
                audio: "audio/influence.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Influence breaks persuasion into key principles such as reciprocity, social proof, authority, and scarcity. Understanding these patterns helps people communicate more effectively and ethically.",
                    "Cialdini shows that influence works best when trust and relevance are present. Readers can apply the principles to sales, leadership, and negotiation while avoiding manipulation."
                ]
            },
            "flow": {
                title: "Flow",
                author: "Mihaly Csikszentmihalyi",
                cover: "https://images.unsplash.com/photo-1499209974431-9dac3adaf471?q=80&w=800",
                audio: "audio/flow.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Flow describes the optimal mental state where challenge and skill are balanced. In this state, focus deepens, time feels different, and work becomes intrinsically rewarding.",
                    "The book encourages designing tasks with clear goals and immediate feedback. By reducing distractions and increasing meaningful challenge, people can access flow more consistently."
                ]
            },
            "atomic-habits": {
                title: "Atomic Habits",
                author: "James Clear",
                cover: "https://images.unsplash.com/photo-1481627834876-b7833e8f5570?q=80&w=800",
                audio: "audio/atomic-habits.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Atomic Habits shows how tiny changes produce major results through compounding. Instead of chasing motivation, the book focuses on identity-based habits and simple systems.",
                    "Clear's framework makes habits obvious, attractive, easy, and satisfying. Progress becomes reliable when the environment supports behavior and tracking reinforces consistency."
                ]
            },
            "mindset": {
                title: "Mindset",
                author: "Carol S. Dweck",
                cover: "https://images.unsplash.com/photo-1506784365847-bbad939e9335?q=80&w=800",
                audio: "audio/mindset.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Mindset contrasts fixed mindset with growth mindset. People with growth mindset treat ability as developable through effort, feedback, and deliberate practice.",
                    "This shift changes how we respond to failure and challenge. By praising process over talent, individuals and teams become more resilient and more likely to improve."
                ]
            },
            "seven-habits": {
                title: "The 7 Habits of Highly Effective People",
                author: "Stephen R. Covey",
                cover: "https://images.unsplash.com/photo-1455390582262-044cdead277a?q=80&w=800",
                audio: "audio/seven-habits.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "The 7 Habits presents a principle-centered framework for personal and professional effectiveness. It begins with personal responsibility and expands to collaboration and renewal.",
                    "Covey's habits, like putting first things first and seeking win-win outcomes, help align daily behavior with long-term values. The result is disciplined, trustworthy leadership."
                ]
            },
            "digital-minimalism": {
                title: "Digital Minimalism",
                author: "Cal Newport",
                cover: "https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800",
                audio: "audio/digital-minimalism.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Digital Minimalism encourages intentional technology use instead of constant connectivity. The goal is to choose tools that clearly support values, not tools that quietly consume attention.",
                    "Newport suggests regular reflection, focused work blocks, and offline hobbies. These habits help users regain concentration and design a healthier relationship with digital life."
                ]
            },
            "deep-work": {
                title: "Deep Work",
                author: "Cal Newport",
                cover: "https://images.unsplash.com/photo-1519389950473-47ba0277781c?q=80&w=800",
                audio: "audio/deep-work.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Deep Work argues that focused, distraction-free concentration is a superpower in the modern economy. High-value output comes from depth, not constant task switching.",
                    "Newport recommends scheduling focus blocks, reducing shallow work, and protecting attention as a strategic asset. Mastery and productivity increase when depth becomes a daily practice."
                ]
            },
            "irresistible": {
                title: "Irresistible",
                author: "Adam Alter",
                cover: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=800",
                audio: "audio/irresistible.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Irresistible explores how modern products are engineered to capture attention and create habitual use. The book explains the psychology behind compulsive digital behaviors.",
                    "Alter offers practical strategies to regain control, including friction design, clear boundaries, and intentional routines. Awareness plus structure helps users avoid digital overuse."
                ]
            },
            "subtle-art": {
                title: "The Subtle Art of Not Giving a F*ck",
                author: "Mark Manson",
                cover: "https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=800",
                audio: "audio/subtle-art.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "This book argues that a meaningful life comes from choosing values carefully, not chasing constant positivity. We cannot care about everything, so priorities matter.",
                    "Manson encourages responsibility, honest self-assessment, and acceptance of discomfort. Growth comes from solving better problems, not avoiding all problems."
                ]
            },
            "you-are-a-badass": {
                title: "You Are a Badass",
                author: "Jen Sincero",
                cover: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?q=80&w=800",
                audio: "audio/you-are-a-badass.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "You Are a Badass combines mindset coaching with practical motivation to help readers act on goals. The tone is energetic, but the core message is clear: beliefs shape outcomes.",
                    "By replacing self-doubt with intentional action and consistent habits, readers build confidence through execution. Momentum grows when action becomes daily, not occasional."
                ]
            },
            "awaken-the-giant-within": {
                title: "Awaken the Giant Within",
                author: "Tony Robbins",
                cover: "https://images.unsplash.com/photo-1474932430478-367dbb6832c1?q=80&w=800",
                audio: "audio/awaken-the-giant-within.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Tony Robbins focuses on personal transformation through decisions, beliefs, and emotional control. Lasting change begins when people raise standards and commit to consistent action.",
                    "The book introduces practical tools for reconditioning habits, improving communication, and designing life direction. Small daily shifts can produce major long-term change."
                ]
            },
            "to-sell-is-human": {
                title: "To Sell Is Human",
                author: "Daniel H. Pink",
                cover: "https://images.unsplash.com/photo-1556740738-b6a63e27c4df?q=80&w=800",
                audio: "audio/to-sell-is-human.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "To Sell Is Human reframes selling as a universal skill used in leadership, teaching, and everyday persuasion. Everyone moves ideas, not just sales professionals.",
                    "Pink emphasizes empathy, clarity, and service-oriented communication. Effective selling today is less about pressure and more about helping others make better decisions."
                ]
            },
            "influence-sales": {
                title: "Influence",
                author: "Robert B. Cialdini",
                cover: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800",
                audio: "audio/influence-sales.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "In sales contexts, Influence explains why buyers respond to authority, social proof, and scarcity cues. The framework helps professionals present offers with stronger psychological relevance.",
                    "The key is ethical application. When persuasion is anchored in genuine value and trust, conversion improves while long-term customer relationships stay strong."
                ]
            },
            "building-a-storybrand": {
                title: "Building a StoryBrand",
                author: "Donald Miller",
                cover: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=800",
                audio: "audio/building-a-storybrand.mp3",
                summaryHeading: "Key Insights",
                summaryParagraphs: [
                    "Building a StoryBrand teaches businesses to clarify messaging by making the customer the hero and the brand the guide. Clear narrative positioning improves marketing performance.",
                    "Miller's framework simplifies communication around problem, plan, and success. When messaging is direct and outcome-focused, customers understand faster and engage more confidently."
                ]
            }
        };

        const params = new URLSearchParams(window.location.search);
        const key = params.get("book");
        const selectedBook = books[key];
        const audioElement = document.getElementById("bookAudio");
        const durationText = document.getElementById("durationText");
        const progressValue = document.getElementById("progressValue");
        const summaryHeading = document.getElementById("summaryHeading");
        const summaryContent = document.getElementById("summaryContent");

        function renderSummary(book) {
            const heading = (book && book.summaryHeading) ? book.summaryHeading : "Key Insights";
            const paragraphs = (book && Array.isArray(book.summaryParagraphs) && book.summaryParagraphs.length > 0)
                ? book.summaryParagraphs
                : [
                    "This summary is a placeholder for " + (book ? book.title : "this book") + ". Add unique summary text in the book object inside summary.html.",
                    "For each book, provide summaryHeading and summaryParagraphs so title, heading, and paragraphs are managed in one place."
                ];

            summaryHeading.textContent = heading;
            summaryContent.innerHTML = paragraphs.map(function (paragraph) {
                return "<p>" + paragraph + "</p>";
            }).join("");
        }

        if (selectedBook) {
            document.getElementById("bookTitle").textContent = selectedBook.title;
            document.getElementById("bookAuthor").textContent = selectedBook.author;
            document.getElementById("bookCover").src = selectedBook.cover;
            document.getElementById("bookCover").alt = selectedBook.title + " cover";
            document.title = "Inside Lab MM | " + selectedBook.title;
            audioElement.src = selectedBook.audio;
            renderSummary(selectedBook);
        } else {
            renderSummary(null);
        }

        const playPauseBtn = document.getElementById("playPauseBtn");
        playPauseBtn.addEventListener("click", function () {
            if (!audioElement.src) {
                return;
            }
            if (audioElement.paused) {
                audioElement.play().catch(function () {
                    playPauseBtn.textContent = "▶";
                });
            } else {
                audioElement.pause();
            }
        });

        audioElement.addEventListener("play", function () {
            playPauseBtn.textContent = "⏸";
        });

        audioElement.addEventListener("pause", function () {
            playPauseBtn.textContent = "▶";
        });

        audioElement.addEventListener("loadedmetadata", function () {
            if (!isNaN(audioElement.duration) && audioElement.duration > 0) {
                const minutes = Math.ceil(audioElement.duration / 60);
                durationText.textContent = minutes + " min";
            }
        });

        audioElement.addEventListener("timeupdate", function () {
            if (audioElement.duration > 0) {
                const percent = (audioElement.currentTime / audioElement.duration) * 100;
                progressValue.style.width = percent + "%";
            }
        });
    </script>
</body>
</html>
