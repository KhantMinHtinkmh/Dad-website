<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/assets/logo%20icon.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="/assets/logo%20icon.jpg">
    <meta name="description" content="Explore concise book summaries, key takeaways, and practical lessons from Phat Hmat Tway.">
    <meta property="og:title" content="Phat Hmat Tway | Deep Dive">
    <meta property="og:description" content="Explore concise book summaries, key takeaways, and practical lessons from Phat Hmat Tway.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=800">
    <title>Phat Hmat Tway | Deep Dive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="summary.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="seo.js"></script>
    <script type="module" src="summary-script.js"></script>
</head>
<body class="pb-36">
    <header class="top-bar sticky top-0 z-20 bg-white/90 border-b border-slate-200">
        <div class="max-w-5xl mx-auto h-16 px-3 md:px-4 grid grid-cols-3 items-center">
            <a href="index.html" class="text-sm md:text-base text-indigo-600 font-700 hover:underline justify-self-start">Back to Library Home</a>
            <div class="text-center text-sm md:text-base font-800 tracking-wide">PHAT HMAT TWAY</div>
            <label for="readingModeToggle" class="reading-switch justify-self-end">
                <input id="readingModeToggle" type="checkbox" aria-label="Toggle reading mode">
                <span>Reading mode</span>
            </label>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-3 md:px-4 py-10 md:py-14">
        <section class="text-center mb-10">
            <img id="bookCover" class="book-cover mx-auto mb-5" src="https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=800" alt="Book Title summary cover" loading="lazy" decoding="async" width="200" height="300">
            <h1 id="bookTitle" class="text-3xl md:text-4xl font-800 mb-2">Book Title Placeholder</h1>
            <p id="bookAuthor" class="text-lg italic text-slate-500 mb-4">Author Name Placeholder</p>
            <h3 class="text-lg font-700 text-slate-800 mb-3 max-w-2xl mx-auto">စာအုပ်အကြောင်း အကျဉ်းချုပ် ဖော်ပြချက်</h3>
            <div id="bookDescriptionWrapper" class="bg-slate-50 rounded-lg p-4 mb-8 max-w-2xl mx-auto border border-slate-200">
                <p id="bookDescription" class="text-sm md:text-base text-slate-700 leading-relaxed">Short description placeholder.</p>
            </div>
        </section>

        <section class="bg-white rounded-2xl border border-slate-200 p-4 md:p-5">
            <h2 id="summaryHeading" class="text-2xl md:text-3xl font-800 text-slate-900 mb-6">Key Insights</h2>
            <article id="summaryContent" class="reading-mode"></article>
        </section>
    </main>

    <aside class="audio-player fixed bottom-0 left-0 right-0 z-30">
        <div class="max-w-5xl mx-auto px-3 md:px-4 py-3 md:py-4 flex items-center gap-4">
            <button id="playPauseBtn" class="play-btn" aria-label="Play or pause summary audio">▶</button>
            <div class="flex-1">
                <div class="progress-track">
                    <div id="progressValue" class="progress-value"></div>
                </div>
            </div>
            <span id="durationText" class="text-sm font-700 text-indigo-600">15 min</span>
        </div>
        <div class="max-w-5xl mx-auto px-3 md:px-4 pb-3 md:pb-4">
            <div id="audioStatus" class="text-xs md:text-sm font-700 text-slate-600 hidden"></div>
        </div>
        <audio id="bookAudio" preload="metadata"></audio>
    </aside>

    <script>
       
 
        function slugify(value) {
            return String(value || "")
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");
        }

        function getPathBookSlug() {
            const parts = window.location.pathname.split("/").filter(Boolean);
            if (parts.length >= 2 && parts[parts.length - 2] === "summary") {
                return parts[parts.length - 1];
            }
            if (parts.length >= 2 && parts[0] === "summary") {
                return parts[1];
            }
            return "";
        }

        function normalizeLookupValue(value) {
            if (!value) return "";
            try {
                return decodeURIComponent(String(value)).trim().toLowerCase();
            } catch (error) {
                return String(value).trim().toLowerCase();
            }
        }

        function buildBookLookupMap(catalog) {
            const map = new Map();
            Object.keys(catalog).forEach(function (bookKey) {
                const book = catalog[bookKey];
                const title = book && book.title ? book.title : bookKey;
                const slug = book && book.slug ? book.slug : slugify(title);
                map.set(normalizeLookupValue(bookKey), bookKey);
                map.set(normalizeLookupValue(title), bookKey);
                map.set(normalizeLookupValue(slug), bookKey);
            });
            return map;
        }

        function inferGenre(bookKey, book) {
            const fingerprint = ((bookKey || "") + " " + (book && book.title ? book.title : "")).toLowerCase();
            if (/marketing|sell|brand|startup|business|b2b/.test(fingerprint)) return "Business";
            if (/parent|toddler|family|montessori/.test(fingerprint)) return "Parenting";
            if (/digital|internet|ai|technology|shallows|hooked|indistractable/.test(fingerprint)) return "Digital Lifestyle";
            if (/psychology|habit|influence|emotional|thinking/.test(fingerprint)) return "Psychology";
            if (/coach|leaders|multipliers|triggers/.test(fingerprint)) return "Coaching";
            return "Personal Growth";
        }

        function buildCanonicalBookUrl(bookSlug) {
            const origin = window.location.origin && window.location.origin !== "null" ? window.location.origin : "";
            if (!bookSlug) return window.location.href;
            if (origin) return origin + "/summary/" + encodeURIComponent(bookSlug);
            return "summary.html?book=" + encodeURIComponent(bookSlug);
        }

        function extractPlainText(value) {
            const node = document.createElement("div");
            node.innerHTML = String(value || "");
            return (node.textContent || "").trim();
        }

        const params = new URLSearchParams(window.location.search);
        const requestedBook = params.get("book");
        const pathBookSlug = getPathBookSlug();
        const bookLookupMap = buildBookLookupMap(books);
        const resolvedBookKey = bookLookupMap.get(normalizeLookupValue(requestedBook))
            || bookLookupMap.get(normalizeLookupValue(pathBookSlug))
            || "";
        const selectedBook = resolvedBookKey ? books[resolvedBookKey] : null;
        const audioElement = document.getElementById("bookAudio");
        const durationText = document.getElementById("durationText");
        const progressValue = document.getElementById("progressValue");
        const summaryHeading = document.getElementById("summaryHeading");
        const summaryContent = document.getElementById("summaryContent");
        const audioStatus = document.getElementById("audioStatus");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const readingModeToggle = document.getElementById("readingModeToggle");

        function applyReadingMode(enabled) {
            document.body.classList.toggle("reading-mode-on", enabled);
        }

        const savedReadingMode = localStorage.getItem("summaryReadingMode") === "on";
        applyReadingMode(savedReadingMode);
        if (readingModeToggle) {
            readingModeToggle.checked = savedReadingMode;
            readingModeToggle.addEventListener("change", function () {
                const enabled = readingModeToggle.checked;
                applyReadingMode(enabled);
                localStorage.setItem("summaryReadingMode", enabled ? "on" : "off");
            });
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function sanitizeRichHtml(html) {
            const template = document.createElement("template");
            const allowedTags = new Set(["P", "H2", "H3", "H4", "A", "UL", "OL", "LI", "STRONG", "EM", "BR"]);
            const allowedHrefPattern = /^(https?:\/\/|mailto:|\/|#)/i;
            template.innerHTML = html;

            function walk(node) {
                Array.from(node.childNodes).forEach(function (child) {
                    if (child.nodeType === Node.ELEMENT_NODE) {
                        const tag = child.tagName;
                        if (!allowedTags.has(tag)) {
                            const fragment = document.createDocumentFragment();
                            while (child.firstChild) {
                                fragment.appendChild(child.firstChild);
                            }
                            child.replaceWith(fragment);
                            walk(node);
                            return;
                        }

                        Array.from(child.attributes).forEach(function (attr) {
                            const name = attr.name.toLowerCase();
                            if (tag === "A") {
                                if (name !== "href" && name !== "target" && name !== "rel") {
                                    child.removeAttribute(attr.name);
                                }
                            } else {
                                child.removeAttribute(attr.name);
                            }
                        });

                        if (tag === "A") {
                            const href = child.getAttribute("href") || "#";
                            if (!allowedHrefPattern.test(href)) {
                                child.setAttribute("href", "#");
                            }
                            if (child.getAttribute("target") === "_blank" && !child.getAttribute("rel")) {
                                child.setAttribute("rel", "noopener noreferrer");
                            }
                        }
                    }
                    walk(child);
                });
            }

            walk(template.content);
            return template.innerHTML;
        }

        function hasHtml(value) {
            return /<[^>]+>/.test(value);
        }

        function normalizeMarkdownBold(value) {
            // Support both **bold** and ****bold**** by normalizing 4 stars -> 2 stars.
            return String(value).replace(/\*{4}([\s\S]+?)\*{4}/g, "**$1**");
        }

        function htmlWithMarkdownBold(value) {
            return normalizeMarkdownBold(value).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        }

        function plainTextToRichHtml(value) {
            const parts = normalizeMarkdownBold(value).split(/\*\*(.+?)\*\*/g);
            return parts
                .map(function (part, index) {
                    if (index % 2 === 1) {
                        return "<strong>" + escapeHtml(part) + "</strong>";
                    }
                    return escapeHtml(part);
                })
                .join("");
        }

        function renderSummary(book) {
            const heading = (book && book.summaryHeading) ? book.summaryHeading : "Key Insights";
            const paragraphs = (book && Array.isArray(book.summaryParagraphs) && book.summaryParagraphs.length > 0)
                ? book.summaryParagraphs
                : [
                    "This summary is a placeholder for " + (book ? book.title : "this book") + ". Add unique summary text in the book object inside summary.html.",
                    "For each book, provide summaryHeading and summaryParagraphs so title, heading, and paragraphs are managed in one place."
                ];

            const normalizedHeading = hasHtml(heading) ? extractPlainText(sanitizeRichHtml(heading)) : heading;
            summaryHeading.textContent = normalizedHeading || "Key Takeaways";
            summaryHeading.classList.remove("hidden");

            const contentBlocks = [];

            paragraphs.forEach(function (paragraph) {
                if (hasHtml(paragraph)) {
                    contentBlocks.push(sanitizeRichHtml(htmlWithMarkdownBold(paragraph)));
                } else {
                    contentBlocks.push("<p>" + plainTextToRichHtml(paragraph) + "</p>");
                }
            });

            summaryContent.innerHTML = contentBlocks.join("");
        }

        if (selectedBook) {
            document.getElementById("bookTitle").textContent = selectedBook.title;
            document.getElementById("bookAuthor").textContent = selectedBook.author;
            const descEl = document.getElementById("bookDescription");
            descEl.innerHTML = plainTextToRichHtml(selectedBook.description || "");
            descEl.classList.toggle("hidden", !selectedBook.description);
            document.getElementById("bookCover").src = selectedBook.cover;
            document.getElementById("bookCover").alt = selectedBook.title + " summary cover";

            const selectedBookSlug = selectedBook.slug || slugify(selectedBook.title || resolvedBookKey);
            const canonicalBookUrl = buildCanonicalBookUrl(selectedBookSlug);
            if (window.SeoManager) {
                window.SeoManager.setBookSeo({
                    siteName: "Phat Hmat Tway",
                    title: selectedBook.title,
                    description: selectedBook.description,
                    image: selectedBook.cover,
                    url: canonicalBookUrl
                });
                window.SeoManager.setBookSchema({
                    name: selectedBook.title,
                    author: selectedBook.author,
                    genre: selectedBook.genre || inferGenre(resolvedBookKey, selectedBook),
                    description: selectedBook.description,
                    image: selectedBook.cover,
                    url: canonicalBookUrl,
                    ratingValue: "4.8",
                    ratingCount: "120"
                });
            }

            const defaultAudioSrc = "audio/" + (selectedBookSlug || resolvedBookKey) + ".mp3";
            audioElement.src = selectedBook.audio || defaultAudioSrc;
            renderSummary(selectedBook);
        } else {
            const descEl = document.getElementById("bookDescription");
            descEl.textContent = "";
            descEl.classList.add("hidden");
            renderSummary(null);
        }

        function setAudioStatus(message) {
            if (!audioStatus) return;
            audioStatus.textContent = message || "";
            audioStatus.classList.toggle("hidden", !message);
        }

        function setPlayableState({ playable }) {
            playPauseBtn.disabled = !playable;
            playPauseBtn.setAttribute("aria-disabled", playable ? "false" : "true");
            playPauseBtn.style.opacity = playable ? "" : "0.5";
            playPauseBtn.style.cursor = playable ? "" : "not-allowed";
        }

        if (selectedBook) {
            setPlayableState({ playable: true });
            setAudioStatus("");
        } else {
            setPlayableState({ playable: false });
            setAudioStatus("Unknown book. Please open this page from the library links.");
            durationText.textContent = "";
        }

        playPauseBtn.addEventListener("click", function () {
            if (!audioElement.src) {
                return;
            }
            if (audioElement.paused) {
                audioElement.play().catch(function () {
                    playPauseBtn.textContent = "▶";
                });
            } else {
                audioElement.pause();
            }
        });

        audioElement.addEventListener("play", function () {
            playPauseBtn.textContent = "⏸";
        });

        audioElement.addEventListener("pause", function () {
            playPauseBtn.textContent = "▶";
        });

        audioElement.addEventListener("loadedmetadata", function () {
            if (!isNaN(audioElement.duration) && audioElement.duration > 0) {
                const minutes = Math.ceil(audioElement.duration / 60);
                durationText.textContent = minutes + " min";
            }
        });

        audioElement.addEventListener("timeupdate", function () {
            if (audioElement.duration > 0) {
                const percent = (audioElement.currentTime / audioElement.duration) * 100;
                progressValue.style.width = percent + "%";
            }
        });

        audioElement.addEventListener("error", function () {
            // Common causes: file missing, wrong path, server not serving static files.
            setPlayableState({ playable: false });
            setAudioStatus("Audio file not found. Add the MP3 in the `audio/` folder or fix the `audio:` path in summary.html.");
            playPauseBtn.textContent = "▶";
            durationText.textContent = "";
            progressValue.style.width = "0%";
        });
    </script>
</body>
</html>
